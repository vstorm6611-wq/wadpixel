/* ══════════════ EXPORT ══════════════ */
function flattenFrame(idx){
  const c = document.createElement('canvas');
  c.width = S.W; c.height = S.H;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(const layer of S.layers){
    if(!layer.visible) continue;
    const data = layer.frames[idx];
    if(!data) continue;
    sctx.putImageData(new ImageData(new Uint8ClampedArray(data), S.W, S.H), 0, 0);
    ctx.globalAlpha = layer.opacity;
    ctx.drawImage(scratch, 0, 0);
  }
  ctx.globalAlpha = 1;
  return c;
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function expStatus(msg){ const e = $('expStatus'); if(e) e.textContent = msg; }

async function exportSheet(){
  expStatus('กำลังสร้าง sprite sheet…');
  const cols = Math.min(S.frameCount, Math.ceil(Math.sqrt(S.frameCount)));
  const rows = Math.ceil(S.frameCount / cols);
  const c = document.createElement('canvas');
  c.width = S.W*cols; c.height = S.H*rows;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(let i=0;i<S.frameCount;i++){
    const f = flattenFrame(i);
    ctx.drawImage(f, (i%cols)*S.W, Math.floor(i/cols)*S.H);
  }
  c.toBlob(b=>{
    download(b, `spritesheet_${S.W}x${S.H}_${cols}x${rows}.png`);
    expStatus(`เสร็จ · ${cols}×${rows} เฟรม`);
  }, 'image/png');
}
async function exportZip(){
  if(typeof JSZip === 'undefined'){ expStatus('โหลด JSZip ไม่สำเร็จ — ตรวจอินเทอร์เน็ต'); return; }
  expStatus('กำลังบีบอัด…');
  const zip = new JSZip();
  for(let i=0;i<S.frameCount;i++){
    const f = flattenFrame(i);
    const blob = await new Promise(r=>f.toBlob(r,'image/png'));
    zip.file(`frame_${String(i+1).padStart(3,'0')}.png`, blob);
  }
  const out = await zip.generateAsync({type:'blob'});
  download(out, `frames_${S.W}x${S.H}.zip`);
  expStatus(`เสร็จ · ${S.frameCount} ไฟล์`);
}
function exportGif(){
  if(typeof GIF === 'undefined'){ expStatus('โหลด gif.js ไม่สำเร็จ — ตรวจอินเทอร์เน็ต'); return; }
  expStatus('กำลังเข้ารหัส GIF…');
  const scale = Math.max(1, Math.min(8, Math.floor(512/Math.max(S.W,S.H))));
  const gif = new GIF({
    workers: 2, quality: 1, width: S.W*scale, height: S.H*scale,
    workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
  });
  for(let i=0;i<S.frameCount;i++){
    const f = flattenFrame(i);
    const c = document.createElement('canvas');
    c.width = S.W*scale; c.height = S.H*scale;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(f, 0, 0, c.width, c.height);
    gif.addFrame(c, {delay: 1000/S.fps});
  }
  gif.on('progress', p => expStatus('เข้ารหัส ' + Math.round(p*100) + '%'));
  gif.on('finished', blob => {
    download(blob, `animation_${S.fps}fps.gif`);
    expStatus('เสร็จ · GIF ' + (S.W*scale) + '×' + (S.H*scale));
  });
  gif.render();
}

/* ══════════════ SAVE / LOAD ══════════════ */
const STORE_PREFIX = 'pxloom:';
const STORE_INDEX  = 'pxloom:index';
const AUTOSAVE_KEY = 'pxloom:auto';
const FORMAT_VER   = 1;

/* Hybrid codec: RLE for flat pixel art, base64 fallback for noisy data
   so worst case is 1.33x raw instead of RLE's 2.25x blowup. */
function encodeRLE(data){
  const out = []; let i = 0; const n = data.length;
  while(i < n){
    const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
    let count = 1, j = i+4;
    while(j<n && data[j]===r && data[j+1]===g && data[j+2]===b && data[j+3]===a && count<65535){
      count++; j += 4;
    }
    if(a === 0) out.push(count + 'z');
    else out.push(count + ':' + ((r<<16|g<<8|b)>>>0).toString(16).padStart(6,'0') + (a===255 ? '' : ','+a));
    i = j;
  }
  return out.join('|');
}
function decodeRLE(str, pxCount){
  const data = new Uint8ClampedArray(pxCount*4);
  if(!str) return data;
  let p = 0;
  for(const tok of str.split('|')){
    if(!tok) continue;
    if(tok.endsWith('z')){ p += parseInt(tok,10)*4; continue; }
    const ci = tok.indexOf(':');
    const count = parseInt(tok.slice(0,ci),10);
    let rest = tok.slice(ci+1); let a = 255;
    const c = rest.indexOf(',');
    if(c >= 0){ a = parseInt(rest.slice(c+1),10); rest = rest.slice(0,c); }
    const v = parseInt(rest,16);
    const r=(v>>16)&255, g=(v>>8)&255, b=v&255;
    for(let k=0;k<count;k++){ data[p]=r; data[p+1]=g; data[p+2]=b; data[p+3]=a; p+=4; }
  }
  return data;
}
function b64enc(data){
  let s = ''; const CH = 8192;
  for(let i=0;i<data.length;i+=CH) s += String.fromCharCode.apply(null, data.subarray(i, i+CH));
  return btoa(s);
}
function b64dec(str){
  const bin = atob(str);
  const out = new Uint8ClampedArray(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function packFrame(data){
  const rle = encodeRLE(data);
  const raw = b64enc(data);
  return rle.length <= raw.length ? ['r', rle] : ['b', raw];
}
function unpackFrame(pair, pxCount){
  if(!pair) return new Uint8ClampedArray(pxCount*4);
  return pair[0] === 'r' ? decodeRLE(pair[1], pxCount) : b64dec(pair[1]);
}

function serialize(name){
  commitFloat();
  return {
    v: FORMAT_VER,
    name: name || 'ไม่มีชื่อ',
    w: S.W, h: S.H,
    fps: S.fps,
    frameCount: S.frameCount,
    tags: S.tags,
    tileMode: S.tileMode,
    palette: S.palette,
    recent: S.recent,
    saved: Date.now(),
    layers: S.layers.map(L => ({
      n: L.name, v: L.visible, o: L.opacity,
      f: L.frames.map(packFrame)
    }))
  };
}
function deserialize(obj){
  if(!obj || !obj.layers || !obj.w || !obj.h) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
  const px = obj.w * obj.h;
  S.W = obj.w; S.H = obj.h;
  S.fps = obj.fps || 8;
  S.tags = Array.isArray(obj.tags) ? obj.tags : [];
  S.tileMode = !!obj.tileMode;
  S.palette = Array.isArray(obj.palette) ? obj.palette.slice(0,64) : DEFAULT_PALETTE.slice();
  S.recent = Array.isArray(obj.recent) ? obj.recent.slice(0,MAX_RECENT) : [];
  S.frameCount = obj.frameCount || (obj.layers[0] && obj.layers[0].f.length) || 1;
  S.layers = obj.layers.map((L,i) => ({
    name: L.n || ('Layer '+(i+1)),
    visible: L.v !== false,
    opacity: typeof L.o === 'number' ? L.o : 1,
    frames: (()=> {
      const fr = L.f.map(p => unpackFrame(p, px));
      while(fr.length < S.frameCount) fr.push(new Uint8ClampedArray(px*4));
      return fr;
    })()
  }));
  if(!S.layers.length) S.layers = [{name:'Layer 1', visible:true, opacity:1, frames:[new Uint8ClampedArray(px*4)]}];
  S.curLayer = 0; S.curFrame = 0;
  S.undoStack = []; S.redoStack = [];
  buf.width = S.W; buf.height = S.H;
  scratch.width = S.W; scratch.height = S.H;
  $('fps').value = S.fps; $('fpsVal').textContent = S.fps + ' fps';
  $('btnTile').classList.toggle('on', S.tileMode);
  buildPalette();
  renderRecent();
  bufDirty = true;
  fitToScreen();
  renderAll();
  updateUndoBtns();
}

function readIndex(){
  try { return JSON.parse(localStorage.getItem(STORE_INDEX) || '[]'); }
  catch(e){ return []; }
}
function writeIndex(idx){
  localStorage.setItem(STORE_INDEX, JSON.stringify(idx));
}
function storageUsed(){
  let total = 0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('pxloom:')) total += (localStorage.getItem(k)||'').length;
  }
  return total;
}
function thumbDataURL(){
  const c = document.createElement('canvas');
  const sz = 48;
  const scale = Math.min(sz/S.W, sz/S.H);
  c.width = Math.max(1, Math.round(S.W*scale));
  c.height = Math.max(1, Math.round(S.H*scale));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  const flat = flattenFrame(0);
  ctx.drawImage(flat, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}

let curProjectId = null;
let curProjectName = null;

function saveProject(name, id){
  const payload = serialize(name);
  let pid = id;
  if(!pid){
    // Date.now() alone collides when two saves land in the same millisecond,
    // which silently overwrote the earlier project.
    do {
      pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    } while(localStorage.getItem(STORE_PREFIX + pid) !== null);
  }
  const json = JSON.stringify(payload);
  try {
    localStorage.setItem(STORE_PREFIX + pid, json);
  } catch(err){
    throw new Error('พื้นที่เก็บเต็ม — ลบโปรเจกต์เก่าออกก่อน หรือส่งออกเป็นไฟล์ .json');
  }
  const idx = readIndex().filter(p => p.id !== pid);
  idx.unshift({
    id: pid, name: payload.name, w: S.W, h: S.H,
    frames: S.frameCount, layers: S.layers.length,
    saved: payload.saved, size: json.length,
    thumb: thumbDataURL()
  });
  try { writeIndex(idx); }
  catch(err){
    // index too big from thumbnails — drop thumbs and retry
    writeIndex(idx.map(p => ({...p, thumb:''})));
  }
  curProjectId = pid; curProjectName = payload.name;
  dirtySinceSave = false;
  return pid;
}
function loadProject(id){
  const raw = localStorage.getItem(STORE_PREFIX + id);
  if(!raw) throw new Error('ไม่พบโปรเจกต์นี้');
  const obj = JSON.parse(raw);
  deserialize(obj);
  curProjectId = id; curProjectName = obj.name;
  dirtySinceSave = false;
}
function deleteProject(id){
  localStorage.removeItem(STORE_PREFIX + id);
  writeIndex(readIndex().filter(p => p.id !== id));
  if(curProjectId === id){ curProjectId = null; curProjectName = null; }
}

/* ---- file import / export ---- */
function exportProjectFile(){
  const payload = serialize(curProjectName || 'pixel-loom');
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const safe = (payload.name || 'project').replace(/[^\w\u0E00-\u0E7F.-]+/g,'_');
  download(blob, safe + '.pxloom.json');
}
function importProjectFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      deserialize(obj);
      curProjectId = null;
      curProjectName = obj.name || 'นำเข้า';
      dirtySinceSave = true;
      closeModal();
      toast('โหลด "' + curProjectName + '" แล้ว');
    } catch(err){
      toast('เปิดไฟล์ไม่ได้: ' + err.message, 2600);
    }
  };
  rd.onerror = () => toast('อ่านไฟล์ไม่สำเร็จ');
  rd.readAsText(file);
}

/* ---- autosave ---- */
let dirtySinceSave = false;
let autosaveTimer = null;
function markProjectDirty(){
  dirtySinceSave = true;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(runAutosave, 3000);
}
function runAutosave(){
  if(!dirtySinceSave) return;
  try {
    const payload = serialize(curProjectName || 'งานล่าสุด');
    payload.autoOf = curProjectId;
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    const dot = $('saveDot');
    dot.classList.add('on');
    setTimeout(()=>dot.classList.remove('on'), 1200);
  } catch(err){
    // silent — autosave failure shouldn't interrupt drawing
  }
}
function hasAutosave(){
  return !!localStorage.getItem(AUTOSAVE_KEY);
}
function restoreAutosave(){
  const raw = localStorage.getItem(AUTOSAVE_KEY);
  if(!raw) return false;
  try {
    const obj = JSON.parse(raw);
    deserialize(obj);
    curProjectId = obj.autoOf || null;
    curProjectName = obj.name || null;
    dirtySinceSave = false;
    return true;
  } catch(e){ return false; }
}

/* ---- restore point: snapshot taken immediately before a destructive op.
   Kept in its own slot so the 3s autosave can't overwrite it. ---- */
const RESTORE_KEY = 'pxloom:restore';
function saveRestorePoint(label){
  try {
    const payload = serialize(curProjectName || 'งานล่าสุด');
    payload.restoreOf = curProjectId;
    payload.label = label;
    payload.at = Date.now();
    localStorage.setItem(RESTORE_KEY, JSON.stringify(payload));
    return true;
  } catch(err){
    return false;   // out of space — caller decides whether to warn
  }
}
function getRestorePoint(){
  const raw = localStorage.getItem(RESTORE_KEY);
  if(!raw) return null;
  try { return JSON.parse(raw); } catch(e){ return null; }
}
function useRestorePoint(){
  const obj = getRestorePoint();
  if(!obj) return false;
  try {
    deserialize(obj);
    curProjectId = obj.restoreOf || null;
    curProjectName = obj.name || null;
    localStorage.removeItem(RESTORE_KEY);
    dirtySinceSave = true;
    return true;
  } catch(e){ return false; }
}

/* ══════════════ RESIZE / CROP ══════════════ */
/* Anchor grid: 0=TL 1=TC 2=TR / 3=ML 4=C 5=MR / 6=BL 7=BC 8=BR */
function resizeCanvasData(src, sw, sh, dw, dh, anchor){
  const dst = new Uint8ClampedArray(dw*dh*4);
  const col = anchor % 3, row = (anchor/3)|0;
  const offX = Math.round((dw - sw) * (col/2));
  const offY = Math.round((dh - sh) * (row/2));
  for(let y=0;y<sh;y++){
    const dy = y + offY;
    if(dy<0 || dy>=dh) continue;
    for(let x=0;x<sw;x++){
      const dx = x + offX;
      if(dx<0 || dx>=dw) continue;
      const si=(y*sw+x)*4, di=(dy*dw+dx)*4;
      dst[di]=src[si]; dst[di+1]=src[si+1]; dst[di+2]=src[si+2]; dst[di+3]=src[si+3];
    }
  }
  return dst;
}
function scaleCanvasData(src, sw, sh, dw, dh){
  const dst = new Uint8ClampedArray(dw*dh*4);
  for(let y=0;y<dh;y++){
    const sy = Math.min(sh-1, Math.floor(y*sh/dh));
    for(let x=0;x<dw;x++){
      const sx = Math.min(sw-1, Math.floor(x*sw/dw));
      const si=(sy*sw+sx)*4, di=(y*dw+x)*4;
      dst[di]=src[si]; dst[di+1]=src[si+1]; dst[di+2]=src[si+2]; dst[di+3]=src[si+3];
    }
  }
  return dst;
}
function cropData(src, sw, sh, rx, ry, rw, rh){
  const dst = new Uint8ClampedArray(rw*rh*4);
  for(let y=0;y<rh;y++){
    const sy = ry+y;
    if(sy<0||sy>=sh) continue;
    for(let x=0;x<rw;x++){
      const sx = rx+x;
      if(sx<0||sx>=sw) continue;
      const si=(sy*sw+sx)*4, di=(y*rw+x)*4;
      dst[di]=src[si]; dst[di+1]=src[si+1]; dst[di+2]=src[si+2]; dst[di+3]=src[si+3];
    }
  }
  return dst;
}
/* Bounding box of all non-transparent pixels across every layer and frame */
function contentBounds(){
  let minX=S.W, minY=S.H, maxX=-1, maxY=-1;
  for(const L of S.layers){
    if(!L.visible) continue;
    for(const f of L.frames){
      for(let y=0;y<S.H;y++){
        const row = y*S.W;
        for(let x=0;x<S.W;x++){
          if(f[(row+x)*4+3] !== 0){
            if(x<minX) minX=x; if(x>maxX) maxX=x;
            if(y<minY) minY=y; if(y>maxY) maxY=y;
          }
        }
      }
    }
  }
  if(maxX < 0) return null;
  return {x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1};
}

/* Apply a transform across every layer and frame, then rebind canvas state */
function applyTransform(newW, newH, fn, label){
  commitFloat();
  S.sel = null;
  const saved = saveRestorePoint(label || 'ปรับขนาด');
  for(const L of S.layers){
    L.frames = L.frames.map(f => fn(f));
  }
  S.W = newW; S.H = newH;
  buf.width = newW; buf.height = newH;
  scratch.width = newW; scratch.height = newH;
  S.undoStack = []; S.redoStack = [];
  updateUndoBtns();
  bufDirty = true;
  fitToScreen();
  renderAll();
  markProjectDirty();
  showRestoreBar(saved);
}
function doResize(w, h, anchor){
  const ow = S.W, oh = S.H;
  applyTransform(w, h, f => resizeCanvasData(f, ow, oh, w, h, anchor), `ก่อนปรับเป็น ${w}×${h}`);
}
function doScale(w, h){
  const ow = S.W, oh = S.H;
  applyTransform(w, h, f => scaleCanvasData(f, ow, oh, w, h), `ก่อนยืดเป็น ${w}×${h}`);
}
function doCropToContent(){
  const b = contentBounds();
  if(!b){ toast('ผืนผ้าใบว่าง — ไม่มีอะไรให้ตัด'); return false; }
  if(b.w === S.W && b.h === S.H){ toast('งานเต็มผืนผ้าใบอยู่แล้ว'); return false; }
  const ow = S.W, oh = S.H;
  applyTransform(b.w, b.h, f => cropData(f, ow, oh, b.x, b.y, b.w, b.h), `ก่อนตัดเหลือ ${b.w}×${b.h}`);
  return b;
}

/* ══════════════ ANIMATION TAGS & ATLAS ══════════════ */
/* Tags let one timeline hold several named clips: idle 0-3, walk 4-9, etc.
   Without tags the whole timeline exports as a single clip. */
function sheetLayout(){
  const cols = Math.min(S.frameCount, Math.ceil(Math.sqrt(S.frameCount)));
  const rows = Math.ceil(S.frameCount / cols);
  return {cols, rows, w:S.W*cols, h:S.H*rows};
}
function frameRect(i, cols){
  return {x:(i%cols)*S.W, y:Math.floor(i/cols)*S.H, w:S.W, h:S.H};
}
function effectiveTags(){
  if(S.tags && S.tags.length) return S.tags;
  return [{name:'animation', from:0, to:S.frameCount-1}];
}
function baseName(){
  return (curProjectName || 'sprite').replace(/[^\w\u0E00-\u0E7F-]+/g,'_') || 'sprite';
}

/* ---- Phaser 3 / TexturePacker JSON Hash ---- */
function buildPhaserAtlas(imageName){
  const {cols, rows, w, h} = sheetLayout();
  const frames = {};
  for(let i=0;i<S.frameCount;i++){
    const r = frameRect(i, cols);
    frames[baseName()+'_'+String(i).padStart(3,'0')] = {
      frame: {x:r.x, y:r.y, w:r.w, h:r.h},
      rotated: false,
      trimmed: false,
      spriteSourceSize: {x:0, y:0, w:S.W, h:S.H},
      sourceSize: {w:S.W, h:S.H},
      pivot: {x:0.5, y:0.5}
    };
  }
  return {
    frames,
    meta: {
      app: 'Pixel Loom',
      version: '1.0',
      image: imageName,
      format: 'RGBA8888',
      size: {w, h},
      scale: '1',
      fps: S.fps,
      frameTags: effectiveTags().map(t => ({name:t.name, from:t.from, to:t.to, direction:'forward'}))
    }
  };
}

/* ---- Aseprite-compatible JSON Array (widely supported interchange) ---- */
function buildAsepriteAtlas(imageName){
  const {cols, rows, w, h} = sheetLayout();
  const dur = Math.round(1000/S.fps);
  const frames = [];
  for(let i=0;i<S.frameCount;i++){
    const r = frameRect(i, cols);
    frames.push({
      filename: baseName()+' '+i+'.png',
      frame: {x:r.x, y:r.y, w:r.w, h:r.h},
      rotated: false,
      trimmed: false,
      spriteSourceSize: {x:0, y:0, w:S.W, h:S.H},
      sourceSize: {w:S.W, h:S.H},
      duration: dur
    });
  }
  return {
    frames,
    meta: {
      app: 'Pixel Loom',
      version: '1.0',
      image: imageName,
      format: 'RGBA8888',
      size: {w, h},
      scale: '1',
      frameTags: effectiveTags().map(t => ({name:t.name, from:t.from, to:t.to, direction:'forward'})),
      layers: S.layers.map(L => ({name:L.name, opacity:Math.round(L.opacity*255), blendMode:'normal'}))
    }
  };
}

/* ---- Godot 4 SpriteFrames .tres ----
   Godot does not parse arbitrary JSON, so we emit a real resource file:
   one AtlasTexture sub-resource per frame, grouped into named animations. */
function buildGodotTres(imageName){
  const {cols} = sheetLayout();
  const tags = effectiveTags();
  const texId = 'Texture2D_pxl00';
  let subs = '';
  let loadSteps = 1;

  const animBlocks = tags.map(t => {
    const frameLines = [];
    for(let i=t.from; i<=t.to && i<S.frameCount; i++){
      const r = frameRect(i, cols);
      const id = 'AtlasTexture_f'+i;
      subs += `[sub_resource type="AtlasTexture" id="${id}"]\n`
           +  `atlas = ExtResource("${texId}")\n`
           +  `region = Rect2(${r.x}, ${r.y}, ${r.w}, ${r.h})\n\n`;
      loadSteps++;
      frameLines.push(`{\n"duration": 1.0,\n"texture": SubResource("${id}")\n}`);
    }
    return `{\n"frames": [${frameLines.join(', ')}],\n"loop": true,\n"name": &"${t.name}",\n"speed": ${S.fps}.0\n}`;
  });

  return `[gd_resource type="SpriteFrames" load_steps=${loadSteps+1} format=3]\n\n`
       + `[ext_resource type="Texture2D" path="res://${imageName}" id="${texId}"]\n\n`
       + subs
       + `[resource]\nanimations = [${animBlocks.join(', ')}]\n`;
}


/* ══════════════ SELECTION ══════════════ */
/* Selection lifecycle:
   1. drag with the select tool -> S.sel = {x,y,w,h} marquee
   2. first drag inside the marquee LIFTS those pixels into S.float
      (clearing them from the layer) so they can be dragged freely
   3. commit stamps S.float back down; Esc/tool-change/other actions commit too */
function clearSelection(){
  if(S.float) commitFloat();
  S.sel = null;
  S.selDrag = null;
  markDirty();
}
function normRect(x0,y0,x1,y1){
  const x = Math.min(x0,x1), y = Math.min(y0,y1);
  return {x, y, w: Math.abs(x1-x0)+1, h: Math.abs(y1-y0)+1};
}
function clampRectToCanvas(r){
  const x0 = Math.max(0, r.x), y0 = Math.max(0, r.y);
  const x1 = Math.min(S.W, r.x+r.w), y1 = Math.min(S.H, r.y+r.h);
  if(x1<=x0 || y1<=y0) return null;
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
/* Copy the selected region out of the current layer into a standalone buffer */
function extractRegion(data, r){
  const out = new Uint8ClampedArray(r.w*r.h*4);
  for(let y=0;y<r.h;y++){
    for(let x=0;x<r.w;x++){
      const sx=r.x+x, sy=r.y+y;
      if(sx<0||sy<0||sx>=S.W||sy>=S.H) continue;
      const si=(sy*S.W+sx)*4, di=(y*r.w+x)*4;
      out[di]=data[si]; out[di+1]=data[si+1]; out[di+2]=data[si+2]; out[di+3]=data[si+3];
    }
  }
  return out;
}
function eraseRegion(data, r){
  for(let y=0;y<r.h;y++){
    for(let x=0;x<r.w;x++){
      const sx=r.x+x, sy=r.y+y;
      if(sx<0||sy<0||sx>=S.W||sy>=S.H) continue;
      const i=(sy*S.W+sx)*4;
      data[i]=0; data[i+1]=0; data[i+2]=0; data[i+3]=0;
    }
  }
}
/* Stamp a floating buffer onto a layer. Transparent source pixels don't erase. */
function stampRegion(data, buffer, r){
  const wrapc = (v,n)=>((v%n)+n)%n;
  for(let y=0;y<r.h;y++){
    for(let x=0;x<r.w;x++){
      const si=(y*r.w+x)*4;
      if(buffer[si+3]===0) continue;
      let dx=r.x+x, dy=r.y+y;
      if(S.tileMode){ dx=wrapc(dx,S.W); dy=wrapc(dy,S.H); }
      else if(dx<0||dy<0||dx>=S.W||dy>=S.H) continue;
      const di=(dy*S.W+dx)*4;
      data[di]=buffer[si]; data[di+1]=buffer[si+1]; data[di+2]=buffer[si+2]; data[di+3]=buffer[si+3];
    }
  }
}
/* Lift selected pixels off the layer so they can be moved */
function liftSelection(){
  if(!S.sel || S.float) return;
  const r = clampRectToCanvas(S.sel);
  if(!r) return;
  pushUndo();
  const data = curData();
  S.float = extractRegion(data, r);
  S.floatRect = {...r};
  eraseRegion(data, r);
  markDirty();
}
/* Put the floating pixels back down at their current position */
function commitFloat(){
  if(!S.float) return;
  stampRegion(curData(), S.float, S.floatRect);
  S.sel = {...S.floatRect};
  S.float = null;
  S.floatRect = null;
  markDirty();
  refreshThumbs();
}
function nudgeFloat(dx, dy){
  if(!S.sel) return;
  if(!S.float) liftSelection();
  if(!S.float) return;
  S.floatRect.x += dx; S.floatRect.y += dy;
  markDirty();
}
function deleteSelection(){
  if(S.float){
    // discard the lifted pixels entirely
    S.float = null; S.floatRect = null;
    S.sel = null;
    markDirty(); refreshThumbs();
    toast('ลบแล้ว');
    return;
  }
  if(!S.sel) return;
  const r = clampRectToCanvas(S.sel);
  if(!r) return;
  pushUndo();
  eraseRegion(curData(), r);
  markDirty(); refreshThumbs();
  toast('ลบแล้ว');
}
function copySelection(){
  const r = S.float ? S.floatRect : (S.sel && clampRectToCanvas(S.sel));
  if(!r){ toast('ยังไม่ได้เลือกพื้นที่'); return; }
  S.clip = {
    data: S.float ? new Uint8ClampedArray(S.float) : extractRegion(curData(), r),
    w: r.w, h: r.h
  };
  toast(`คัดลอก ${r.w}×${r.h} แล้ว`);
}
function cutSelection(){
  copySelection();
  if(S.clip) deleteSelection();
}
function pasteClip(){
  if(!S.clip){ toast('ยังไม่มีอะไรให้วาง'); return; }
  commitFloat();
  // paste into the middle of the current view so it's always visible
  const vw = view.width/dpr, vh = view.height/dpr;
  const cx = Math.floor((vw/2 - S.panX)/S.zoom - S.clip.w/2);
  const cy = Math.floor((vh/2 - S.panY)/S.zoom - S.clip.h/2);
  pushUndo();
  S.float = new Uint8ClampedArray(S.clip.data);
  S.floatRect = {x:cx, y:cy, w:S.clip.w, h:S.clip.h};
  S.sel = {...S.floatRect};
  selectTool('select');
  markDirty();
  toast('วางแล้ว — ลากเพื่อย้าย');
}
function selectAll(){
  commitFloat();
  S.sel = {x:0, y:0, w:S.W, h:S.H};
  selectTool('select');
  markDirty();
}
/* Flip / rotate operate on the float if present, else the whole layer frame */
function transformSelection(kind){
  const hadFloat = !!S.float;
  if(!hadFloat && S.sel) liftSelection();
  let src, w, h;
  if(S.float){ src = S.float; w = S.floatRect.w; h = S.floatRect.h; }
  else {
    pushUndo();
    src = curData(); w = S.W; h = S.H;
  }
  const out = new Uint8ClampedArray(src.length);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let nx = x, ny = y;
      if(kind === 'flipH') nx = w-1-x;
      else if(kind === 'flipV') ny = h-1-y;
      const si=(y*w+x)*4, di=(ny*w+nx)*4;
      out[di]=src[si]; out[di+1]=src[si+1]; out[di+2]=src[si+2]; out[di+3]=src[si+3];
    }
  }
  if(S.float) S.float = out;
  else curData().set(out);
  markDirty(); refreshThumbs();
  toast(kind === 'flipH' ? 'พลิกแนวนอน' : 'พลิกแนวตั้ง');
}

/* marching-ants style marquee overlay */
function drawSelectionOverlay(z, ox, oy){
  const r = S.float ? S.floatRect : S.sel;
  if(!r) return;
  const x = ox + r.x*z, y = oy + r.y*z, w = r.w*z, h = r.h*z;
  vctx.save();
  vctx.setLineDash([6, 5]);
  vctx.lineDashOffset = -(Date.now()/55) % 11;
  vctx.strokeStyle = '#ffffff'; vctx.lineWidth = 2;
  vctx.strokeRect(x, y, w, h);
  vctx.setLineDash([6, 5]);
  vctx.lineDashOffset = (-(Date.now()/55) % 11) + 5.5;
  vctx.strokeStyle = '#000000'; vctx.lineWidth = 2;
  vctx.strokeRect(x, y, w, h);
  vctx.restore();
  if(S.float) selNeedsAnim = true;
}


/* ══════════════ PNG IMPORT ══════════════ */
/* Reads any image the browser can decode into a raw RGBA buffer at its
   natural size. Nearest-neighbour only — never let the browser smooth it. */
function loadImageFile(file){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/') && !/\.(png|gif|bmp|webp|jpe?g)$/i.test(file.name)){
      reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h) throw new Error('อ่านขนาดภาพไม่ได้');
        if(w > 2048 || h > 2048) throw new Error(`ภาพใหญ่เกินไป (${w}×${h}) — จำกัดที่ 2048px`);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', {willReadFrequently:true});
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, w, h).data;
        URL.revokeObjectURL(url);
        resolve({data: new Uint8ClampedArray(data), w, h, name: file.name});
      } catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('เปิดไฟล์ภาพไม่สำเร็จ — อาจเสียหายหรือไม่รองรับ'));
    };
    img.src = url;
  });
}

/* Place an imported image into the project.
   mode: 'newproject' | 'layer' | 'float'
   fit:  'center' | 'scale' | 'resize' */
function placeImage(img, mode, fit, opts){
  opts = opts || {};
  let src = img.data, sw = img.w, sh = img.h;

  if(mode === 'newproject'){
    commitFloat();
    S.W = sw; S.H = sh;
    S.layers = [{name:'Layer 1', visible:true, opacity:1, frames:[new Uint8ClampedArray(src)]}];
    S.frameCount = 1; S.curLayer = 0; S.curFrame = 0;
    S.tags = []; S.sel = null; S.float = null; S.floatRect = null;
    S.undoStack = []; S.redoStack = [];
    buf.width = sw; buf.height = sh;
    scratch.width = sw; scratch.height = sh;
    bufDirty = true;
    fitToScreen(); renderAll(); updateUndoBtns();
    markProjectDirty();
    return {w:sw, h:sh};
  }

  // reconcile size mismatch against the current canvas
  if(fit === 'scale' && (sw !== S.W || sh !== S.H)){
    src = scaleCanvasData(src, sw, sh, S.W, S.H);
    sw = S.W; sh = S.H;
  } else if(fit === 'resize' && (sw > S.W || sh > S.H)){
    const nw = Math.max(S.W, sw), nh = Math.max(S.H, sh);
    const ow = S.W, oh = S.H;
    applyTransform(nw, nh, f => resizeCanvasData(f, ow, oh, nw, nh, 0), 'ก่อนนำเข้าภาพ');
  }

  if(mode === 'layer'){
    const frames = [];
    for(let i=0;i<S.frameCount;i++) frames.push(new Uint8ClampedArray(S.W*S.H*4));
    const target = frames[S.curFrame];
    const offX = opts.center ? Math.floor((S.W - sw)/2) : 0;
    const offY = opts.center ? Math.floor((S.H - sh)/2) : 0;
    for(let y=0;y<sh;y++){
      const dy = y + offY;
      if(dy<0 || dy>=S.H) continue;
      for(let x=0;x<sw;x++){
        const dx = x + offX;
        if(dx<0 || dx>=S.W) continue;
        const si=(y*sw+x)*4, di=(dy*S.W+dx)*4;
        target[di]=src[si]; target[di+1]=src[si+1]; target[di+2]=src[si+2]; target[di+3]=src[si+3];
      }
    }
    const nm = (img.name || 'imported').replace(/\.[^.]+$/,'').slice(0,24);
    S.layers.push({
      name: nm || 'นำเข้า',
      visible: true,
      opacity: opts.opacity != null ? opts.opacity : 1,
      frames
    });
    S.curLayer = S.layers.length - 1;
    S.undoStack = []; S.redoStack = []; updateUndoBtns();
    bufDirty = true; renderAll(); markProjectDirty();
    return {w:sw, h:sh};
  }

  // 'float': drop in as a moveable selection on the current layer
  commitFloat();
  pushUndo();
  S.float = new Uint8ClampedArray(src);
  const cx = Math.floor((S.W - sw)/2), cy = Math.floor((S.H - sh)/2);
  S.floatRect = {x:cx, y:cy, w:sw, h:sh};
  S.sel = {...S.floatRect};
  selectTool('select');
  bufDirty = true; markDirty(); updateSelBar();
  return {w:sw, h:sh};
}

function fmtTime(ts){
  const d = new Date(ts), now = Date.now();
  const diff = (now - ts)/1000;
  if(diff < 60) return 'เมื่อครู่';
  if(diff < 3600) return Math.floor(diff/60) + ' นาทีที่แล้ว';
  if(diff < 86400) return Math.floor(diff/3600) + ' ชม.ที่แล้ว';
  return d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtSize(n){
  return n < 1024 ? n+' B' : (n/1024 < 1024 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB');
}

      msg = `ยืดภาพจาก <b>${ow}×${oh}</b> เป็น <b>${w}×${h}</b><br>`
          + `ทุกพิกเซลถูกสุ่มใหม่แบบ nearest-neighbour · RAM ≈ <b>${mem.toFixed(1)} MB</b>`;
      if(!clean) msg += `<br><span class="warn-inline">อัตราส่วนไม่ลงตัว — พิกเซลจะไม่เท่ากันทุกช่อง</span>`;
      if(newPx < oldPx) msg += `<br><span class="warn-inline">ย่อลงแล้วรายละเอียดหายถาวร</span>`;
    } else {
      const dw = w-ow, dh = h-oh;
      const parts = [];
      if(dw>0) parts.push('กว้างขึ้น '+dw+' px'); else if(dw<0) parts.push('ตัดกว้าง '+(-dw)+' px');
      if(dh>0) parts.push('สูงขึ้น '+dh+' px'); else if(dh<0) parts.push('ตัดสูง '+(-dh)+' px');
      msg = `ผืนผ้าใบ <b>${ow}×${oh}</b> → <b>${w}×${h}</b><br>`
          + (parts.length ? parts.join(' · ') : 'ขนาดเท่าเดิม')
          + `<br>ภาพเดิมคงขนาดพิกเซลไว้ · RAM ≈ <b>${mem.toFixed(1)} MB</b>`;
      if(dw<0 || dh<0) msg += `<br><span class="warn-inline">ส่วนที่อยู่นอกกรอบใหม่จะถูกตัดทิ้งถาวร</span>`;
    }
    prev.innerHTML = msg;

    if(mem > 220){ warn.textContent = 'ใหญ่มาก — บนมือถืออาจค้างหรือแท็บถูกปิด แนะนำลดเลเยอร์หรือเฟรมก่อน'; warn.classList.add('on'); }
    else if(mem > 90){ warn.textContent = 'กินหน่วยความจำสูง — เซฟงานก่อนปรับ'; warn.classList.add('on'); }
    else warn.classList.remove('on');

    $('anchorWrap').style.display = (mode === 'resize') ? '' : 'none';
    $('rzGo').textContent = (mode === 'scale') ? 'ยืดภาพ' : 'ปรับขนาด';
  }

  let syncing = false;
  wI.oninput = ()=>{
    if(lockRatio && !syncing){ syncing=true; hI.value = Math.max(1, Math.round((+wI.value||1) * oh/ow)); syncing=false; }
    update();
  };
  hI.oninput = ()=>{
    if(lockRatio && !syncing){ syncing=true; wI.value = Math.max(1, Math.round((+hI.value||1) * ow/oh)); syncing=false; }
    update();
  };
  $('rzLock').onchange = e => { lockRatio = e.target.checked; };

  document.querySelectorAll('#rzMode button').forEach(b=>{
    b.onclick = ()=>{
      mode = b.dataset.m;
      document.querySelectorAll('#rzMode button').forEach(x=>x.classList.toggle('on', x===b));
      update();
    };
  });
  document.querySelectorAll('#anchorGrid button').forEach(b=>{
    b.onclick = ()=>{
      anchor = +b.dataset.a;
      document.querySelectorAll('#anchorGrid button').forEach(x=>x.classList.toggle('on', x===b));
    };
  });
  document.querySelectorAll('#rzMult button').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k;
      if(k === 'reset'){ wI.value = ow; hI.value = oh; }
      else {
        wI.value = Math.max(1, Math.round(ow * parseFloat(k)));
        hI.value = Math.max(1, Math.round(oh * parseFloat(k)));
      }
      update();
    };
  });

  $('rzGo').onclick = ()=>{
    const w = Math.max(1, Math.min(1024, +wI.value|0));
    const h = Math.max(1, Math.min(1024, +hI.value|0));
    if(w === ow && h === oh){ toast('ขนาดเท่าเดิม'); return; }
    const shrinking = (mode==='resize') && (w < ow || h < oh);
    const downscaling = (mode==='scale') && (w*h < ow*oh);
    if((shrinking || downscaling) && !confirm('งานบางส่วนจะหายถาวร และ undo ย้อนไม่ได้ — ยืนยันไหม?')) return;
    closeModal();
    setTimeout(()=>{
      if(mode === 'scale') doScale(w, h);
      else doResize(w, h, anchor);
      toast(`ปรับเป็น ${w}×${h} แล้ว`);
    }, 30);
  };
  $('rzCrop').onclick = ()=>{
    const b = contentBounds();
    if(!b){ toast('ผืนผ้าใบว่าง — ไม่มีอะไรให้ตัด'); return; }
    if(b.w === S.W && b.h === S.H){ toast('งานเต็มผืนผ้าใบอยู่แล้ว'); return; }
    if(!confirm(`ตัดเหลือ ${b.w}×${b.h} (จาก ${S.W}×${S.H}) — undo ย้อนไม่ได้ ยืนยันไหม?`)) return;
    closeModal();
    setTimeout(()=>{
      const r = doCropToContent();
      if(r) toast(`ตัดเหลือ ${r.w}×${r.h} แล้ว`);
    }, 30);
  };
  $('rzClose').onclick = closeModal;

  update();
}

function showTags(){
  let draft = S.tags.length
    ? S.tags.map(t=>({...t}))
    : [{name:'idle', from:0, to:Math.max(0,S.frameCount-1)}];

  openModal(`
    <h2>ช่วงอนิเมชั่น</h2>
    <p class="sub">แบ่งไทม์ไลน์ ${S.frameCount} เฟรมเป็นคลิปย่อย เช่น idle, walk, attack — ชื่อและช่วงนี้จะติดไปกับไฟล์ atlas ตอน export</p>
    <div id="tagList"></div>
    <p class="tag-err" id="tagErr"></p>
    <button class="big-btn ghost" id="tagAdd" style="margin-top:0">+ เพิ่มช่วง</button>
    <button class="big-btn" id="tagSave">บันทึก</button>
    <button class="big-btn ghost" id="tagClear">ล้างทั้งหมด (ใช้ทั้งไทม์ไลน์)</button>
  `);

  function validate(){
    const err = $('tagErr');
    for(const t of draft){
      if(!t.name.trim()){ err.textContent='ชื่อช่วงห้ามว่าง'; err.classList.add('on'); return false; }
      if(t.from > t.to){ err.textContent=`"${t.name}": เฟรมเริ่มต้องไม่เกินเฟรมจบ`; err.classList.add('on'); return false; }
      if(t.from < 0 || t.to >= S.frameCount){ err.textContent=`"${t.name}": เฟรมต้องอยู่ระหว่าง 0-${S.frameCount-1}`; err.classList.add('on'); return false; }
    }
    const names = draft.map(t=>t.name.trim());
    if(new Set(names).size !== names.length){ err.textContent='ชื่อช่วงห้ามซ้ำกัน'; err.classList.add('on'); return false; }
    err.classList.remove('on');
    return true;
  }

  function render(){
    const list = $('tagList');
    list.innerHTML = '';
    draft.forEach((t, i)=>{
      const row = document.createElement('div');
      row.className = 'tag-row';
      row.innerHTML = `
        <input class="tn" value="${String(t.name).replace(/"/g,'&quot;')}" placeholder="ชื่อ">
        <input class="tr" type="number" value="${t.from}" min="0" max="${S.frameCount-1}" inputmode="numeric">
        <span class="dash">→</span>
        <input class="tr" type="number" value="${t.to}" min="0" max="${S.frameCount-1}" inputmode="numeric">
        <button class="trm"><svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
      `;
      const [nm, fr, to] = row.querySelectorAll('input');
      nm.oninput = ()=>{ t.name = nm.value; validate(); };
      fr.oninput = ()=>{ t.from = Math.max(0, +fr.value|0); validate(); };
      to.oninput = ()=>{ t.to = Math.max(0, +to.value|0); validate(); };
      row.querySelector('.trm').onclick = ()=>{ draft.splice(i,1); render(); validate(); };
      list.appendChild(row);
    });
    if(!draft.length) list.innerHTML = '<p class="empty-note">ไม่มีช่วง — จะ export เป็นคลิปเดียวทั้งไทม์ไลน์</p>';
  }

  $('tagAdd').onclick = ()=>{
    const last = draft[draft.length-1];
    const start = last ? Math.min(S.frameCount-1, last.to+1) : 0;
    draft.push({name:'clip'+(draft.length+1), from:start, to:Math.max(start, S.frameCount-1)});
    render(); validate();
  };
  $('tagSave').onclick = ()=>{
    if(!validate()) return;
    S.tags = draft.map(t=>({name:t.name.trim(), from:t.from, to:t.to}));
    markProjectDirty();
    closeModal();
    toast(S.tags.length ? `บันทึก ${S.tags.length} ช่วงแล้ว` : 'ล้างช่วงแล้ว');
  };
  $('tagClear').onclick = ()=>{
    S.tags = [];
    markProjectDirty();
    closeModal();
    toast('ใช้ทั้งไทม์ไลน์เป็นคลิปเดียว');
  };
  render();
}

/* ---- atlas exports: sheet PNG + engine metadata, bundled in a zip ---- */
function buildSheetCanvas(){
  commitFloat();
  const {cols, w, h} = sheetLayout();
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(let i=0;i<S.frameCount;i++){
    ctx.drawImage(flattenFrame(i), (i%cols)*S.W, Math.floor(i/cols)*S.H);
  }
  return c;
}
async function exportAtlas(kind){
  if(typeof JSZip === 'undefined'){ expStatus('โหลด JSZip ไม่สำเร็จ — ตรวจอินเทอร์เน็ต'); return; }
  expStatus('กำลังสร้าง atlas…');
  try {
    const base = baseName();
    const imgName = base + '.png';
    const sheet = buildSheetCanvas();
    const png = await new Promise(r => sheet.toBlob(r, 'image/png'));

    const zip = new JSZip();
    zip.file(imgName, png);
    let note;

    if(kind === 'phaser'){
      zip.file(base + '.json', JSON.stringify(buildPhaserAtlas(imgName), null, 2));
      zip.file('README.txt',
        'Phaser 3 texture atlas (JSON Hash)\n\n' +
        'preload():\n' +
        `  this.load.atlas('${base}', '${imgName}', '${base}.json');\n\n` +
        'create():\n' +
        effectiveTags().map(t =>
          `  this.anims.create({\n` +
          `    key: '${t.name}',\n` +
          `    frames: this.anims.generateFrameNames('${base}', {\n` +
          `      prefix: '${base}_', start: ${t.from}, end: ${t.to}, zeroPad: 3\n` +
          `    }),\n` +
          `    frameRate: ${S.fps}, repeat: -1\n` +
          `  });`).join('\n') +
        `\n\n  this.add.sprite(x, y, '${base}').play('${effectiveTags()[0].name}');\n`
      );
      note = 'Phaser 3';
    } else if(kind === 'godot'){
      zip.file(base + '_frames.tres', buildGodotTres(imgName));
      zip.file('README.txt',
        'Godot 4 SpriteFrames\n\n' +
        `1. วาง ${imgName} และ ${base}_frames.tres ไว้ใน res:// (โฟลเดอร์เดียวกัน)\n` +
        '2. เลือกไฟล์ PNG ในแท็บ Import ตั้ง Filter = Nearest แล้วกด Reimport\n' +
        '   (ถ้าไม่ตั้ง ภาพ pixel art จะเบลอ)\n' +
        `3. เพิ่มโหนด AnimatedSprite2D แล้วลาก ${base}_frames.tres ใส่ช่อง Sprite Frames\n\n` +
        'เล่นใน GDScript:\n' +
        effectiveTags().map(t => `  $AnimatedSprite2D.play("${t.name}")`).join('\n') + '\n\n' +
        'หมายเหตุ: ถ้าย้ายไฟล์ ต้องแก้ path ในบรรทัด ext_resource ของ .tres ด้วย\n'
      );
      note = 'Godot 4';
    } else {
      zip.file(base + '.json', JSON.stringify(buildAsepriteAtlas(imgName), null, 2));
      zip.file('README.txt',
        'Aseprite-compatible JSON (JSON Array)\n\n' +
        'รูปแบบกลางที่หลายเอนจินและ importer อ่านได้\n' +
        'เฟรมเรียงซ้าย→ขวา บน→ล่าง · duration เป็นมิลลิวินาทีต่อเฟรม\n' +
        'meta.frameTags บอกช่วงอนิเมชั่นแต่ละคลิป\n'
      );
      note = 'Aseprite JSON';
    }

    const out = await zip.generateAsync({type:'blob'});
    download(out, base + '_' + kind + '.zip');
    const {cols, rows} = sheetLayout();
    expStatus(`เสร็จ · ${note} · ${cols}×${rows} · ${effectiveTags().length} คลิป`);
  } catch(err){
    expStatus('ผิดพลาด: ' + err.message);
  }
}

function showImportImage(img){
  const sameSize = (img.w === S.W && img.h === S.H);
  const bigger = (img.w > S.W || img.h > S.H);
  const hasWork = S.layers.some(L => L.frames.some(f => f.some(v => v !== 0)));

  let mode = hasWork ? 'layer' : 'newproject';
  let fit  = sameSize ? 'center' : (bigger ? 'resize' : 'center');
  let asRef = false;

  openModal(`
    <h2>นำเข้าภาพ</h2>
    <p class="sub"><b>${img.name}</b><br>ขนาด <b>${img.w}×${img.h}</b> · ผืนผ้าใบตอนนี้ <b>${S.W}×${S.H}</b>${sameSize ? ' · ตรงกันพอดี' : ''}</p>

    <div class="sec-lbl">วางยังไง</div>
    <div class="seg" id="imMode">
      <button data-m="newproject"${mode==='newproject'?' class="on"':''}>โปรเจกต์ใหม่</button>
      <button data-m="layer"${mode==='layer'?' class="on"':''}>เลเยอร์ใหม่</button>
      <button data-m="float"${mode==='float'?' class="on"':''}>วางลอย</button>
    </div>

    <div id="imFitWrap" style="${sameSize?'display:none':''}">
      <div class="sec-lbl">ขนาดไม่ตรงกัน</div>
      <div class="seg" id="imFit">
        <button data-f="center"${fit==='center'?' class="on"':''}>วางกลาง</button>
        <button data-f="scale"${fit==='scale'?' class="on"':''}>ย่อ/ขยายให้พอดี</button>
        <button data-f="resize"${fit==='resize'?' class="on"':''}>ขยายผืนผ้าใบ</button>
      </div>
    </div>

    <label class="lock-row" id="imRefWrap"><input type="checkbox" id="imRef"> ใช้เป็นภาพอ้างอิง (จาง 40% ล็อกไว้ trace)</label>
    <label class="lock-row"><input type="checkbox" id="imPal"> ดูดจานสีจากภาพนี้ด้วย</label>

    <div class="rz-preview" id="imPrev"></div>
    <button class="big-btn" id="imGo">นำเข้า</button>
    <button class="big-btn ghost" id="imCancel">ยกเลิก</button>
  `);

  function update(){
    const prev = $('imPrev');
    const fitWrap = $('imFitWrap');
    const refWrap = $('imRefWrap');
    // fit choice is irrelevant when starting a new project
    fitWrap.style.display = (mode === 'newproject' || sameSize) ? 'none' : '';
    refWrap.style.display = (mode === 'layer') ? '' : 'none';

    let msg;
    if(mode === 'newproject'){
      msg = `สร้างโปรเจกต์ใหม่ขนาด <b>${img.w}×${img.h}</b> จากภาพนี้`;
      if(hasWork) msg += `<br><span class="warn-inline">งานที่ทำอยู่จะถูกแทนที่ทั้งหมด</span>`;
    } else {
      let dim = `${img.w}×${img.h}`;
      if(fit === 'scale' && !sameSize) dim = `${S.W}×${S.H} (ย่อ/ขยายจาก ${img.w}×${img.h})`;
      else if(fit === 'resize' && bigger) dim = `${img.w}×${img.h} · ผืนผ้าใบจะขยายเป็น ${Math.max(S.W,img.w)}×${Math.max(S.H,img.h)}`;
      msg = mode === 'layer'
        ? `เพิ่มเป็นเลเยอร์ใหม่ที่เฟรม ${S.curFrame+1} · ${dim}`
        : `วางลอยให้ลากย้ายได้ · ${dim}`;
      if(fit === 'center' && bigger) msg += `<br><span class="warn-inline">ภาพใหญ่กว่าผืนผ้าใบ ส่วนที่เกินจะถูกตัด</span>`;
      if(fit === 'scale' && !sameSize) msg += `<br>ใช้ nearest-neighbour พิกเซลไม่เบลอ แต่ถ้าอัตราส่วนไม่ลงตัวจะไม่เท่ากันทุกช่อง`;
      if(asRef && mode === 'layer') msg += `<br>ตั้ง opacity 40% ให้วาดทับได้`;
    }
    prev.innerHTML = msg;
  }

  document.querySelectorAll('#imMode button').forEach(b=>{
    b.onclick = ()=>{
      mode = b.dataset.m;
      document.querySelectorAll('#imMode button').forEach(x=>x.classList.toggle('on', x===b));
      update();
    };
  });
  document.querySelectorAll('#imFit button').forEach(b=>{
    b.onclick = ()=>{
      fit = b.dataset.f;
      document.querySelectorAll('#imFit button').forEach(x=>x.classList.toggle('on', x===b));
      update();
    };
  });
  $('imRef').onchange = e => { asRef = e.target.checked; update(); };
  let takePal = false;
  $('imPal').onchange = e => { takePal = e.target.checked; };

  $('imGo').onclick = ()=>{
    if(mode === 'newproject' && hasWork){
      if(!confirm('งานที่ทำอยู่จะหายทั้งหมด ยืนยันไหม?')) return;
      saveRestorePoint('ก่อนนำเข้า ' + img.name);
    }
    closeModal();
    setTimeout(()=>{
      try {
        const r = placeImage(img, mode, fit, {
          center: true,
          opacity: (asRef && mode === 'layer') ? 0.4 : 1
        });
        if(takePal){
          const counts = new Map();
          for(let i=0;i<img.data.length;i+=4){
            if(img.data[i+3] < 8) continue;
            const k = (img.data[i]<<16 | img.data[i+1]<<8 | img.data[i+2]);
            counts.set(k, (counts.get(k)||0)+1);
          }
          const cols = [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,32)
            .map(([k])=>'#'+k.toString(16).padStart(6,'0'));
          if(cols.length) applyPalette(cols);
        }
        toast(mode === 'float' ? 'วางแล้ว — ลากเพื่อย้าย' : `นำเข้า ${r.w}×${r.h} แล้ว`);
      } catch(err){
        toast('นำเข้าไม่สำเร็จ: ' + err.message, 3000);
      }
    }, 30);
  };
  $('imCancel').onclick = closeModal;
  update();
}

/* Built-in colour picker — replaces <input type="color">, whose native
   dialog can't be styled and looks foreign inside the app. */
function showColorPicker(startHex, onPick){
  let [hu, sa, va] = hexToHsv(startHex || '#000000');
  let current = startHex || '#000000';

  openModal(`
    <h2>เลือกสี</h2>
    <div class="cp-wrap">
      <canvas id="cpSV" class="cp-sv"></canvas>
      <canvas id="cpHue" class="cp-hue"></canvas>
    </div>
    <div class="cp-foot">
      <div class="cp-prev" id="cpPrev"></div>
      <div class="field" style="flex:1">
        <label>โค้ดสี</label>
        <input type="text" id="cpHex" value="${current}" maxlength="7" spellcheck="false">
      </div>
    </div>
    <button class="big-btn" id="cpOk">ใช้สีนี้</button>
    <button class="big-btn ghost" id="cpCancel">ยกเลิก</button>
  `);

  const sv = $('cpSV'), hue = $('cpHue');
  const svc = sv.getContext('2d'), huec = hue.getContext('2d');

  function sizeCanvases(){
    const w = sv.clientWidth || 260, h = sv.clientHeight || 180;
    const r = Math.min(window.devicePixelRatio||1, 2);
    sv.width = w*r; sv.height = h*r;
    hue.width = (hue.clientWidth||260)*r; hue.height = (hue.clientHeight||26)*r;
    svc.setTransform(r,0,0,r,0,0);
    huec.setTransform(r,0,0,r,0,0);
  }
  function drawSV(){
    const w = sv.width/(Math.min(window.devicePixelRatio||1,2)), h = sv.height/(Math.min(window.devicePixelRatio||1,2));
    svc.fillStyle = hsvToHex(hu,1,1);
    svc.fillRect(0,0,w,h);
    const gx = svc.createLinearGradient(0,0,w,0);
    gx.addColorStop(0,'rgba(255,255,255,1)'); gx.addColorStop(1,'rgba(255,255,255,0)');
    svc.fillStyle = gx; svc.fillRect(0,0,w,h);
    const gy = svc.createLinearGradient(0,0,0,h);
    gy.addColorStop(0,'rgba(0,0,0,0)'); gy.addColorStop(1,'rgba(0,0,0,1)');
    svc.fillStyle = gy; svc.fillRect(0,0,w,h);
    // cursor
    const cx = sa*w, cy = (1-va)*h;
    svc.beginPath(); svc.arc(cx,cy,8,0,Math.PI*2);
    svc.strokeStyle = '#fff'; svc.lineWidth = 2.5; svc.stroke();
    svc.beginPath(); svc.arc(cx,cy,8,0,Math.PI*2);
    svc.strokeStyle = 'rgba(0,0,0,.55)'; svc.lineWidth = 1; svc.stroke();
  }
  function drawHue(){
    const r = Math.min(window.devicePixelRatio||1,2);
    const w = hue.width/r, h = hue.height/r;
    const g = huec.createLinearGradient(0,0,w,0);
    for(let i=0;i<=6;i++) g.addColorStop(i/6, hsvToHex(i/6,1,1));
    huec.fillStyle = g; huec.fillRect(0,0,w,h);
    const x = hu*w;
    huec.beginPath();
    huec.rect(Math.max(1,Math.min(w-5,x-2)), 1, 4, h-2);
    huec.strokeStyle = '#fff'; huec.lineWidth = 2.5; huec.stroke();
    huec.strokeStyle = 'rgba(0,0,0,.55)'; huec.lineWidth = 1; huec.stroke();
  }
  function sync(fromHexField){
    current = hsvToHex(hu,sa,va);
    $('cpPrev').style.background = current;
    if(!fromHexField) $('cpHex').value = current;
    drawSV(); drawHue();
  }

  // pointer handling shared by both canvases
  function track(el, handler){
    let active = false;
    const run = e => {
      const r = el.getBoundingClientRect();
      handler(
        Math.max(0, Math.min(1, (e.clientX - r.left)/r.width)),
        Math.max(0, Math.min(1, (e.clientY - r.top)/r.height))
      );
      sync();
    };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); active = true;
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      run(e);
    });
    el.addEventListener('pointermove', e => { if(active){ e.preventDefault(); run(e); } });
    ['pointerup','pointercancel'].forEach(ev =>
      el.addEventListener(ev, () => { active = false; }));
  }
  track(sv, (x,y) => { sa = x; va = 1-y; });
  track(hue, (x) => { hu = x; });

  $('cpHex').oninput = e => {
    let v = e.target.value.trim();
    if(v && !v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){
      [hu,sa,va] = hexToHsv(v.toLowerCase());
      sync(true);
    }
  };
  $('cpOk').onclick = ()=>{ closeModal(); onPick(current); };
  $('cpCancel').onclick = closeModal;

  // canvases need layout before they can be sized
  requestAnimationFrame(()=>{ sizeCanvases(); sync(); });
}

function showPaletteManager(){
  const artColors = extractPaletteFromArt(32);
  openModal(`
    <h2>จัดการจานสี</h2>
    <p class="sub">${S.palette.length} สีในจานนี้ · เก็บไปกับโปรเจกต์</p>

    <div class="sec-lbl">สีในจาน — แตะเพื่อลบ</div>
    <div class="pal-grid" id="pmGrid"></div>

    <div class="cp-foot" style="margin-bottom:10px">
      <button class="cp-prev" id="pmPick" style="background:${S.color}" title="เลือกสี"></button>
      <div class="field" style="flex:1">
        <label>โค้ดสี (hex)</label>
        <input type="text" id="pmHex" value="${S.color}" placeholder="#rrggbb" maxlength="7" spellcheck="false">
      </div>
    </div>
    <button class="big-btn" id="pmAdd" style="margin-top:0">เพิ่มสีนี้</button>

    <div class="hr"></div>
    <div class="sec-lbl">ดูดสีจากงาน</div>
    ${artColors.length
      ? `<button class="preset-row" id="pmFromArt">
           <b>สีที่ใช้จริงในงาน (${artColors.length} สี)</b>
           <span class="strip">${artColors.slice(0,16).map(c=>`<i style="background:${c}"></i>`).join('')}</span>
         </button>
         <button class="sup-btn" id="pmMergeArt" style="margin-top:0">เพิ่มเข้าจานเดิม (ไม่แทนที่)</button>`
      : '<p class="empty-note">ยังไม่มีสีในงาน — วาดก่อนแล้วค่อยกลับมา</p>'}

    <div class="hr"></div>
    <div class="sec-lbl">ชุดสีสำเร็จรูป</div>
    <div id="pmPresets"></div>

    <div class="hr"></div>
    <button class="sup-btn" id="pmClear" style="margin-top:0;color:var(--danger)">ล้างจานสีทั้งหมด</button>
    <button class="big-btn ghost" id="pmClose">ปิด</button>
  `);

  function renderGrid(){
    const g = $('pmGrid');
    g.innerHTML = '';
    if(!S.palette.length){
      g.innerHTML = '<p class="empty-note" style="grid-column:1/-1">จานสีว่าง</p>';
      return;
    }
    S.palette.forEach((c, i)=>{
      const b = document.createElement('button');
      b.className = 'pc' + (c===S.color?' on':'');
      b.style.background = c;
      b.title = c.toUpperCase();
      b.innerHTML = '<span class="x">&times;</span>';
      b.onclick = ()=>{ removeColorFromPalette(i); renderGrid(); };
      g.appendChild(b);
    });
  }

  const pick = $('pmPick'), hex = $('pmHex');
  pick.onclick = ()=>{
    const cur = hex.value.trim() || S.color;
    // reopening the manager afterwards keeps the flow on one screen
    showColorPicker(/^#[0-9a-fA-F]{6}$/.test(cur) ? cur.toLowerCase() : S.color, chosen => {
      showPaletteManager();
      const h = $('pmHex'), pk = $('pmPick');
      if(h) h.value = chosen;
      if(pk) pk.style.background = chosen;
    });
  };
  hex.oninput = ()=>{
    let v = hex.value.trim();
    if(v && !v.startsWith('#')) v = '#' + v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)) pick.style.background = v.toLowerCase();
  };
  $('pmAdd').onclick = ()=>{
    let v = hex.value.trim().toLowerCase();
    if(v && !v.startsWith('#')) v = '#' + v;
    if(addColorToPalette(v)) renderGrid();
  };

  if($('pmFromArt')) $('pmFromArt').onclick = ()=>{
    if(!confirm(`แทนที่จานสีเดิมด้วย ${artColors.length} สีจากงาน?`)) return;
    applyPalette(artColors); renderGrid();
    toast(`ใช้ ${artColors.length} สีจากงานแล้ว`);
  };
  if($('pmMergeArt')) $('pmMergeArt').onclick = ()=>{
    const before = S.palette.length;
    const merged = S.palette.slice();
    for(const c of artColors) if(!merged.includes(c) && merged.length < 64) merged.push(c);
    applyPalette(merged); renderGrid();
    toast(`เพิ่ม ${merged.length - before} สีใหม่`);
  };

  const pr = $('pmPresets');
  const CHAR_KEYS = ['ผิว: ขาว','ผิว: สองสี','ผิว: แทน','ผิว: เข้ม','ผิว: ดำ','ผม','ตา + ปาก','เสื้อผ้า','ชุดวาดคน (รวม)'];
  const groups = [
    ['ทั่วไป', Object.keys(PRESET_PALETTES).filter(k => !CHAR_KEYS.includes(k))],
    ['สำหรับวาดคน', CHAR_KEYS]
  ];

  for(const [gname, keys] of groups){
    const gl = document.createElement('div');
    gl.className = 'sec-lbl';
    gl.style.marginTop = '10px';
    gl.textContent = gname;
    pr.appendChild(gl);

    for(const name of keys){
      const colors = PRESET_PALETTES[name];
      if(!colors) continue;
      const isChar = CHAR_KEYS.includes(name);
      const b = document.createElement('button');
      b.className = 'preset-row';
      b.innerHTML = `<b>${name} (${colors.length})</b>
        <span class="strip">${colors.slice(0,18).map(c=>`<i style="background:${c}"></i>`).join('')}</span>
        ${isChar ? '<span class="pr-hint">แตะ = เพิ่มเข้าจาน · กดค้าง = แทนที่</span>' : ''}`;

      if(isChar){
        // character sets are usually combined (skin + hair + cloth),
        // so a plain tap merges instead of wiping what you already picked
        let lp = null, didLong = false;
        b.addEventListener('pointerdown', ()=>{
          didLong = false;
          lp = setTimeout(()=>{
            didLong = true;
            if(navigator.vibrate) navigator.vibrate(14);
            applyPalette(colors.slice());
            renderGrid();
            toast('แทนที่ด้วย ' + name);
          }, 550);
        });
        ['pointerup','pointerleave','pointercancel'].forEach(ev =>
          b.addEventListener(ev, ()=>clearTimeout(lp)));
        b.onclick = ()=>{
          if(didLong) return;
          const merged = S.palette.slice();
          let added = 0;
          for(const c of colors){
            if(!merged.includes(c) && merged.length < 64){ merged.push(c); added++; }
          }
          if(!added){ toast('มีสีชุดนี้อยู่ครบแล้ว'); return; }
          applyPalette(merged);
          renderGrid();
          toast('เพิ่ม ' + added + ' สีจาก ' + name);
        };
      } else {
        b.onclick = ()=>{
          if(!confirm(`เปลี่ยนเป็นชุด "${name}"? จานสีเดิมจะถูกแทนที่`)) return;
          applyPalette(colors.slice());
          renderGrid();
          toast('ใช้ชุด ' + name);
        };
      }
      pr.appendChild(b);
    }
  }

  $('pmClear').onclick = ()=>{
    if(!confirm('ล้างจานสีทั้งหมด?')) return;
    applyPalette([]);
    renderGrid();
  };
  $('pmClose').onclick = closeModal;
  renderGrid();
}

    <button class="sup-btn" id="eSupport"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.9Z"/></svg> สนับสนุนผู้พัฒนา</button>
  `);
  $('eSheet').onclick = exportSheet;
  $('eZip').onclick = exportZip;
  $('eGif').onclick = exportGif;
  $('ePhaser').onclick = ()=>exportAtlas('phaser');
  $('eGodot').onclick = ()=>exportAtlas('godot');
  $('eAse').onclick = ()=>exportAtlas('aseprite');
  $('eClose').onclick = closeModal;
  $('eSupport').onclick = showSupport;
}

/* ══════════════ WIRING ══════════════ */
$('btnLayers').onclick = ()=>{ $('drawer').classList.add('on'); $('scrim').classList.add('on'); renderLayers(); };
$('btnCloseDrawer').onclick = $('scrim').onclick = ()=>{ $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); };
$('btnAddLayer').onclick = addLayer;
$('btnDelLayer').onclick = delLayer;
$('btnUndo').onclick = undo;
$('btnRedo').onclick = redo;
$('btnPlay').onclick = togglePlay;
$('btnExport').onclick = showExport;
$('btnSave').onclick = showSaveLoad;
$('btnDupFrame').onclick = dupFrame;
$('btnDelFrame').onclick = delFrame;
$('btnFit').onclick = ()=>{ fitToScreen(); toast('พอดีจอ'); };
function updateSelBar(){
  const bar = $('selBar');
  const on = (S.tool === 'select');
  bar.classList.toggle('on', on);
  syncBarStack();
  if(!on) return;
  const has = !!(S.sel || S.float);
  bar.querySelectorAll('button').forEach(b=>{
    const a = b.dataset.a;
    if(a === 'paste') b.disabled = !S.clip;
    else if(a === 'done') b.disabled = false;
    else b.disabled = !has;
  });
}
$('selBar').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  const a = b.dataset.a;
  if(a === 'cut') cutSelection();
  else if(a === 'copy') copySelection();
  else if(a === 'paste') pasteClip();
  else if(a === 'flipH') transformSelection('flipH');
  else if(a === 'flipV') transformSelection('flipV');
  else if(a === 'del') deleteSelection();
  else if(a === 'done'){ commitFloat(); S.sel = null; markDirty(); }
  updateSelBar();
});
$('rbGo').onclick = ()=>{
  if(useRestorePoint()){ hideRestoreBar(); toast('กู้กลับแล้ว'); }
  else toast('กู้ไม่สำเร็จ');
};
$('rbX').onclick = hideRestoreBar;
$('btnResize').onclick = showResize;
$('btnTags').onclick = showTags;
$('btnTile').onclick = ()=>{
  S.tileMode = !S.tileMode;
  $('btnTile').classList.toggle('on', S.tileMode);
  bufDirty = true; renderView();
  toast(S.tileMode ? 'โหมดต่อลาย: วาดข้ามขอบได้' : 'ปิดโหมดต่อลาย');
};
$('btnGrid').onclick = ()=>{ S.showGrid = !S.showGrid; $('btnGrid').classList.toggle('on', S.showGrid); renderView(); };
$('btnOnion').onclick = ()=>{ S.onion = !S.onion; $('btnOnion').classList.toggle('on', S.onion); bufDirty=true; renderView(); };
$('fps').oninput = e => { S.fps = +e.target.value; $('fpsVal').textContent = S.fps + ' fps'; };

document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT') return;
  if((e.ctrlKey||e.metaKey) && e.key==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); showSaveLoad(); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='a'){ e.preventDefault(); selectAll(); updateSelBar(); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='c'){ e.preventDefault(); copySelection(); updateSelBar(); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='x'){ e.preventDefault(); cutSelection(); updateSelBar(); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='v'){ e.preventDefault(); pasteClip(); updateSelBar(); return; }
  if(e.key==='Escape'){ commitFloat(); S.sel=null; markDirty(); updateSelBar(); return; }
  if((e.key==='Delete'||e.key==='Backspace') && (S.sel||S.float)){ e.preventDefault(); deleteSelection(); updateSelBar(); return; }
  if(S.sel || S.float){
    const arrows = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
    if(arrows[e.key]){ e.preventDefault(); nudgeFloat(...arrows[e.key]); return; }
  }
  if(e.key===','){ e.preventDefault(); stepShade(-1); return; }
  if(e.key==='.'){ e.preventDefault(); stepShade(1); return; }
  const map = {b:'pencil', e:'eraser', g:'fill', i:'picker', l:'line', r:'rect', m:'select', v:'select'};
  if(map[e.key]) selectTool(map[e.key]);
  if(e.key===' '){ e.preventDefault(); togglePlay(); }
});

/* drag & drop an image or project file straight onto the canvas */
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  document.body.style.outline = '2px dashed var(--accent)';
  document.body.style.outlineOffset = '-6px';
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  if(ev === 'dragleave' && e.relatedTarget) return;
  document.body.style.outline = '';
}));
document.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  if(/\.json$/i.test(f.name)){ importProjectFile(f); return; }
  toast('กำลังอ่านภาพ…');
  loadImageFile(f)
    .then(img => showImportImage(img))
    .catch(err => toast(err.message, 3200));
});

window.addEventListener('resize', ()=>{ dpr = Math.min(window.devicePixelRatio||1, 2); resizeView(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) runAutosave(); });
window.addEventListener('pagehide', runAutosave);
window.addEventListener('beforeunload', e=>{
  runAutosave();
  if(dirtySinceSave){ e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ══════════════ BOOT ══════════════ */
(function antsLoop(){
  if(selNeedsAnim && (S.sel || S.float)){ renderView(); }
  requestAnimationFrame(antsLoop);
})();

$('btnGrid').classList.add('on');
buildPalette();
renderRecent();
resizeView();
initProject(64, 64);
showNewProject();
</script>
