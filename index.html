/* ---- autosave ---- */
let dirtySinceSave = false;
let autosaveTimer = null;
function markProjectDirty(){
  dirtySinceSave = true;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(runAutosave, 3000);
}
function runAutosave(){
  if(!dirtySinceSave) return;
  try {
    const payload = serialize(curProjectName || 'งานล่าสุด');
    payload.autoOf = curProjectId;
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    const dot = $('saveDot');
    dot.classList.add('on');
    setTimeout(()=>dot.classList.remove('on'), 1200);
  } catch(err){
    // silent — autosave failure shouldn't interrupt drawing
  }
}
function hasAutosave(){
  return !!localStorage.getItem(AUTOSAVE_KEY);
}
function restoreAutosave(){
  const raw = localStorage.getItem(AUTOSAVE_KEY);
  if(!raw) return false;
  try {
    const obj = JSON.parse(raw);
    deserialize(obj);
    curProjectId = obj.autoOf || null;
    curProjectName = obj.name || null;
    dirtySinceSave = false;
    return true;
  } catch(e){ return false; }
}

/* ---- restore point: snapshot taken immediately before a destructive op.
   Kept in its own slot so the 3s autosave can't overwrite it. ---- */
const RESTORE_KEY = 'pxloom:restore';
function saveRestorePoint(label){
  try {
    const payload = serialize(curProjectName || 'งานล่าสุด');
    payload.restoreOf = curProjectId;
    payload.label = label;
    payload.at = Date.now();
    localStorage.setItem(RESTORE_KEY, JSON.stringify(payload));
    return true;
  } catch(err){
    return false;   // out of space — caller decides whether to warn
  }
}
function getRestorePoint(){
  const raw = localStorage.getItem(RESTORE_KEY);
  if(!raw) return null;
  try { return JSON.parse(raw); } catch(e){ return null; }
}
function useRestorePoint(){
  const obj = getRestorePoint();
  if(!obj) return false;
  try {
    deserialize(obj);
    curProjectId = obj.restoreOf || null;
    curProjectName = obj.name || null;
    localStorage.removeItem(RESTORE_KEY);
    dirtySinceSave = true;
    return true;
  } catch(e){ return false; }
}

/* ══════════════ RESIZE / CROP ══════════════ */
/* Anchor grid: 0=TL 1=TC 2=TR / 3=ML 4=C 5=MR / 6=BL 7=BC 8=BR */
function resizeCanvasData(src, sw, sh, dw, dh, anchor){
  const dst = new Uint8ClampedArray(dw*dh*4);
  const col = anchor % 3, row = (anchor/3)|0;
  const offX = Math.round((dw - sw) * (col/2));
  const offY = Math.round((dh - sh) * (row/2));
  for(let y=0;y<sh;y++){
    const dy = y + offY;
    if(dy<0 || dy>=dh) continue;
    for(let x=0;x<sw;x++){
      const dx = x + offX;
      if(dx<0 || dx>=dw) continue;
      const si=(y*sw+x)*4, di=(dy*dw+dx)*4;
      dst[di]=src[si]; dst[di+1]=src[si+1]; dst[di+2]=src[si+2]; dst[di+3]=src[si+3];
    }
  }
  return dst;
}
function scaleCanvasData(src, sw, sh, dw, dh){
  const dst = new Uint8ClampedArray(dw*dh*4);
  for(let y=0;y<dh;y++){
    const sy = Math.min(sh-1, Math.floor(y*sh/dh));
    for(let x=0;x<dw;x++){
      const sx = Math.min(sw-1, Math.floor(x*sw/dw));
      const si=(sy*sw+sx)*4, di=(y*dw+x)*4;
      dst[di]=src[si]; dst[di+1]=src[si+1]; dst[di+2]=src[si+2]; dst[di+3]=src[si+3];
    }
  }
  return dst;
}
function cropData(src, sw, sh, rx, ry, rw, rh){
  const dst = new Uint8ClampedArray(rw*rh*4);
  for(let y=0;y<rh;y++){
    const sy = ry+y;
    if(sy<0||sy>=sh) continue;
    for(let x=0;x<rw;x++){
      const sx = rx+x;
      if(sx<0||sx>=sw) continue;
      const si=(sy*sw+sx)*4, di=(y*rw+x)*4;
      dst[di]=src[si]; dst[di+1]=src[si+1]; dst[di+2]=src[si+2]; dst[di+3]=src[si+3];
    }
  }
  return dst;
}
/* Bounding box of all non-transparent pixels across every layer and frame.
   Hidden layers count too: cropping to bounds that ignored them would
   silently destroy work the user had just toggled off. */
function contentBounds(){
  let minX=S.W, minY=S.H, maxX=-1, maxY=-1;
  for(const L of artLayers()){
    for(const f of L.frames){
      for(let y=0;y<S.H;y++){
        const row = y*S.W;
        for(let x=0;x<S.W;x++){
          if(f[(row+x)*4+3] !== 0){
            if(x<minX) minX=x; if(x>maxX) maxX=x;
            if(y<minY) minY=y; if(y>maxY) maxY=y;
          }
        }
      }
    }
  }
  if(maxX < 0) return null;
  return {x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1};
}

/* Apply a transform across every layer and frame, then rebind canvas state */
function applyTransform(newW, newH, fn, label){
  commitFloat();
  S.sel = null;
  const saved = saveRestorePoint(label || 'ปรับขนาด');
  for(const L of S.layers){
    L.frames = L.frames.map(f => fn(f));
  }
  S.W = newW; S.H = newH;
  buf.width = newW; buf.height = newH;
  scratch.width = newW; scratch.height = newH;
  // the guide is redrawn from its original at the same placement rather than
  // resampled along with the artwork
  for(const L of S.layers) if(L.ref && L.src) renderRefLayer(L);
  S.undoStack = []; S.redoStack = [];
  updateUndoBtns();
  bufDirty = true;
  fitToScreen();
  renderAll();
  markProjectDirty();
  showRestoreBar(saved);
}
function doResize(w, h, anchor){
  const ow = S.W, oh = S.H;
  applyTransform(w, h, f => resizeCanvasData(f, ow, oh, w, h, anchor), `ก่อนปรับเป็น ${w}×${h}`);
}
function doScale(w, h){
  const ow = S.W, oh = S.H;
  applyTransform(w, h, f => scaleCanvasData(f, ow, oh, w, h), `ก่อนยืดเป็น ${w}×${h}`);
}
function doCropToContent(){
  const b = contentBounds();
  if(!b){ toast('ผืนผ้าใบว่าง — ไม่มีอะไรให้ตัด'); return false; }
  if(b.w === S.W && b.h === S.H){ toast('งานเต็มผืนผ้าใบอยู่แล้ว'); return false; }
  const ow = S.W, oh = S.H;
  applyTransform(b.w, b.h, f => cropData(f, ow, oh, b.x, b.y, b.w, b.h), `ก่อนตัดเหลือ ${b.w}×${b.h}`);
  return b;
}

/* ══════════════ ANIMATION TAGS & ATLAS ══════════════ */
/* Tags let one timeline hold several named clips: idle 0-3, walk 4-9, etc.
   Without tags the whole timeline exports as a single clip. */
function sheetLayout(){
  const cols = Math.min(S.frameCount, Math.ceil(Math.sqrt(S.frameCount)));
  const rows = Math.ceil(S.frameCount / cols);
  return {cols, rows, w:S.W*cols, h:S.H*rows};
}
function frameRect(i, cols){
  return {x:(i%cols)*S.W, y:Math.floor(i/cols)*S.H, w:S.W, h:S.H};
}
function effectiveTags(){
  if(S.tags && S.tags.length) return S.tags;
  return [{name:'animation', from:0, to:S.frameCount-1}];
}
function baseName(){
  return (curProjectName || 'sprite').replace(/[^\w\u0E00-\u0E7F-]+/g,'_') || 'sprite';
}

/* ---- Phaser 3 / TexturePacker JSON Hash ---- */
function buildPhaserAtlas(imageName){
  const {cols, rows, w, h} = sheetLayout();
  const frames = {};
  for(let i=0;i<S.frameCount;i++){
    const r = frameRect(i, cols);
    frames[baseName()+'_'+String(i).padStart(3,'0')] = {
      frame: {x:r.x, y:r.y, w:r.w, h:r.h},
      rotated: false,
      trimmed: false,
      spriteSourceSize: {x:0, y:0, w:S.W, h:S.H},
      sourceSize: {w:S.W, h:S.H},
      pivot: {x:0.5, y:0.5}
    };
  }
  return {
    frames,
    meta: {
      app: 'wadpixel',
      version: '1.0',
      image: imageName,
      format: 'RGBA8888',
      size: {w, h},
      scale: '1',
      fps: S.fps,
      frameTags: effectiveTags().map(t => ({name:t.name, from:t.from, to:t.to, direction:'forward'}))
    }
  };
}

/* ---- Aseprite-compatible JSON Array (widely supported interchange) ---- */
function buildAsepriteAtlas(imageName){
  const {cols, rows, w, h} = sheetLayout();
  const dur = Math.round(1000/S.fps);
  const frames = [];
  for(let i=0;i<S.frameCount;i++){
    const r = frameRect(i, cols);
    frames.push({
      filename: baseName()+' '+i+'.png',
      frame: {x:r.x, y:r.y, w:r.w, h:r.h},
      rotated: false,
      trimmed: false,
      spriteSourceSize: {x:0, y:0, w:S.W, h:S.H},
      sourceSize: {w:S.W, h:S.H},
      duration: dur
    });
  }
  return {
    frames,
    meta: {
      app: 'wadpixel',
      version: '1.0',
      image: imageName,
      format: 'RGBA8888',
      size: {w, h},
      scale: '1',
      frameTags: effectiveTags().map(t => ({name:t.name, from:t.from, to:t.to, direction:'forward'})),
      layers: S.layers.map(L => ({name:L.name, opacity:Math.round(L.opacity*255), blendMode:'normal'}))
    }
  };
}

/* ---- Godot 4 SpriteFrames .tres ----
   Godot does not parse arbitrary JSON, so we emit a real resource file:
   one AtlasTexture sub-resource per frame, grouped into named animations. */
function buildGodotTres(imageName){
  const {cols} = sheetLayout();
  const tags = effectiveTags();
  const texId = 'Texture2D_pxl00';
  let subs = '';
  let loadSteps = 1;
  const emitted = new Set();   // tags may overlap; a repeated id breaks the .tres

  const animBlocks = tags.map(t => {
    const frameLines = [];
    for(let i=t.from; i<=t.to && i<S.frameCount; i++){
      const r = frameRect(i, cols);
      const id = 'AtlasTexture_f'+i;
      if(!emitted.has(id)){
        emitted.add(id);
        subs += `[sub_resource type="AtlasTexture" id="${id}"]\n`
             +  `atlas = ExtResource("${texId}")\n`
             +  `region = Rect2(${r.x}, ${r.y}, ${r.w}, ${r.h})\n\n`;
        loadSteps++;
      }
      frameLines.push(`{\n"duration": 1.0,\n"texture": SubResource("${id}")\n}`);
    }
    return `{\n"frames": [${frameLines.join(', ')}],\n"loop": true,\n"name": &"${t.name}",\n"speed": ${S.fps}.0\n}`;
  });

  return `[gd_resource type="SpriteFrames" load_steps=${loadSteps+1} format=3]\n\n`
       + `[ext_resource type="Texture2D" path="res://${imageName}" id="${texId}"]\n\n`
       + subs
       + `[resource]\nanimations = [${animBlocks.join(', ')}]\n`;
}


/* ══════════════ SELECTION ══════════════ */
/* Selection lifecycle:
   1. drag with the select tool -> S.sel = {x,y,w,h} marquee
   2. first drag inside the marquee LIFTS those pixels into S.float
      (clearing them from the layer) so they can be dragged freely
   3. commit stamps S.float back down; Esc/tool-change/other actions commit too */
function clearSelection(){
  if(S.float) commitFloat();
  S.sel = null;
  S.selDrag = null;
  markDirty();
}
function normRect(x0,y0,x1,y1){
  const x = Math.min(x0,x1), y = Math.min(y0,y1);
  return {x, y, w: Math.abs(x1-x0)+1, h: Math.abs(y1-y0)+1};
}
function clampRectToCanvas(r){
  const x0 = Math.max(0, r.x), y0 = Math.max(0, r.y);
  const x1 = Math.min(S.W, r.x+r.w), y1 = Math.min(S.H, r.y+r.h);
  if(x1<=x0 || y1<=y0) return null;
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
/* Copy the selected region out of the current layer into a standalone buffer */
function extractRegion(data, r){
  const out = new Uint8ClampedArray(r.w*r.h*4);
  for(let y=0;y<r.h;y++){
    for(let x=0;x<r.w;x++){
      const sx=r.x+x, sy=r.y+y;
      if(sx<0||sy<0||sx>=S.W||sy>=S.H) continue;
      const si=(sy*S.W+sx)*4, di=(y*r.w+x)*4;
      out[di]=data[si]; out[di+1]=data[si+1]; out[di+2]=data[si+2]; out[di+3]=data[si+3];
    }
  }
  return out;
}
function eraseRegion(data, r){
  for(let y=0;y<r.h;y++){
    for(let x=0;x<r.w;x++){
      const sx=r.x+x, sy=r.y+y;
      if(sx<0||sy<0||sx>=S.W||sy>=S.H) continue;
      const i=(sy*S.W+sx)*4;
      data[i]=0; data[i+1]=0; data[i+2]=0; data[i+3]=0;
    }
  }
}
/* Stamp a floating buffer onto a layer. Transparent source pixels don't erase. */
function stampRegion(data, buffer, r){
  const wrapc = (v,n)=>((v%n)+n)%n;
  for(let y=0;y<r.h;y++){
    for(let x=0;x<r.w;x++){
      const si=(y*r.w+x)*4;
      if(buffer[si+3]===0) continue;
      let dx=r.x+x, dy=r.y+y;
      if(S.tileMode){ dx=wrapc(dx,S.W); dy=wrapc(dy,S.H); }
      else if(dx<0||dy<0||dx>=S.W||dy>=S.H) continue;
      const di=(dy*S.W+dx)*4;
      data[di]=buffer[si]; data[di+1]=buffer[si+1]; data[di+2]=buffer[si+2]; data[di+3]=buffer[si+3];
    }
  }
}
/* Lift selected pixels off the layer so they can be moved */
function liftSelection(){
  if(!S.sel || S.float) return;
  if(blockIfRef()) return;
  const r = clampRectToCanvas(S.sel);
  if(!r) return;
  pushUndo();
  const data = curData();
  S.float = extractRegion(data, r);
  S.floatRect = {...r};
  eraseRegion(data, r);
  markDirty();
}
/* Put the floating pixels back down at their current position */
function commitFloat(){
  if(!S.float) return;
  stampRegion(curData(), S.float, S.floatRect);
  S.sel = {...S.floatRect};
  S.float = null;
  S.floatRect = null;
  markDirty();
  refreshThumbs();
}
function nudgeFloat(dx, dy){
  if(!S.sel) return;
  if(!S.float) liftSelection();
  if(!S.float) return;
  S.floatRect.x += dx; S.floatRect.y += dy;
  markDirty();
}
function deleteSelection(){
  if(S.float){
    // discard the lifted pixels entirely
    S.float = null; S.floatRect = null;
    S.sel = null;
    markDirty(); refreshThumbs();
    toast('ลบแล้ว');
    return;
  }
  if(!S.sel) return;
  if(blockIfRef()) return;
  const r = clampRectToCanvas(S.sel);
  if(!r) return;
  pushUndo();
  eraseRegion(curData(), r);
  markDirty(); refreshThumbs();
  toast('ลบแล้ว');
}
function copySelection(){
  const r = S.float ? S.floatRect : (S.sel && clampRectToCanvas(S.sel));
  if(!r){ toast('ยังไม่ได้เลือกพื้นที่'); return; }
  S.clip = {
    data: S.float ? new Uint8ClampedArray(S.float) : extractRegion(curData(), r),
    w: r.w, h: r.h
  };
  toast(`คัดลอก ${r.w}×${r.h} แล้ว`);
}
function cutSelection(){
  copySelection();
  if(S.clip) deleteSelection();
}
function pasteClip(){
  if(!S.clip){ toast('ยังไม่มีอะไรให้วาง'); return; }
  if(blockIfRef()) return;
  commitFloat();
  // paste into the middle of the current view so it's always visible
  const vw = view.width/dpr, vh = view.height/dpr;
  const cx = Math.floor((vw/2 - S.panX)/S.zoom - S.clip.w/2);
  const cy = Math.floor((vh/2 - S.panY)/S.zoom - S.clip.h/2);
  pushUndo();
  S.float = new Uint8ClampedArray(S.clip.data);
  S.floatRect = {x:cx, y:cy, w:S.clip.w, h:S.clip.h};
  S.sel = {...S.floatRect};
  selectTool('select');
  markDirty();
  toast('วางแล้ว — ลากเพื่อย้าย');
}
function selectAll(){
  commitFloat();
  S.sel = {x:0, y:0, w:S.W, h:S.H};
  selectTool('select');
  markDirty();
}
/* Flip / rotate operate on the float if present, else the whole layer frame */
function transformSelection(kind){
  if(!S.float && blockIfRef()) return;
  const hadFloat = !!S.float;
  if(!hadFloat && S.sel) liftSelection();
  let src, w, h;
  if(S.float){ src = S.float; w = S.floatRect.w; h = S.floatRect.h; }
  else {
    pushUndo();
    src = curData(); w = S.W; h = S.H;
  }
  const out = new Uint8ClampedArray(src.length);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let nx = x, ny = y;
      if(kind === 'flipH') nx = w-1-x;
      else if(kind === 'flipV') ny = h-1-y;
      const si=(y*w+x)*4, di=(ny*w+nx)*4;
      out[di]=src[si]; out[di+1]=src[si+1]; out[di+2]=src[si+2]; out[di+3]=src[si+3];
    }
  }
  if(S.float) S.float = out;
  else curData().set(out);
  markDirty(); refreshThumbs();
  toast(kind === 'flipH' ? 'พลิกแนวนอน' : 'พลิกแนวตั้ง');
}

/* ── FLIP ────────────────────────────────────────────────────────────
   transformSelection() handles a marquee; this handles everything above
   it: a whole cell, a layer's whole timeline, one frame across layers,
   or the entire project. */
function flipBuffer(src, w, h, kind){
  const out = new Uint8ClampedArray(src.length);
  for(let y=0;y<h;y++){
    const ny = kind === 'flipV' ? h-1-y : y;
    for(let x=0;x<w;x++){
      const nx = kind === 'flipH' ? w-1-x : x;
      const si=(y*w+x)*4, di=(ny*w+nx)*4;
      out[di]=src[si]; out[di+1]=src[si+1]; out[di+2]=src[si+2]; out[di+3]=src[si+3];
    }
  }
  return out;
}
/* A guide flips around the canvas centre too, so it stays lined up with the
   artwork instead of jumping to wherever its own box happens to be. */
function flipRefLayer(L, kind){
  if(!L.src) return;
  L.src.data = flipBuffer(L.src.data, L.src.w, L.src.h, kind);
  const dw = Math.round(L.src.w*L.xf.s), dh = Math.round(L.src.h*L.xf.s);
  if(kind === 'flipH') L.xf.x = S.W - (L.xf.x + dw);
  else L.xf.y = S.H - (L.xf.y + dh);
  renderRefLayer(L);
}
const FLIP_SCOPE_LABEL = {
  cell:  'เฟรมนี้ เลเยอร์นี้',
  layer: 'ทั้งเลเยอร์',
  frame: 'เฟรมนี้ ทุกเลเยอร์',
  all:   'ทั้งโปรเจกต์'
};
/* turn: 1 = 90° clockwise, 2 = 180°, 3 = 90° counter-clockwise.
   A quarter turn swaps the buffer's dimensions unless the canvas is square. */
function rotateBuffer(data, w, h, turn){
  const nw = turn === 2 ? w : h, nh = turn === 2 ? h : w;
  const out = new Uint8ClampedArray(nw*nh*4);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let nx, ny;
      if(turn === 1){ nx = h-1-y; ny = x; }
      else if(turn === 3){ nx = y; ny = w-1-x; }
      else { nx = w-1-x; ny = h-1-y; }
      const s = (y*w+x)*4, d = (ny*nw+nx)*4;
      out[d]=data[s]; out[d+1]=data[s+1]; out[d+2]=data[s+2]; out[d+3]=data[s+3];
    }
  }
  return out;
}
const TURN_LABEL = {1:'หมุนขวา 90°', 2:'หมุน 180°', 3:'หมุนซ้าย 90°'};
function doRotate(turn, scope){
  commitFloat();
  S.sel = null;

  // a quarter turn on a non-square canvas changes the canvas itself, so it
  // can only be done to everything at once
  if(turn !== 2 && S.W !== S.H){
    applyTransform(S.H, S.W, f => rotateBuffer(f, S.W, S.H, turn), 'ก่อน' + TURN_LABEL[turn]);
    toast(`${TURN_LABEL[turn]} · ผืนผ้าใบเป็น ${S.W}×${S.H}`);
    return;
  }

  const wide = scope !== 'cell';
  let saved = null;
  if(wide) saved = saveRestorePoint('ก่อน' + TURN_LABEL[turn]);
  else if(!S.layers[S.curLayer].ref) pushUndo();

  const targets = (scope === 'cell' || scope === 'layer') ? [S.layers[S.curLayer]] : S.layers;
  let skippedRef = false;
  for(const L of targets){
    // the guide is a placed bitmap with its own transform — rotating the
    // artwork under it is fine, rotating it too is a different feature
    if(L.ref){ skippedRef = true; continue; }
    if(scope === 'cell' || scope === 'frame'){
      L.frames[S.curFrame] = rotateBuffer(L.frames[S.curFrame], S.W, S.H, turn);
    } else {
      L.frames = L.frames.map(f => rotateBuffer(f, S.W, S.H, turn));
    }
  }
  bufDirty = true;
  renderAll();
  markProjectDirty();
  if(wide && saved) showRestoreBar(saved);
  toast(`${TURN_LABEL[turn]} · ${FLIP_SCOPE_LABEL[scope]}` + (skippedRef ? ' (ภาพอ้างอิงไม่หมุนตาม)' : ''));
}
function doFlip(kind, scope){
  commitFloat();
  S.sel = null;
  const wide = scope !== 'cell';
  let saved = null;
  // one cell is a normal undoable edit; anything wider is a restore point,
  // same as resize — the undo stack only tracks a single layer+frame
  if(wide) saved = saveRestorePoint('ก่อนพลิก' + (kind === 'flipH' ? 'แนวนอน' : 'แนวตั้ง'));
  else if(!S.layers[S.curLayer].ref) pushUndo();

  const targets = (scope === 'cell' || scope === 'layer')
    ? [S.layers[S.curLayer]]
    : S.layers;

  for(const L of targets){
    if(L.ref){ flipRefLayer(L, kind); continue; }
    if(scope === 'cell' || scope === 'frame'){
      L.frames[S.curFrame] = flipBuffer(L.frames[S.curFrame], S.W, S.H, kind);
    } else {
      L.frames = L.frames.map(f => flipBuffer(f, S.W, S.H, kind));
    }
  }

  if(wide){ S.undoStack = []; S.redoStack = []; updateUndoBtns(); }
  bufDirty = true; renderAll(); markProjectDirty();
  if(wide && saved) showRestoreBar(saved);
  toast(`พลิก${kind === 'flipH' ? 'แนวนอน' : 'แนวตั้ง'} · ${FLIP_SCOPE_LABEL[scope]}`);
}
function showFlipDialog(){
  let kind = 'flipH', scope = 'cell';
  const refOnly = S.layers[S.curLayer].ref;
  openModal(`
    <h2>พลิก / หมุน</h2>
    <p class="sub">เลเยอร์ตอนนี้: <b>${esc(S.layers[S.curLayer].name)}</b>${refOnly ? ' (อ้างอิง)' : ''} · ผืนผ้าใบ ${S.W}×${S.H}</p>

    <div class="sec-lbl">ทำอะไร</div>
    <div class="seg" id="flKind">
      <button data-k="flipH" class="on">↔</button>
      <button data-k="flipV">↕</button>
      <button data-k="rot3">↺ 90°</button>
      <button data-k="rot1">↻ 90°</button>
      <button data-k="rot2">180°</button>
    </div>

    <div class="sec-lbl">ขอบเขต</div>
    <div class="seg" id="flScope" style="flex-wrap:wrap">
      <button data-s="cell" class="on">เฟรมนี้</button>
      <button data-s="layer">ทั้งเลเยอร์</button>
      <button data-s="frame">ทุกเลเยอร์</button>
      <button data-s="all">ทั้งโปรเจกต์</button>
    </div>

    <div class="rz-preview" id="flPrev"></div>
    <button class="big-btn" id="flGo">พลิก</button>
    <button class="big-btn ghost" id="flCancel">ยกเลิก</button>
  `);
  // a quarter turn on a non-square canvas rewrites the canvas dimensions, so
  // it can't be limited to one frame or one layer
  const quarterSwaps = ()=> kind !== 'flipH' && kind !== 'flipV' && kind !== 'rot2' && S.W !== S.H;
  const upd = ()=>{
    const forced = quarterSwaps();
    document.querySelectorAll('#flScope button').forEach(b=>{
      b.disabled = forced;
      b.classList.toggle('on', forced ? b.dataset.s === 'all' : b.dataset.s === scope);
    });
    const turn = {rot1:1, rot2:2, rot3:3}[kind];
    let msg = turn
      ? `${TURN_LABEL[turn]} · ${FLIP_SCOPE_LABEL[forced ? 'all' : scope]}`
      : `พลิก${kind === 'flipH' ? 'แนวนอน' : 'แนวตั้ง'} · ${FLIP_SCOPE_LABEL[scope]}`;
    if(forced) msg += `<br><span class="warn-inline">ผ้าใบไม่จัตุรัส — หมุน 90° ได้เฉพาะทั้งโปรเจกต์ และจะกลายเป็น ${S.H}×${S.W}</span>`;
    if((forced || scope !== 'cell')) msg += `<br><span class="warn-inline">undo ย้อนไม่ได้ แต่กู้กลับได้จากแถบด้านบน</span>`;
    if(turn) msg += `<br>ภาพอ้างอิงไม่หมุนตาม`;
    else if(scope === 'frame' || scope === 'all') msg += `<br>ภาพอ้างอิงพลิกตามไปด้วย`;
    $('flGo').textContent = turn ? 'หมุน' : 'พลิก';
    $('flPrev').innerHTML = msg;
  };
  document.querySelectorAll('#flKind button').forEach(b=>{
    b.onclick = ()=>{ kind = b.dataset.k;
      document.querySelectorAll('#flKind button').forEach(x=>x.classList.toggle('on', x===b)); upd(); };
  });
  document.querySelectorAll('#flScope button').forEach(b=>{
    b.onclick = ()=>{ scope = b.dataset.s;
      document.querySelectorAll('#flScope button').forEach(x=>x.classList.toggle('on', x===b)); upd(); };
  });
  $('flGo').onclick = ()=>{
    const turn = {rot1:1, rot2:2, rot3:3}[kind];
    const sc = quarterSwaps() ? 'all' : scope;
    closeModal();
    setTimeout(()=> turn ? doRotate(turn, sc) : doFlip(kind, sc), 20);
  };
  $('flCancel').onclick = closeModal;
  upd();
}

/* marching-ants style marquee overlay */
function drawSelectionOverlay(z, ox, oy){
  const r = S.float ? S.floatRect : S.sel;
  // drives antsLoop — true while something is selected, false the instant it clears
  selNeedsAnim = !!r;
  if(!r) return;
  const x = ox + r.x*z, y = oy + r.y*z, w = r.w*z, h = r.h*z;
  vctx.save();
  vctx.setLineDash([6, 5]);
  vctx.lineDashOffset = -(Date.now()/55) % 11;
  vctx.strokeStyle = '#ffffff'; vctx.lineWidth = 2;
  vctx.strokeRect(x, y, w, h);
  vctx.setLineDash([6, 5]);
  vctx.lineDashOffset = (-(Date.now()/55) % 11) + 5.5;
  vctx.strokeStyle = '#000000'; vctx.lineWidth = 2;
  vctx.strokeRect(x, y, w, h);
  vctx.restore();
}


/* ══════════════ PNG IMPORT ══════════════ */
/* Reads any image the browser can decode into a raw RGBA buffer at its
   natural size. Nearest-neighbour only — never let the browser smooth it. */
function loadImageFile(file){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/') && !/\.(png|gif|bmp|webp|jpe?g)$/i.test(file.name)){
      reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h) throw new Error('อ่านขนาดภาพไม่ได้');
        if(w > 2048 || h > 2048) throw new Error(`ภาพใหญ่เกินไป (${w}×${h}) — จำกัดที่ 2048px`);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', {willReadFrequently:true});
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, w, h).data;
        URL.revokeObjectURL(url);
        resolve({data: new Uint8ClampedArray(data), w, h, name: file.name});
      } catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('เปิดไฟล์ภาพไม่สำเร็จ — อาจเสียหายหรือไม่รองรับ'));
    };
    img.src = url;
  });
}

/* Place an imported image into the project.
   mode: 'newproject' | 'layer' | 'float'
   fit:  'center' | 'scale' | 'resize' */
function placeImage(img, mode, fit, opts){
  opts = opts || {};
  let src = img.data, sw = img.w, sh = img.h;

  if(mode === 'newproject'){
    commitFloat();
    stopPlayback();
    curProjectId = null; curProjectName = null;
    S.W = sw; S.H = sh;
    S.layers = [{name:'Layer 1', visible:true, opacity:1, frames:[new Uint8ClampedArray(src)]}];
    S.frameCount = 1; S.curLayer = 0; S.curFrame = 0;
    S.tags = []; S.sel = null; S.float = null; S.floatRect = null;
    S.undoStack = []; S.redoStack = [];
    buf.width = sw; buf.height = sh;
    scratch.width = sw; scratch.height = sh;
    bufDirty = true;
    fitToScreen(); renderAll(); updateUndoBtns();
    markProjectDirty();
    return {w:sw, h:sh};
  }

  // A reference is placed, not baked: keep the original pixels and let the
  // ref bar scale them, so 'fit' never has to be decided up front.
  if(mode === 'layer' && opts.ref){
    if(S.layers.length >= 12) throw new Error('จำกัด 12 เลเยอร์ — ลบเลเยอร์เดิมก่อน');
    const nm = (img.name || 'imported').replace(/\.[^.]+$/,'').slice(0,24);
    const L = makeRefLayer(img.data, img.w, img.h, 'อ้างอิง: ' + (nm || 'นำเข้า'), opts.opacity);
    S.layers.push(L);
    // the pen stays where it was — a guide is not a place to draw, and the
    // undo stack still points at real pixels
    S.curLayer = S.layers.length - 1;
    bufDirty = true; renderAll(); markProjectDirty();
    return {w: Math.round(img.w*L.xf.s), h: Math.round(img.h*L.xf.s)};
  }

  // reconcile size mismatch against the current canvas
  if(fit === 'scale' && (sw !== S.W || sh !== S.H)){
    src = scaleCanvasData(src, sw, sh, S.W, S.H);
    sw = S.W; sh = S.H;
  } else if(fit === 'contain' && (sw !== S.W || sh !== S.H)){
    // fit inside the canvas without distorting — what a tracing guide needs
    const k = Math.min(S.W/sw, S.H/sh);
    const nw = Math.max(1, Math.round(sw*k)), nh = Math.max(1, Math.round(sh*k));
    src = scaleCanvasData(src, sw, sh, nw, nh);
    sw = nw; sh = nh;
  } else if(fit === 'resize' && (sw > S.W || sh > S.H)){
    const nw = Math.max(S.W, sw), nh = Math.max(S.H, sh);
    const ow = S.W, oh = S.H;
    applyTransform(nw, nh, f => resizeCanvasData(f, ow, oh, nw, nh, 0), 'ก่อนนำเข้าภาพ');
  }

  if(mode === 'layer'){
    if(S.layers.length >= 12) throw new Error('จำกัด 12 เลเยอร์ — ลบเลเยอร์เดิมก่อน');
    const frames = [];
    for(let i=0;i<S.frameCount;i++) frames.push(new Uint8ClampedArray(S.W*S.H*4));
    const target = frames[S.curFrame];
    const offX = opts.center ? Math.floor((S.W - sw)/2) : 0;
    const offY = opts.center ? Math.floor((S.H - sh)/2) : 0;
    for(let y=0;y<sh;y++){
      const dy = y + offY;
      if(dy<0 || dy>=S.H) continue;
      for(let x=0;x<sw;x++){
        const dx = x + offX;
        if(dx<0 || dx>=S.W) continue;
        const si=(y*sw+x)*4, di=(dy*S.W+dx)*4;
        target[di]=src[si]; target[di+1]=src[si+1]; target[di+2]=src[si+2]; target[di+3]=src[si+3];
      }
    }
    const nm = (img.name || 'imported').replace(/\.[^.]+$/,'').slice(0,24);
    S.layers.push({
      name: nm || 'นำเข้า',
      visible: true,
      opacity: opts.opacity != null ? opts.opacity : 1,
      frames
    });
    S.curLayer = S.layers.length - 1;
    // one undo step removes the whole imported layer instead of wiping history
    pushLayerAdd(S.curLayer);
    bufDirty = true; renderAll(); markProjectDirty();
    return {w:sw, h:sh};
  }

  // 'float': drop in as a moveable selection on the current layer
  commitFloat();
  pushUndo();
  S.float = new Uint8ClampedArray(src);
  const cx = Math.floor((S.W - sw)/2), cy = Math.floor((S.H - sh)/2);
  S.floatRect = {x:cx, y:cy, w:sw, h:sh};
  S.sel = {...S.floatRect};
  selectTool('select');
  bufDirty = true; markDirty(); updateSelBar();
  return {w:sw, h:sh};
}

let restoreBarTimer = null;
function syncBarStack(){
  const rOn = $('restoreBar').classList.contains('on');
  $('selBar').classList.toggle('pushed', rOn);
  // minimap and zoom tag shift down too so nothing overlaps
  const rb = $('restoreBar');
  const shift = rOn ? (rb.offsetHeight + 12) : 0;
  $('minimap').style.transform = shift ? `translateY(${shift}px)` : '';
  $('zoomTag').style.transform = shift ? `translateY(${shift}px)` : '';
}
function showRestoreBar(saved){
  const bar = $('restoreBar');
  if(!saved){
    // snapshot failed (usually storage full) — say so rather than pretend
    toast('พื้นที่เต็ม เก็บจุดกู้คืนไม่ได้ — งานนี้ย้อนกลับไม่ได้', 3400);
    return;
  }
  const rp = getRestorePoint();
  $('rbLabel').textContent = (rp && rp.label) ? rp.label : 'ก่อนแก้ไขล่าสุด';
  bar.classList.add('on');
  syncBarStack();
  clearTimeout(restoreBarTimer);
  restoreBarTimer = setTimeout(hideRestoreBar, 12000);
}
function hideRestoreBar(){
  clearTimeout(restoreBarTimer);
  $('restoreBar').classList.remove('on');
  syncBarStack();
}

function fmtTime(ts){
  const d = new Date(ts), now = Date.now();
  const diff = (now - ts)/1000;
  if(diff < 60) return 'เมื่อครู่';
  if(diff < 3600) return Math.floor(diff/60) + ' นาทีที่แล้ว';
  if(diff < 86400) return Math.floor(diff/3600) + ' ชม.ที่แล้ว';
  return d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtSize(n){
  return n < 1024 ? n+' B' : (n/1024 < 1024 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB');
}

    list.innerHTML = '<p class="empty-note">ยังไม่มีงานที่บันทึกไว้<br>ตั้งชื่อแล้วกดบันทึกด้านบน</p>';
  } else {
    for(const p of idx){
      const el = document.createElement('div');
      el.className = 'proj';
      el.innerHTML = `
        <div class="pth">${safeThumb(p.thumb) ? '<img src="'+safeThumb(p.thumb)+'" style="width:100%;height:100%;image-rendering:pixelated;display:block">' : ''}</div>
        <div class="pi">
          <b>${esc(p.name)}</b>
          <span>${p.w}×${p.h} · ${p.frames} เฟรม · ${p.layers} เลเยอร์ · ${fmtTime(p.saved)}</span>
        </div>
        <button class="pdel" title="ลบ"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      `;
      el.querySelector('.pi').onclick = el.querySelector('.pth').onclick = ()=>{
        if(dirtySinceSave && !confirm('งานปัจจุบันยังไม่ได้บันทึก จะโหลดทับไหม?')) return;
        try { loadProject(p.id); closeModal(); toast('โหลด "'+p.name+'" แล้ว'); }
        catch(err){ toast(err.message, 2600); }
      };
      el.querySelector('.pdel').onclick = (e)=>{
        e.stopPropagation();
        if(!confirm('ลบ "'+p.name+'" ถาวร?')) return;
        deleteProject(p.id);
        showSaveLoad();
      };
      list.appendChild(el);
    }
  }

  const doSave = (asNew)=>{
    const nm = $('slName').value.trim();
    if(!nm){ toast('ใส่ชื่อโปรเจกต์ก่อน'); $('slName').focus(); return; }
    try {
      saveProject(nm, asNew ? null : curProjectId);
      closeModal();
      toast('บันทึก "'+nm+'" แล้ว');
    } catch(err){ toast(err.message, 3200); }
  };
  $('slSave').onclick = ()=>doSave(false);
  if($('slSaveNew')) $('slSaveNew').onclick = ()=>doSave(true);
  $('slFileOut').onclick = ()=>{ exportProjectFile(); toast('ส่งออกไฟล์แล้ว'); };
  $('slFileIn').onclick = ()=>$('slFileInput').click();
  $('slFileInput').onchange = (e)=>{ if(e.target.files[0]) importProjectFile(e.target.files[0]); };
  const guardNew = (fn)=>()=>{
    if(dirtySinceSave && !confirm('งานปัจจุบันยังไม่ได้บันทึก จะเริ่มใหม่ทับไหม?')) return;
    saveRestorePoint('ก่อนเริ่มงานใหม่');
    closeModal();
    setTimeout(fn, 30);
  };
  $('slNewBlank').onclick = guardNew(showNewProject);
  $('slImgIn').onclick = ()=>$('slImgInput').click();
  $('slImgInput').onchange = async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    e.target.value = '';
    if(await offerEmbedded(f)) return;
    toast('กำลังอ่านภาพ…');
    loadImageFile(f)
      .then(img => { closeModal(); showImportImage(img); })
      .catch(err => toast(err.message, 3200));
  };
  $('slPixIn').onclick = ()=>$('slPixInput').click();
  $('slPixInput').onchange = (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    e.target.value = '';
    toast('กำลังอ่านภาพ…');
    loadImageFile(f)
      .then(img => { closeModal(); showPixelize(img); })
      .catch(err => toast(err.message, 3200));
  };
  if($('slInit')) $('slInit').onclick = showServerInit;
  $('slClose').onclick = closeModal;
  $('slSupport').onclick = showSupport;
}

function showResize(){
  let mode = 'resize';      // 'resize' = keep pixel size, change bounds | 'scale' = stretch art
  let anchor = 4;           // center
  let lockRatio = true;
  const ow = S.W, oh = S.H;

  openModal(`
    <h2>ปรับขนาดผืนผ้าใบ</h2>
    <p class="sub">ตอนนี้ <b>${ow}×${oh}</b> · ${S.layers.length} เลเยอร์ · ${S.frameCount} เฟรม</p>

    <div class="seg" id="rzMode">
      <button data-m="resize" class="on">ขยายขอบ / ตัด</button>
      <button data-m="scale">ยืดภาพ</button>
    </div>

    <div class="fieldrow">
      <div class="field"><label>กว้าง</label><input type="number" id="rzW" value="${ow}" min="1" max="1024" inputmode="numeric"></div>
      <div class="field"><label>สูง</label><input type="number" id="rzH" value="${oh}" min="1" max="1024" inputmode="numeric"></div>
    </div>

    <label class="lock-row"><input type="checkbox" id="rzLock" checked> ล็อกอัตราส่วน</label>

    <div class="mult" id="rzMult">
      <button data-k="0.5">÷2</button>
      <button data-k="2">×2</button>
      <button data-k="3">×3</button>
      <button data-k="4">×4</button>
      <button data-k="reset">คืนค่า</button>
    </div>

    <div id="anchorWrap">
      <div class="anchor-lbl">ยึดตำแหน่งเดิมไว้ที่</div>
      <div id="anchorGrid">
        ${[0,1,2,3,4,5,6,7,8].map(i=>`<button data-a="${i}"${i===4?' class="on"':''}></button>`).join('')}
      </div>
    </div>

    <div class="rz-preview" id="rzPrev"></div>
    <p class="warn" id="rzWarn"></p>

    <button class="big-btn" id="rzGo">ปรับขนาด</button>
    <button class="big-btn ghost" id="rzCrop">ตัดขอบว่างอัตโนมัติ</button>
    <button class="big-btn ghost" id="rzClose">ยกเลิก</button>
  `);

  const wI = $('rzW'), hI = $('rzH'), prev = $('rzPrev'), warn = $('rzWarn');

  function update(){
    const w = Math.max(1, Math.min(1024, +wI.value|0));
    const h = Math.max(1, Math.min(1024, +hI.value|0));
    const oldPx = ow*oh, newPx = w*h;
    const mem = (newPx*4*S.layers.length*S.frameCount)/1048576;

    let msg;
    if(mode === 'scale'){
      const fx = (w/ow), fy = (h/oh);
      const clean = Number.isInteger(fx) && Number.isInteger(fy) && fx===fy;
      msg = `ยืดภาพจาก <b>${ow}×${oh}</b> เป็น <b>${w}×${h}</b><br>`
          + `ทุกพิกเซลถูกสุ่มใหม่แบบ nearest-neighbour · RAM ≈ <b>${mem.toFixed(1)} MB</b>`;
      if(!clean) msg += `<br><span class="warn-inline">อัตราส่วนไม่ลงตัว — พิกเซลจะไม่เท่ากันทุกช่อง</span>`;
      if(newPx < oldPx) msg += `<br><span class="warn-inline">ย่อลงแล้วรายละเอียดหายถาวร</span>`;
    } else {
      const dw = w-ow, dh = h-oh;
      const parts = [];
      if(dw>0) parts.push('กว้างขึ้น '+dw+' px'); else if(dw<0) parts.push('ตัดกว้าง '+(-dw)+' px');
      if(dh>0) parts.push('สูงขึ้น '+dh+' px'); else if(dh<0) parts.push('ตัดสูง '+(-dh)+' px');
      msg = `ผืนผ้าใบ <b>${ow}×${oh}</b> → <b>${w}×${h}</b><br>`
          + (parts.length ? parts.join(' · ') : 'ขนาดเท่าเดิม')
          + `<br>ภาพเดิมคงขนาดพิกเซลไว้ · RAM ≈ <b>${mem.toFixed(1)} MB</b>`;
      if(dw<0 || dh<0) msg += `<br><span class="warn-inline">ส่วนที่อยู่นอกกรอบใหม่จะถูกตัดทิ้งถาวร</span>`;
    }
    prev.innerHTML = msg;

    if(mem > 220){ warn.textContent = 'ใหญ่มาก — บนมือถืออาจค้างหรือแท็บถูกปิด แนะนำลดเลเยอร์หรือเฟรมก่อน'; warn.classList.add('on'); }
    else if(mem > 90){ warn.textContent = 'กินหน่วยความจำสูง — เซฟงานก่อนปรับ'; warn.classList.add('on'); }
    else warn.classList.remove('on');

    $('anchorWrap').style.display = (mode === 'resize') ? '' : 'none';
    $('rzGo').textContent = (mode === 'scale') ? 'ยืดภาพ' : 'ปรับขนาด';
  }

  let syncing = false;
  wI.oninput = ()=>{
    if(lockRatio && !syncing){ syncing=true; hI.value = Math.max(1, Math.round((+wI.value||1) * oh/ow)); syncing=false; }
    update();
  };
  hI.oninput = ()=>{
    if(lockRatio && !syncing){ syncing=true; wI.value = Math.max(1, Math.round((+hI.value||1) * ow/oh)); syncing=false; }
    update();
  };
  $('rzLock').onchange = e => { lockRatio = e.target.checked; };

  document.querySelectorAll('#rzMode button').forEach(b=>{
    b.onclick = ()=>{
      mode = b.dataset.m;
      document.querySelectorAll('#rzMode button').forEach(x=>x.classList.toggle('on', x===b));
      update();
    };
  });
  document.querySelectorAll('#anchorGrid button').forEach(b=>{
    b.onclick = ()=>{
      anchor = +b.dataset.a;
      document.querySelectorAll('#anchorGrid button').forEach(x=>x.classList.toggle('on', x===b));
    };
  });
  document.querySelectorAll('#rzMult button').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k;
      if(k === 'reset'){ wI.value = ow; hI.value = oh; }
      else {
        wI.value = Math.max(1, Math.round(ow * parseFloat(k)));
        hI.value = Math.max(1, Math.round(oh * parseFloat(k)));
      }
      update();
    };
  });

  $('rzGo').onclick = ()=>{
    const w = Math.max(1, Math.min(1024, +wI.value|0));
    const h = Math.max(1, Math.min(1024, +hI.value|0));
    if(w === ow && h === oh){ toast('ขนาดเท่าเดิม'); return; }
    const shrinking = (mode==='resize') && (w < ow || h < oh);
    const downscaling = (mode==='scale') && (w*h < ow*oh);
    if((shrinking || downscaling) && !confirm('งานบางส่วนจะหายถาวร และ undo ย้อนไม่ได้ — ยืนยันไหม?')) return;
    closeModal();
    setTimeout(()=>{
      if(mode === 'scale') doScale(w, h);
      else doResize(w, h, anchor);
      toast(`ปรับเป็น ${w}×${h} แล้ว`);
    }, 30);
  };
  $('rzCrop').onclick = ()=>{
    const b = contentBounds();
    if(!b){ toast('ผืนผ้าใบว่าง — ไม่มีอะไรให้ตัด'); return; }
    if(b.w === S.W && b.h === S.H){ toast('งานเต็มผืนผ้าใบอยู่แล้ว'); return; }
    if(!confirm(`ตัดเหลือ ${b.w}×${b.h} (จาก ${S.W}×${S.H}) — undo ย้อนไม่ได้ ยืนยันไหม?`)) return;
    closeModal();
    setTimeout(()=>{
      const r = doCropToContent();
      if(r) toast(`ตัดเหลือ ${r.w}×${r.h} แล้ว`);
    }, 30);
  };
  $('rzClose').onclick = closeModal;

  update();
}

function showTags(){
  let draft = S.tags.length
    ? S.tags.map(t=>({...t}))
    : [{name:'idle', from:0, to:Math.max(0,S.frameCount-1)}];

  openModal(`
    <h2>ช่วงอนิเมชั่น</h2>
    <p class="sub">แบ่งไทม์ไลน์ ${S.frameCount} เฟรมเป็นคลิปย่อย เช่น idle, walk, attack — ชื่อและช่วงนี้จะติดไปกับไฟล์ atlas ตอน export</p>
    <div id="tagList"></div>
    <p class="tag-err" id="tagErr"></p>
    <button class="big-btn ghost" id="tagAdd" style="margin-top:0">+ เพิ่มช่วง</button>
    <button class="big-btn" id="tagSave">บันทึก</button>
    <button class="big-btn ghost" id="tagClear">ล้างทั้งหมด (ใช้ทั้งไทม์ไลน์)</button>
  `);

  function validate(){
    const err = $('tagErr');
    for(const t of draft){
      if(!t.name.trim()){ err.textContent='ชื่อช่วงห้ามว่าง'; err.classList.add('on'); return false; }
      if(t.from > t.to){ err.textContent=`"${t.name}": เฟรมเริ่มต้องไม่เกินเฟรมจบ`; err.classList.add('on'); return false; }
      if(t.from < 0 || t.to >= S.frameCount){ err.textContent=`"${t.name}": เฟรมต้องอยู่ระหว่าง 0-${S.frameCount-1}`; err.classList.add('on'); return false; }
    }
    const names = draft.map(t=>t.name.trim());
    if(new Set(names).size !== names.length){ err.textContent='ชื่อช่วงห้ามซ้ำกัน'; err.classList.add('on'); return false; }
    err.classList.remove('on');
    return true;
  }

  function render(){
    const list = $('tagList');
    list.innerHTML = '';
    draft.forEach((t, i)=>{
      const row = document.createElement('div');
      row.className = 'tag-row';
      row.innerHTML = `
        <input class="tn" value="${esc(t.name)}" placeholder="ชื่อ">
        <input class="tr" type="number" value="${t.from}" min="0" max="${S.frameCount-1}" inputmode="numeric">
        <span class="dash">→</span>
        <input class="tr" type="number" value="${t.to}" min="0" max="${S.frameCount-1}" inputmode="numeric">
        <button class="trm"><svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
      `;
      const [nm, fr, to] = row.querySelectorAll('input');
      nm.oninput = ()=>{ t.name = nm.value; validate(); };
      fr.oninput = ()=>{ t.from = Math.max(0, +fr.value|0); validate(); };
      to.oninput = ()=>{ t.to = Math.max(0, +to.value|0); validate(); };
      row.querySelector('.trm').onclick = ()=>{ draft.splice(i,1); render(); validate(); };
      list.appendChild(row);
    });
    if(!draft.length) list.innerHTML = '<p class="empty-note">ไม่มีช่วง — จะ export เป็นคลิปเดียวทั้งไทม์ไลน์</p>';
  }

  $('tagAdd').onclick = ()=>{
    const last = draft[draft.length-1];
    const start = last ? Math.min(S.frameCount-1, last.to+1) : 0;
    draft.push({name:'clip'+(draft.length+1), from:start, to:Math.max(start, S.frameCount-1)});
    render(); validate();
  };
  $('tagSave').onclick = ()=>{
    if(!validate()) return;
    S.tags = draft.map(t=>({name:t.name.trim(), from:t.from, to:t.to}));
    markProjectDirty();
    closeModal();
    toast(S.tags.length ? `บันทึก ${S.tags.length} ช่วงแล้ว` : 'ล้างช่วงแล้ว');
  };
  $('tagClear').onclick = ()=>{
    S.tags = [];
    markProjectDirty();
    closeModal();
    toast('ใช้ทั้งไทม์ไลน์เป็นคลิปเดียว');
  };
  render();
}

/* ---- atlas exports: sheet PNG + engine metadata, bundled in a zip ---- */
function buildSheetCanvas(){
  commitFloat();
  const {cols, w, h} = sheetLayout();
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(let i=0;i<S.frameCount;i++){
    ctx.drawImage(flattenFrame(i), (i%cols)*S.W, Math.floor(i/cols)*S.H);
  }
  return c;
}
async function exportAtlas(kind){
  if(typeof JSZip === 'undefined'){ expStatus('โหลด JSZip ไม่สำเร็จ — ตรวจอินเทอร์เน็ต'); return; }
  expStatus('กำลังสร้าง atlas…');
  try {
    const base = baseName();
    const imgName = base + '.png';
    const sheet = buildSheetCanvas();
    const png = await new Promise(r => sheet.toBlob(r, 'image/png'));

    const zip = new JSZip();
    zip.file(imgName, png);
    let note;

    if(kind === 'phaser'){
      zip.file(base + '.json', JSON.stringify(buildPhaserAtlas(imgName), null, 2));
      zip.file('README.txt',
        'Phaser 3 texture atlas (JSON Hash)\n\n' +
        'preload():\n' +
        `  this.load.atlas('${base}', '${imgName}', '${base}.json');\n\n` +
        'create():\n' +
        effectiveTags().map(t =>
          `  this.anims.create({\n` +
          `    key: '${t.name}',\n` +
          `    frames: this.anims.generateFrameNames('${base}', {\n` +
          `      prefix: '${base}_', start: ${t.from}, end: ${t.to}, zeroPad: 3\n` +
          `    }),\n` +
          `    frameRate: ${S.fps}, repeat: -1\n` +
          `  });`).join('\n') +
        `\n\n  this.add.sprite(x, y, '${base}').play('${effectiveTags()[0].name}');\n`
      );
      note = 'Phaser 3';
    } else if(kind === 'godot'){
      zip.file(base + '_frames.tres', buildGodotTres(imgName));
      zip.file('README.txt',
        'Godot 4 SpriteFrames\n\n' +
        `1. วาง ${imgName} และ ${base}_frames.tres ไว้ใน res:// (โฟลเดอร์เดียวกัน)\n` +
        '2. เลือกไฟล์ PNG ในแท็บ Import ตั้ง Filter = Nearest แล้วกด Reimport\n' +
        '   (ถ้าไม่ตั้ง ภาพ pixel art จะเบลอ)\n' +
        `3. เพิ่มโหนด AnimatedSprite2D แล้วลาก ${base}_frames.tres ใส่ช่อง Sprite Frames\n\n` +
        'เล่นใน GDScript:\n' +
        effectiveTags().map(t => `  $AnimatedSprite2D.play("${t.name}")`).join('\n') + '\n\n' +
        'หมายเหตุ: ถ้าย้ายไฟล์ ต้องแก้ path ในบรรทัด ext_resource ของ .tres ด้วย\n'
      );
      note = 'Godot 4';
    } else {
      zip.file(base + '.json', JSON.stringify(buildAsepriteAtlas(imgName), null, 2));
      zip.file('README.txt',
        'Aseprite-compatible JSON (JSON Array)\n\n' +
        'รูปแบบกลางที่หลายเอนจินและ importer อ่านได้\n' +
        'เฟรมเรียงซ้าย→ขวา บน→ล่าง · duration เป็นมิลลิวินาทีต่อเฟรม\n' +
        'meta.frameTags บอกช่วงอนิเมชั่นแต่ละคลิป\n'
      );
      note = 'Aseprite JSON';
    }

    const out = await zip.generateAsync({type:'blob'});
    download(out, base + '_' + kind + '.zip');
    const {cols, rows} = sheetLayout();
    expStatus(`เสร็จ · ${note} · ${cols}×${rows} · ${effectiveTags().length} คลิป`);
  } catch(err){
    expStatus('ผิดพลาด: ' + err.message);
  }
}

/* ══════════════ IMAGE → PIXEL ART ══════════════ */
/* A photo turned into pixel art is two separate problems: too many pixels and
   too many colours. Solve them in that order — box-average down to the grid
   first (so detail averages instead of being dropped by point sampling), then
   quantize to a small palette. Doing it the other way round bands the photo
   before the averaging has a chance to keep the shapes readable. */

const PX_MAX_GRID = 512;
const PX_ORD_AMT  = 26;   // ordered-dither amplitude, in 0-255 colour units
const PX_ALPHA_CUT = 128; // below this the pixel is dropped, not blended

/* Box average. Weighted by alpha so transparent edges don't drag their
   (often black) colour into the neighbouring solid pixels. */
function pxDownscale(src, sw, sh, dw, dh){
  const out = new Uint8ClampedArray(dw*dh*4);
  const xr = sw/dw, yr = sh/dh;
  for(let y=0;y<dh;y++){
    const y0 = Math.floor(y*yr);
    const y1 = Math.min(sh, Math.max(y0+1, Math.ceil((y+1)*yr)));
    for(let x=0;x<dw;x++){
      const x0 = Math.floor(x*xr);
      const x1 = Math.min(sw, Math.max(x0+1, Math.ceil((x+1)*xr)));
      let r=0,g=0,b=0,a=0,aw=0,n=0;
      for(let yy=y0;yy<y1;yy++){
        for(let xx=x0;xx<x1;xx++){
          const i = (yy*sw+xx)*4, al = src[i+3]/255;
          r += src[i]*al; g += src[i+1]*al; b += src[i+2]*al;
          aw += al; a += src[i+3]; n++;
        }
      }
      const o = (y*dw+x)*4;
      if(aw > 0){ out[o]=r/aw; out[o+1]=g/aw; out[o+2]=b/aw; }
      out[o+3] = n ? a/n : 0;
    }
  }
  return out;
}

/* Point sample — keeps hard edges when the source is already pixel art */
function pxPointScale(src, sw, sh, dw, dh){
  const out = new Uint8ClampedArray(dw*dh*4);
  for(let y=0;y<dh;y++){
    const sy = Math.min(sh-1, Math.floor((y+0.5)*sh/dh));
    for(let x=0;x<dw;x++){
      const sx = Math.min(sw-1, Math.floor((x+0.5)*sw/dw));
      const i=(sy*sw+sx)*4, o=(y*dw+x)*4;
      out[o]=src[i]; out[o+1]=src[i+1]; out[o+2]=src[i+2]; out[o+3]=src[i+3];
    }
  }
  return out;
}

/* Median cut — split the colour cloud on its widest axis until there are
   enough boxes, then average each one. Cheap, and it keeps small bright
   areas that a frequency count would throw away. */
function pxSplitAxis(box){
  let mn=[255,255,255], mx=[0,0,0];
  for(const p of box) for(let c=0;c<3;c++){
    if(p[c]<mn[c]) mn[c]=p[c];
    if(p[c]>mx[c]) mx[c]=p[c];
  }
  let ch=0, range=-1;
  for(let c=0;c<3;c++){ const r = mx[c]-mn[c]; if(r>range){ range=r; ch=c; } }
  return {ch, range};
}
function pxMedianCut(data, n){
  const total = data.length/4;
  const step = Math.max(1, Math.floor(total/24000)) * 4;   // cap the sample
  const px = [];
  for(let i=0;i<data.length;i+=step){
    if(data[i+3] >= PX_ALPHA_CUT) px.push([data[i], data[i+1], data[i+2]]);
  }
  if(!px.length) return [[0,0,0]];
  let boxes = [px];
  while(boxes.length < n){
    let bi=-1, best=0;
    for(let i=0;i<boxes.length;i++){
      if(boxes[i].length < 2) continue;
      // range alone hands a tiny speck the same budget as the background;
      // sqrt(count) tilts it toward colours that actually cover area
      const s = pxSplitAxis(boxes[i]).range * Math.sqrt(boxes[i].length);
      if(s > best){ best = s; bi = i; }
    }
    if(bi < 0) break;                     // every box is a single colour
    const b = boxes[bi], ch = pxSplitAxis(b).ch;
    b.sort((p,q)=>p[ch]-q[ch]);
    const mid = b.length >> 1;
    boxes.splice(bi, 1, b.slice(0, mid), b.slice(mid));
  }
  return boxes.map(b=>{
    let r=0,g=0,bl=0;
    for(const p of b){ r+=p[0]; g+=p[1]; bl+=p[2]; }
    return [Math.round(r/b.length), Math.round(g/b.length), Math.round(bl/b.length)];
  });
}

/* Lloyd refinement — median cut only picks the boxes; this moves each colour
   to the true centre of the pixels that ended up choosing it. Measured on a
   900px source: RMSE drops 10-14% (64px/16 colours 13.79 -> 12.30).
   Centroids only need a representative sample, so above the cap it strides
   instead of touching every pixel — at 512x512 that is 31ms instead of 168ms
   for the same RMSE (7.93), and 0.8% worse at 384. */
function pxRefine(data, pal, iters, cap = 40000){
  const step = Math.max(1, Math.floor((data.length/4)/cap)) * 4;
  pal = pal.map(p => p.slice());
  for(let it=0; it<iters; it++){
    const sum = pal.map(()=>[0,0,0,0]);
    for(let i=0;i<data.length;i+=step){
      if(data[i+3] < PX_ALPHA_CUT) continue;
      let bi=0, bd=Infinity;
      for(let k=0;k<pal.length;k++){
        const p = pal[k], dr = data[i]-p[0], dg = data[i+1]-p[1], db = data[i+2]-p[2];
        const d = dr*dr*0.299 + dg*dg*0.587 + db*db*0.114;
        if(d < bd){ bd = d; bi = k; }
      }
      const s = sum[bi];
      s[0]+=data[i]; s[1]+=data[i+1]; s[2]+=data[i+2]; s[3]++;
    }
    for(let k=0;k<pal.length;k++) if(sum[k][3]){
      pal[k] = [sum[k][0]/sum[k][3], sum[k][1]/sum[k][3], sum[k][2]/sum[k][3]];
    }
  }
  return pal.map(p => p.map(Math.round));
}

/* Clusters that lost all their pixels keep their old centre, which can
   collide with a neighbour — drop the duplicates so the reported (and
   applied) colour count is the real one. */
function pxDedupe(pal){
  const seen = new Set(), out = [];
  for(const c of pal){
    const k = (c[0]<<16)|(c[1]<<8)|c[2];
    if(!seen.has(k)){ seen.add(k); out.push(c); }
  }
  return out;
}

/* Saturation and contrast, around luma. A photo averaged down to 64px goes
   flat, and quantizing a flat image just makes it muddy. Levels measured for
   newly-clipped channels on a photo-like source: soft 0%, strong 3.3%
   (1.6/1.3 hit 7.3% and was dropped). */
const PX_BOOST = {none:null, soft:[1.15,1.06], hard:[1.40,1.20]};
function pxBoostColors(data, sat, con){
  const out = new Uint8ClampedArray(data);   // clamps for us on assignment
  for(let i=0;i<data.length;i+=4){
    if(data[i+3] === 0) continue;
    const l = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    for(let c=0;c<3;c++) out[i+c] = (l + (data[i+c]-l)*sat - 128)*con + 128;
  }
  return out;
}

function pxNearest(pal, r, g, b){
  let bi=0, bd=Infinity;
  for(let i=0;i<pal.length;i++){
    const p = pal[i], dr = r-p[0], dg = g-p[1], db = b-p[2];
    // luma-weighted distance — matches what the eye notices
    const d = dr*dr*0.299 + dg*dg*0.587 + db*db*0.114;
    if(d < bd){ bd = d; bi = i; }
  }
  return pal[bi];
}

const PX_BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5].map(v => v/16 - 0.47);

/* Map every pixel onto the palette. 'floyd' pushes the rounding error onto
   pixels not yet visited, so it needs a float working buffer — clamping
   inside a Uint8 array would swallow the error and band the gradients. */
function pxQuantize(data, w, h, pal, dither){
  const n = w*h;
  const work = new Float32Array(n*3);
  for(let p=0;p<n;p++){
    work[p*3] = data[p*4]; work[p*3+1] = data[p*4+1]; work[p*3+2] = data[p*4+2];
  }
  const out = new Uint8ClampedArray(n*4);
  const cache = new Map();
  const spill = (p, er, eg, eb, k) => {
    if(p < 0 || p >= n) return;
    work[p*3] += er*k; work[p*3+1] += eg*k; work[p*3+2] += eb*k;
  };
  const cl = v => v < 0 ? 0 : v > 255 ? 255 : v;

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const p = y*w + x, i = p*4;
      // a hard cut turns anti-aliased edges into stairs; when the user asked
      // for dithering, dither the alpha decision too
      const cut = dither === 'none'
        ? PX_ALPHA_CUT
        : (PX_BAYER[(y&3)*4 + (x&3)] + 0.47) * 255;
      if(data[i+3] <= cut) continue;              // stays fully transparent
      let r = work[p*3], g = work[p*3+1], b = work[p*3+2];
      if(dither === 'ordered'){
        const t = PX_BAYER[(y&3)*4 + (x&3)] * PX_ORD_AMT;
        r += t; g += t; b += t;
      }
      r = cl(r); g = cl(g); b = cl(b);
      const key = (Math.round(r)<<16) | (Math.round(g)<<8) | Math.round(b);
      let c = cache.get(key);
      if(!c){ c = pxNearest(pal, r, g, b); cache.set(key, c); }
      out[i]=c[0]; out[i+1]=c[1]; out[i+2]=c[2]; out[i+3]=255;
      if(dither === 'floyd'){
        const er = r-c[0], eg = g-c[1], eb = b-c[2];
        if(x+1 < w)  spill(p+1,   er,eg,eb, 7/16);
        if(y+1 < h){
          if(x > 0)   spill(p+w-1, er,eg,eb, 3/16);
          spill(p+w, er,eg,eb, 5/16);
          if(x+1 < w) spill(p+w+1, er,eg,eb, 1/16);
        }
      }
    }
  }
  return out;
}

/* Target grid. 'fit' means the biggest size that still lands inside the
   current canvas without distorting; a number means that width, aspect kept. */
function pxGrid(img, size){
  if(size === 'fit'){
    // a 1024 canvas would ask for a megapixel preview on every tap — cap it
    const k = Math.min(S.W/img.w, S.H/img.h, PX_MAX_GRID/img.w, PX_MAX_GRID/img.h);
    return {w: Math.max(1, Math.round(img.w*k)), h: Math.max(1, Math.round(img.h*k))};
  }
  const tw = Math.min(PX_MAX_GRID, size);
  return {w: tw, h: Math.max(1, Math.round(img.h * tw / img.w))};
}

const rgbToHex = c => '#' + [c[0],c[1],c[2]].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0')).join('');

function showPixelize(img){
  const hasWork = artLayers().some(L => L.frames.some(v => v.some(x => x !== 0)));
  let size = 64, colors = 16, dither = 'none', smooth = true, usePal = false, boost = 'none';
  let mode = hasWork ? 'layer' : 'newproject';
  let takePal = true;
  let res = null;
  let srcCache = {key:'', data:null};

  openModal(`
    <h2>แปลงภาพเป็นพิกเซล</h2>
    <p class="sub"><b>${esc(img.name)}</b> · ต้นฉบับ <b>${img.w}×${img.h}</b></p>

    <div class="px-stage"><canvas id="pxCv"></canvas></div>
    <div class="rz-preview" id="pxInfo"></div>

    <div class="sec-lbl">ความละเอียด (ด้านกว้าง)</div>
    <div class="seg px-sizes" id="pxSize">
      <button data-s="32">32</button>
      <button data-s="48">48</button>
      <button data-s="64" class="on">64</button>
      <button data-s="96">96</button>
    </div>
    <div class="seg px-sizes" id="pxSize2">
      <button data-s="128">128</button>
      <button data-s="192">192</button>
      <button data-s="256">256</button>
      <button data-s="512">512</button>
    </div>
    <button class="px-fit" id="pxFit">พอดีผืนผ้าใบ · <b id="pxFitSize">—</b></button>

    <div class="sec-lbl">จำนวนสี</div>
    <div class="seg" id="pxCol">
      <button data-c="4">4</button>
      <button data-c="8">8</button>
      <button data-c="16" class="on">16</button>
      <button data-c="24">24</button>
      <button data-c="32">32</button>
    </div>

    <div class="sec-lbl">ดิเธอร์ (มีผลกับขอบโปร่งด้วย)</div>
    <div class="seg" id="pxDit">
      <button data-d="none" class="on">ปิด</button>
      <button data-d="ordered">ลายตาราง</button>
      <button data-d="floyd">เกลี่ยไล่สี</button>
    </div>

    <div class="sec-lbl">ดันสี/คอนทราสต์ก่อนลดสี</div>
    <div class="seg" id="pxBoost">
      <button data-b="none" class="on">ปิด</button>
      <button data-b="soft">อ่อน</button>
      <button data-b="hard">แรง</button>
    </div>

    <label class="lock-row"><input type="checkbox" id="pxSmooth" checked> เฉลี่ยสีตอนย่อ — ปิดถ้าต้นฉบับเป็นพิกเซลอาร์ตอยู่แล้ว</label>
    <label class="lock-row"><input type="checkbox" id="pxUsePal"> บังคับใช้จานสีของโปรเจกต์ (${S.palette.length} สี)</label>
    <label class="lock-row" id="pxTakeRow"><input type="checkbox" id="pxTakePal" checked> ตั้งสีที่ได้เป็นจานสีโปรเจกต์</label>

    <div class="sec-lbl">วางยังไง</div>
    <div class="seg" id="pxMode">
      <button data-m="newproject"${mode==='newproject'?' class="on"':''}>โปรเจกต์ใหม่</button>
      <button data-m="layer"${mode==='layer'?' class="on"':''}>เลเยอร์ใหม่</button>
      <button data-m="float">วางลอย</button>
    </div>

    <button class="big-btn" id="pxGo">ใช้ภาพนี้</button>
    <button class="big-btn ghost" id="pxCancel">ยกเลิก</button>
  `);

  const cv = $('pxCv'), ctx = cv.getContext('2d');

  /* 512x512 costs ~160ms per rebuild here and roughly triple that on a phone,
     so tapping through the presets shouldn't queue one job per tap */
  let buildTimer = null;
  function scheduleBuild(){
    clearTimeout(buildTimer);
    const g = pxGrid(img, size);
    buildTimer = setTimeout(build, g.w*g.h > 65536 ? 140 : 0);
  }

  function build(){
    const g = pxGrid(img, size);
    const key = g.w+'x'+g.h+(smooth?'s':'p');
    if(srcCache.key !== key){
      srcCache = {key, data: smooth
        ? pxDownscale(img.data, img.w, img.h, g.w, g.h)
        : pxPointScale(img.data, img.w, img.h, g.w, g.h)};
    }
    const b = PX_BOOST[boost];
    const base = b ? pxBoostColors(srcCache.data, b[0], b[1]) : srcCache.data;
    const pal = usePal && S.palette.length
      ? S.palette.map(h => hexToRgba(h).slice(0,3))
      : pxDedupe(pxRefine(base, pxMedianCut(base, colors), 4));
    res = {data: pxQuantize(base, g.w, g.h, pal, dither), w:g.w, h:g.h, name:img.name, pal};

    cv.width = g.w; cv.height = g.h;
    ctx.putImageData(new ImageData(new Uint8ClampedArray(res.data), g.w, g.h), 0, 0);

    const fit = pxGrid(img, 'fit');
    $('pxFitSize').textContent = fit.w + '×' + fit.h;

    let msg = `ผลลัพธ์ <b>${g.w}×${g.h}</b> · <b>${pal.length}</b> สี`;
    if(usePal) msg += ' (จานสีโปรเจกต์)';
    if(mode === 'newproject'){
      msg += `<br>สร้างโปรเจกต์ใหม่ขนาด <b>${g.w}×${g.h}</b>`;
      if(hasWork) msg += `<br><span class="warn-inline">งานที่ทำอยู่จะถูกแทนที่ทั้งหมด</span>`;
    } else {
      msg += `<br>${mode==='layer' ? `เพิ่มเป็นเลเยอร์ใหม่ที่เฟรม ${S.curFrame+1}` : 'วางลอยให้ลากย้ายได้'} · ผืนผ้าใบ <b>${S.W}×${S.H}</b>`;
      if(g.w > S.W || g.h > S.H) msg += `<br><span class="warn-inline">ใหญ่กว่าผืนผ้าใบ — ผืนผ้าใบจะถูกขยายให้พอดี</span>`;
    }
    $('pxInfo').innerHTML = msg;
  }

  const seg = (wrap, attr, set) => document.querySelectorAll('#'+wrap+' button').forEach(b=>{
    b.onclick = ()=>{
      set(b.dataset[attr]);
      document.querySelectorAll('#'+wrap+' button').forEach(x=>x.classList.toggle('on', x===b));
      scheduleBuild();
    };
  });
  // two rows plus the fit button behave as one exclusive group
  const sizeBtns = ()=>[...document.querySelectorAll('#pxSize button, #pxSize2 button')];
  function markSize(){
    sizeBtns().forEach(b => b.classList.toggle('on', size !== 'fit' && +b.dataset.s === size));
    $('pxFit').classList.toggle('on', size === 'fit');
  }
  sizeBtns().forEach(b => b.onclick = ()=>{ size = +b.dataset.s; markSize(); scheduleBuild(); });
  $('pxFit').onclick = ()=>{ size = 'fit'; markSize(); scheduleBuild(); };

  seg('pxCol',  'c', v => colors = +v);
  seg('pxDit',  'd', v => dither = v);
  seg('pxBoost','b', v => boost = v);
  seg('pxMode', 'm', v => mode = v);

  // forcing the project palette and harvesting one from the image are
  // mutually exclusive — don't leave a checkbox that quietly does nothing
  function syncPalRow(){
    $('pxTakePal').disabled = usePal;
    $('pxTakeRow').classList.toggle('off', usePal);
  }
  $('pxSmooth').onchange  = e => { smooth = e.target.checked; scheduleBuild(); };
  $('pxUsePal').onchange  = e => { usePal = e.target.checked; syncPalRow(); scheduleBuild(); };
  $('pxTakePal').onchange = e => { takePal = e.target.checked; };

  $('pxGo').onclick = ()=>{
    if(mode === 'newproject' && hasWork){
      if(!confirm('งานที่ทำอยู่จะหายทั้งหมด ยืนยันไหม?')) return;
      saveRestorePoint('ก่อนแปลงภาพเป็นพิกเซล');
    }
    closeModal();
    setTimeout(()=>{
      try {
        const bigger = (res.w > S.W || res.h > S.H);
        const r = placeImage(res, mode, bigger ? 'resize' : 'center', {center:true});
        if(takePal && !usePal) applyPalette(res.pal.map(rgbToHex));
        toast(`แปลงเป็นพิกเซล ${r.w}×${r.h} แล้ว`);
      } catch(err){
        toast('แปลงไม่สำเร็จ: ' + err.message, 3000);
      }
    }, 30);
  };
  $('pxCancel').onclick = closeModal;
  syncPalRow();
  markSize();
  build();
}

  function update(){

    const refWrap = $('imRefWrap');
    // fit choice is irrelevant when starting a new project
    fitWrap.style.display = (mode === 'newproject' || sameSize) ? 'none' : '';
    refWrap.style.display = (mode === 'layer') ? '' : 'none';

    let msg;
    if(mode === 'newproject'){
      msg = `สร้างโปรเจกต์ใหม่ขนาด <b>${img.w}×${img.h}</b> จากภาพนี้`;
      if(hasWork) msg += `<br><span class="warn-inline">งานที่ทำอยู่จะถูกแทนที่ทั้งหมด</span>`;

  };
  let takePal = false;
  $('imPal').onchange = e => { takePal = e.target.checked; };

  $('imGo').onclick = ()=>{
    if(mode === 'newproject' && hasWork){
      if(!confirm('งานที่ทำอยู่จะหายทั้งหมด ยืนยันไหม?')) return;
      saveRestorePoint('ก่อนนำเข้า ' + img.name);
    }
    closeModal();
    setTimeout(()=>{
      try {
        const r = placeImage(img, mode, fit, {
          center: true,
          ref: (asRef && mode === 'layer'),
          opacity: (asRef && mode === 'layer') ? 0.4 : 1
        });
        if(takePal){
          const counts = new Map();
          for(let i=0;i<img.data.length;i+=4){
            if(img.data[i+3] < 8) continue;
            const k = (img.data[i]<<16 | img.data[i+1]<<8 | img.data[i+2]);
            counts.set(k, (counts.get(k)||0)+1);
          }
          const cols = [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,32)
            .map(([k])=>'#'+k.toString(16).padStart(6,'0'));
          if(cols.length) applyPalette(cols);
        }
        toast(mode === 'float' ? 'วางแล้ว — ลากเพื่อย้าย' : `นำเข้า ${r.w}×${r.h} แล้ว`);
      } catch(err){
        toast('นำเข้าไม่สำเร็จ: ' + err.message, 3000);
      }
    }, 30);
  };
  $('imPixel').onclick = ()=>{ closeModal(); setTimeout(()=>showPixelize(img), 30); };
  $('imCancel').onclick = closeModal;
  update();
}

/* Built-in colour picker — replaces <input type="color">, whose native
   dialog can't be styled and looks foreign inside the app. */
function showColorPicker(startHex, onPick){
  let [hu, sa, va] = hexToHsv(startHex || '#000000');
  let current = startHex || '#000000';

  openModal(`
    <h2>เลือกสี</h2>
    <div class="cp-wrap">
      <canvas id="cpSV" class="cp-sv"></canvas>
      <canvas id="cpHue" class="cp-hue"></canvas>
    </div>
    <div class="cp-foot">
      <div class="cp-prev" id="cpPrev"></div>
      <div class="field" style="flex:1">
        <label>โค้ดสี</label>
        <input type="text" id="cpHex" value="${current}" maxlength="7" spellcheck="false">
      </div>
    </div>
    <button class="big-btn" id="cpOk">ใช้สีนี้</button>
    <button class="big-btn ghost" id="cpCancel">ยกเลิก</button>
  `);

  const sv = $('cpSV'), hue = $('cpHue');
  const svc = sv.getContext('2d'), huec = hue.getContext('2d');

  function sizeCanvases(){
    const w = sv.clientWidth || 260, h = sv.clientHeight || 180;
    const r = Math.min(window.devicePixelRatio||1, 2);
    sv.width = w*r; sv.height = h*r;
    hue.width = (hue.clientWidth||260)*r; hue.height = (hue.clientHeight||26)*r;
    svc.setTransform(r,0,0,r,0,0);
    huec.setTransform(r,0,0,r,0,0);
  }
  function drawSV(){
    const w = sv.width/(Math.min(window.devicePixelRatio||1,2)), h = sv.height/(Math.min(window.devicePixelRatio||1,2));
    svc.fillStyle = hsvToHex(hu,1,1);
    svc.fillRect(0,0,w,h);
    const gx = svc.createLinearGradient(0,0,w,0);
    gx.addColorStop(0,'rgba(255,255,255,1)'); gx.addColorStop(1,'rgba(255,255,255,0)');
    svc.fillStyle = gx; svc.fillRect(0,0,w,h);
    const gy = svc.createLinearGradient(0,0,0,h);
    gy.addColorStop(0,'rgba(0,0,0,0)'); gy.addColorStop(1,'rgba(0,0,0,1)');
    svc.fillStyle = gy; svc.fillRect(0,0,w,h);
    // cursor
    const cx = sa*w, cy = (1-va)*h;
    svc.beginPath(); svc.arc(cx,cy,8,0,Math.PI*2);
    svc.strokeStyle = '#fff'; svc.lineWidth = 2.5; svc.stroke();
    svc.beginPath(); svc.arc(cx,cy,8,0,Math.PI*2);
    svc.strokeStyle = 'rgba(0,0,0,.55)'; svc.lineWidth = 1; svc.stroke();
  }
  function drawHue(){
    const r = Math.min(window.devicePixelRatio||1,2);
    const w = hue.width/r, h = hue.height/r;
    const g = huec.createLinearGradient(0,0,w,0);
    for(let i=0;i<=6;i++) g.addColorStop(i/6, hsvToHex(i/6,1,1));
    huec.fillStyle = g; huec.fillRect(0,0,w,h);
    const x = hu*w;
    huec.beginPath();
    huec.rect(Math.max(1,Math.min(w-5,x-2)), 1, 4, h-2);
    huec.strokeStyle = '#fff'; huec.lineWidth = 2.5; huec.stroke();
    huec.strokeStyle = 'rgba(0,0,0,.55)'; huec.lineWidth = 1; huec.stroke();
  }
  function sync(fromHexField){
    current = hsvToHex(hu,sa,va);
    $('cpPrev').style.background = current;
    if(!fromHexField) $('cpHex').value = current;
    drawSV(); drawHue();
  }

  // pointer handling shared by both canvases
  function track(el, handler){
    let active = false;
    const run = e => {
      const r = el.getBoundingClientRect();
      handler(
        Math.max(0, Math.min(1, (e.clientX - r.left)/r.width)),
        Math.max(0, Math.min(1, (e.clientY - r.top)/r.height))
      );
      sync();
    };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); active = true;
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      run(e);
    });
    el.addEventListener('pointermove', e => { if(active){ e.preventDefault(); run(e); } });
    ['pointerup','pointercancel'].forEach(ev =>
      el.addEventListener(ev, () => { active = false; }));
  }
  track(sv, (x,y) => { sa = x; va = 1-y; });
  track(hue, (x) => { hu = x; });

  $('cpHex').oninput = e => {
    let v = e.target.value.trim();
    if(v && !v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){
      [hu,sa,va] = hexToHsv(v.toLowerCase());
      sync(true);
    }
  };
  $('cpOk').onclick = ()=>{ closeModal(); onPick(current); };
  $('cpCancel').onclick = closeModal;

  // canvases need layout before they can be sized
  requestAnimationFrame(()=>{ sizeCanvases(); sync(); });
}

function showPaletteManager(){
  const artColors = extractPaletteFromArt(32);
  openModal(`
    <h2>จัดการจานสี</h2>
    <p class="sub">${S.palette.length} สีในจานนี้ · เก็บไปกับโปรเจกต์</p>

    <div class="sec-lbl">สีในจาน — แตะเพื่อลบ</div>
    <div class="pal-grid" id="pmGrid"></div>

    <div class="cp-foot" style="margin-bottom:10px">
      <button class="cp-prev" id="pmPick" style="background:${S.color}" title="เลือกสี"></button>
      <div class="field" style="flex:1">
        <label>โค้ดสี (hex)</label>
        <input type="text" id="pmHex" value="${S.color}" placeholder="#rrggbb" maxlength="7" spellcheck="false">
      </div>
    </div>
    <button class="big-btn" id="pmAdd" style="margin-top:0">เพิ่มสีนี้</button>

    <div class="hr"></div>
    <div class="sec-lbl">ดูดสีจากงาน</div>
    ${artColors.length
      ? `<button class="preset-row" id="pmFromArt">
           <b>สีที่ใช้จริงในงาน (${artColors.length} สี)</b>
           <span class="strip">${artColors.slice(0,16).map(c=>`<i style="background:${c}"></i>`).join('')}</span>
         </button>
         <button class="sup-btn" id="pmMergeArt" style="margin-top:0">เพิ่มเข้าจานเดิม (ไม่แทนที่)</button>`
      : '<p class="empty-note">ยังไม่มีสีในงาน — วาดก่อนแล้วค่อยกลับมา</p>'}

    <div class="hr"></div>
    <div class="sec-lbl">ชุดสีสำเร็จรูป</div>
    <div id="pmPresets"></div>

    <div class="hr"></div>
    <button class="sup-btn" id="pmClear" style="margin-top:0;color:var(--danger)">ล้างจานสีทั้งหมด</button>
    <button class="big-btn ghost" id="pmClose">ปิด</button>
  `);

  function renderGrid(){
    const g = $('pmGrid');
    g.innerHTML = '';
    if(!S.palette.length){
      g.innerHTML = '<p class="empty-note" style="grid-column:1/-1">จานสีว่าง</p>';
      return;
    }
    S.palette.forEach((c, i)=>{
      const b = document.createElement('button');
      b.className = 'pc' + (c===S.color?' on':'');
      b.style.background = c;
      b.title = c.toUpperCase();
      b.innerHTML = '<span class="x">&times;</span>';
      b.onclick = ()=>{ removeColorFromPalette(i); renderGrid(); };
      g.appendChild(b);
    });
  }

  const pick = $('pmPick'), hex = $('pmHex');
  pick.onclick = ()=>{
    const cur = hex.value.trim() || S.color;
    // reopening the manager afterwards keeps the flow on one screen
    showColorPicker(/^#[0-9a-fA-F]{6}$/.test(cur) ? cur.toLowerCase() : S.color, chosen => {
      showPaletteManager();
      const h = $('pmHex'), pk = $('pmPick');
      if(h) h.value = chosen;
      if(pk) pk.style.background = chosen;
    });
  };
  hex.oninput = ()=>{
    let v = hex.value.trim();
    if(v && !v.startsWith('#')) v = '#' + v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)) pick.style.background = v.toLowerCase();
  };
  $('pmAdd').onclick = ()=>{
    let v = hex.value.trim().toLowerCase();
    if(v && !v.startsWith('#')) v = '#' + v;
    if(addColorToPalette(v)) renderGrid();
  };

  if($('pmFromArt')) $('pmFromArt').onclick = ()=>{
    if(!confirm(`แทนที่จานสีเดิมด้วย ${artColors.length} สีจากงาน?`)) return;
    applyPalette(artColors); renderGrid();
    toast(`ใช้ ${artColors.length} สีจากงานแล้ว`);
  };
  if($('pmMergeArt')) $('pmMergeArt').onclick = ()=>{
    const before = S.palette.length;
    const merged = S.palette.slice();
    for(const c of artColors) if(!merged.includes(c) && merged.length < 64) merged.push(c);
    applyPalette(merged); renderGrid();
    toast(`เพิ่ม ${merged.length - before} สีใหม่`);
  };

  const pr = $('pmPresets');
  const CHAR_KEYS = ['ผิว: ขาว','ผิว: สองสี','ผิว: แทน','ผิว: เข้ม','ผิว: ดำ','ผม','ตา + ปาก','เสื้อผ้า','ชุดวาดคน (รวม)'];
  const groups = [
    ['ทั่วไป', Object.keys(PRESET_PALETTES).filter(k => !CHAR_KEYS.includes(k))],
    ['สำหรับวาดคน', CHAR_KEYS]
  ];

  for(const [gname, keys] of groups){
    const gl = document.createElement('div');
    gl.className = 'sec-lbl';
    gl.style.marginTop = '10px';
    gl.textContent = gname;
    pr.appendChild(gl);

    for(const name of keys){
      const colors = PRESET_PALETTES[name];
      if(!colors) continue;
      const isChar = CHAR_KEYS.includes(name);
      const b = document.createElement('button');
      b.className = 'preset-row';
      b.innerHTML = `<b>${name} (${colors.length})</b>
        <span class="strip">${colors.slice(0,18).map(c=>`<i style="background:${c}"></i>`).join('')}</span>
        ${isChar ? '<span class="pr-hint">แตะ = เพิ่มเข้าจาน · กดค้าง = แทนที่</span>' : ''}`;

      if(isChar){
        // character sets are usually combined (skin + hair + cloth),
        // so a plain tap merges instead of wiping what you already picked
        let lp = null, didLong = false;
        b.addEventListener('pointerdown', ()=>{
          didLong = false;
          lp = setTimeout(()=>{
            didLong = true;
            if(navigator.vibrate) navigator.vibrate(14);
            applyPalette(colors.slice());
            renderGrid();
            toast('แทนที่ด้วย ' + name);
          }, 550);
        });
        ['pointerup','pointerleave','pointercancel'].forEach(ev =>
          b.addEventListener(ev, ()=>clearTimeout(lp)));
        b.onclick = ()=>{
          if(didLong) return;
          const merged = S.palette.slice();
          let added = 0;
          for(const c of colors){
            if(!merged.includes(c) && merged.length < 64){ merged.push(c); added++; }
          }
          if(!added){ toast('มีสีชุดนี้อยู่ครบแล้ว'); return; }
          applyPalette(merged);
          renderGrid();
          toast('เพิ่ม ' + added + ' สีจาก ' + name);
        };
      } else {
        b.onclick = ()=>{
          if(!confirm(`เปลี่ยนเป็นชุด "${name}"? จานสีเดิมจะถูกแทนที่`)) return;
          applyPalette(colors.slice());
          renderGrid();
          toast('ใช้ชุด ' + name);
        };
      }
      pr.appendChild(b);
    }
  }

  $('pmClear').onclick = ()=>{
    if(!confirm('ล้างจานสีทั้งหมด?')) return;
    applyPalette([]);
    renderGrid();
  };
  $('pmClose').onclick = closeModal;
  renderGrid();
}

function lsGet(key, dflt){
  try{ const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? dflt : v; }
  catch{ return dflt; }
}
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }

const mineAll  = ()          => lsGet(SH_MINE, {});
const mineAdd  = (slug, tok) => { const m = mineAll(); m[slug] = tok; lsSet(SH_MINE, m); };
const mineDrop = slug        => { const m = mineAll(); delete m[slug]; lsSet(SH_MINE, m); };
const likedAll = ()          => lsGet(SH_LIKED, []);
const likedAdd = slug        => { const l = likedAll(); if(!l.includes(slug)){ l.push(slug); lsSet(SH_LIKED, l.slice(-400)); } };

/* ---- สร้างภาพสำหรับอัปโหลด ---- */
/* same sheet, with the project embedded — used for sharing so a post can be
   reopened, not just looked at */
async function sheetDataURLShare(author){
  const {cols, rows, w, h} = sheetLayout();
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(let i=0;i<S.frameCount;i++){
    ctx.drawImage(flattenFrame(i), (i%cols)*S.W, Math.floor(i/cols)*S.H);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const out  = await pngWithProject(blob, {author});
  return await new Promise((res, rej)=>{
    const rd = new FileReader();
    rd.onload = ()=>res(rd.result);
    rd.onerror = ()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ'));
    rd.readAsDataURL(out);
  });
}
function sheetDataURL(){
  const {cols, rows, w, h} = sheetLayout();
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(let i=0;i<S.frameCount;i++){
    ctx.drawImage(flattenFrame(i), (i%cols)*S.W, Math.floor(i/cols)*S.H);
  }
  return c.toDataURL('image/png');
}
function gifDataURL(onProgress){
  return new Promise(async (resolve, reject)=>{
    if(typeof GIF === 'undefined') return reject(new Error('โหลด gif.js ไม่สำเร็จ — ตรวจอินเทอร์เน็ต'));
    let workerScript;
    try{ workerScript = await gifWorkerURL(); }
    catch(e){ return reject(e); }
    const scale = Math.max(1, Math.min(6, Math.floor(256/Math.max(S.W, S.H))));
    const gif = new GIF({
      workers: 2, quality: 1, width: S.W*scale, height: S.H*scale,
      workerScript
    });
    for(let i=0;i<S.frameCount;i++){
      const c = document.createElement('canvas');
      c.width = S.W*scale; c.height = S.H*scale;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(flattenFrame(i), 0, 0, c.width, c.height);
      gif.addFrame(c, {delay: 1000/S.fps});
    }
    if(onProgress) gif.on('progress', p => onProgress(Math.round(p*100)));
    gif.on('finished', blob => {
      const fr = new FileReader();
      fr.onload  = ()=>resolve(fr.result);
      fr.onerror = ()=>reject(new Error('อ่านไฟล์ GIF ไม่สำเร็จ'));
      fr.readAsDataURL(blob);
    });
    gif.render();
  });
}

/* ---- เรียก API ---- */
async function apiCall(url, opts){
  const r = await fetch(url, opts);
  let data = null;
  try{ data = await r.json(); }catch{}
  if(!r.ok || !data || data.ok === false){
    throw new Error((data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ (' + r.status + ')');
  }
  return data;
}
