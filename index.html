/* A post can carry its project two ways: as a field on the post, or inside the
   PNG. Try both, and when neither works say which step failed — "remix ไม่ได้"
   with no reason is impossible to act on. */
async function loadPostProject(p){
  if(p.project){
    try{ return await unpackProjectText(p.project); }
    catch{ /* fall through */ }
  }
  /* Ask our own API first: it's same-origin (no CORS to negotiate with the
     blob host) and it can dig the project out of the stored PNG server-side
     for posts made before the project column existed. */
  if(p.slug){
    try{
      const r = await apiCall(API_PROJECT + '?slug=' + encodeURIComponent(p.slug));
      if(r.project) return await unpackProjectText(r.project);
    }catch(err){
      const msg = err.message || '';
      // a definite "no project on this post" is the final answer; a network or
      // server error still deserves the image attempt below
      if(/ไม่มีข้อมูลโปรเจกต์|ฝังโปรเจกต์ไว้ไม่ได้/.test(msg)) throw new Error(msg);
    }
  }
  // an image CDN usually answers a ?w=... query with a re-encoded copy, so the
  // bare URL is worth a second try before giving up
  const urls = [p.url];
  if(p.url.includes('?')) urls.push(p.url.split('?')[0]);

  let lastErr = null;
  for(const url of urls){
    let bytes;
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      bytes = new Uint8Array(await res.arrayBuffer());
    }catch(err){
      lastErr = new Error('ดึงไฟล์ภาพไม่ได้ (' + (err.message || 'network') + ') — เปิดดูได้อย่างเดียว');
      continue;
    }
    if(!isPNG(bytes)){
      lastErr = new Error('ไฟล์ที่เซิร์ฟเวอร์ส่งกลับไม่ใช่ PNG — โปรเจกต์ที่ฝังไว้หลุดตอนอัปโหลด');
      continue;
    }
    try{
      const obj = await projectFromPNGBytes(bytes);
      if(obj) return obj;
      lastErr = new Error('ผลงานนี้ไม่มีโปรเจกต์ติดมา — แชร์ไว้ก่อนที่ฟีเจอร์นี้จะมี');
    }catch(err){
      lastErr = new Error('ข้อมูลโปรเจกต์ในไฟล์เสียหาย (' + (err.message || '') + ')');
    }
  }
  throw lastErr;
}

/* Every hop a remix depends on, checked one at a time. A single toast saying
   "ไม่ได้" is unactionable on a phone with no devtools — this says which hop
   broke and lets the result be copied out. */
async function diagnoseRemix(p){
  const steps = [];
  const add = (name, ok, note) => steps.push({name, ok, note});

  add('field project ที่มากับรายการ', !!p.project,
      p.project ? `${p.project.slice(0,3)}… ${p.project.length} ตัวอักษร`
                : 'ไม่มี (ปกติ — รายการแกลเลอรีไม่ส่งมาให้)');

  try{
    const r = await fetch(API_PROJECT + '?slug=' + encodeURIComponent(p.slug || ''));
    const txt = await r.text();
    let body = null;
    try{ body = JSON.parse(txt); }catch{}
    if(!body) add('GET /api/project', false, `HTTP ${r.status} · ตอบกลับไม่ใช่ JSON — endpoint ยังไม่ถูก deploy? · ${txt.slice(0,70)}`);
    else if(body.ok && body.project) add('GET /api/project', true, `HTTP ${r.status} · source=${body.source} · ${body.project.length} ตัวอักษร`);
    else add('GET /api/project', false, `HTTP ${r.status} · ${body.error || 'ไม่มี field project'}`);
  }catch(err){
    add('GET /api/project', false, 'ยิงไม่ถึง: ' + (err.message || 'network'));
  }

  try{
    const r = await fetch(p.url, {cache:'no-store'});
    const bytes = new Uint8Array(await r.arrayBuffer());
    add('ดึงไฟล์รูปตรงๆ จากเบราว์เซอร์', r.ok,
        `HTTP ${r.status} · ${(bytes.length/1024).toFixed(0)} KB · ${r.headers.get('content-type') || 'ไม่บอกชนิด'} · ${isPNG(bytes) ? 'เป็น PNG' : 'ไม่ใช่ PNG'}`);
    if(isPNG(bytes)){
      let obj = null;
      try{ obj = await projectFromPNGBytes(bytes); }catch{}
      add('chunk wadpixel ในไฟล์', !!obj,
          obj ? `เจอ · ${obj.w}×${obj.h} · ${(obj.layers||[]).length} เลเยอร์` : 'ไม่เจอ — ไฟล์นี้แชร์ตอนยังไม่มีฟีเจอร์ฝัง');
    }
  }catch(err){
    add('ดึงไฟล์รูปตรงๆ จากเบราว์เซอร์', false,
        'ล้มเหลว: ' + (err.message || 'network') + ' — มักเป็น CORS ของโฮสต์รูป');
  }
  return steps;
}

async function showRemixReport(p, firstError){
  openModal(`

    <p class="sub"><b>${esc(p.title || '')}</b> · slug <b>${esc(p.slug || '-')}</b> · build ${BUILD_ID}</p>

    <button class="big-btn ghost" id="rrCopy">คัดลอกผลตรวจ</button>
    <button class="big-btn ghost" id="rrClose">ปิด</button>
  `);
  const steps = await diagnoseRemix(p);
  const lines = steps.map(s => `${s.ok ? '✅' : '❌'} ${s.name}\n   ${s.note}`);
  const plain = [`build ${BUILD_ID}`, `slug ${p.slug}`, `kind ${p.kind}`, `url ${p.url}`,
                 `error ${firstError || '-'}`, ...lines].join('\n');
  const body = $('rrBody');

    `${s.ok ? '✅' : '❌'} <b>${esc(s.name)}</b><br><span style="color:var(--dim)">${esc(s.note)}</span>`
  ).join('<br><br>');
  const c = $('rrCopy');
  if(c) c.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(plain); toast('คัดลอกแล้ว'); }
    catch{ toast('คัดลอกไม่ได้ — จับภาพหน้าจอส่งมาก็ได้'); }
  };
  const cl = $('rrClose');
  if(cl) cl.onclick = closeModal;
}

/* Running admin-init needs a POST with the secret key. On a phone there's no
   curl and no dev console, so the app does the POST itself. The key is only
   held in the input for the length of the request — never stored. */
function showServerInit(){
  openModal(`
    <h2>ตั้งค่าเซิร์ฟเวอร์ครั้งแรก</h2>
    <p class="sub">สร้าง/อัปเดตตารางในฐานข้อมูล ทำครั้งเดียวหลัง deploy · รันซ้ำได้ไม่พัง</p>

    <div class="sec-lbl">ADMIN_KEY</div>
    <input id="siKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="ค่าที่ตั้งไว้ใน Vercel → Environment Variables"
           style="width:100%;height:44px;padding:0 12px;border-radius:10px;background:var(--panel-2);
                  color:var(--fg);border:1px solid var(--line);font-size:13px;margin-bottom:6px">
    <p class="sub" style="font-size:10.5px;margin-bottom:14px">
      ต้องตั้ง env ชื่อ <b>ADMIN_KEY</b> ใน Vercel แล้ว redeploy ก่อน · คีย์นี้ไม่ถูกเก็บไว้ในเครื่อง
    </p>

    <div class="rz-preview" id="siOut" style="display:none"></div>

    <button class="big-btn" id="siGo">รันเลย</button>
    <button class="big-btn ghost" id="siClose">ปิด</button>
  `);

  const out = (msg, ok) => {
    const o = $('siOut');
    o.style.display = '';
    o.innerHTML = msg;
    o.style.color = ok ? 'var(--accent-2)' : 'var(--danger, #ff6b6b)';
  };

  $('siGo').onclick = async ()=>{
    const key = $('siKey').value.trim();
    if(!key) return out('ใส่ ADMIN_KEY ก่อน', false);
    const btn = $('siGo');
    btn.disabled = true; btn.textContent = 'กำลังรัน…';
    try{
      // key rides in the query string exactly as admin-init reads it
      const r = await fetch(API_INIT + '?key=' + encodeURIComponent(key), {method:'POST'});
      let body = null;
      try{ body = await r.json(); }catch{}
      if(r.ok && body && body.ok){
        out('✅ สำเร็จ — ตารางพร้อมแล้ว ลองแชร์งานได้เลย', true);
        toast('ตั้งค่าเซิร์ฟเวอร์สำเร็จ');
      } else if(r.status === 401 || (body && body.error === 'unauthorized')){
        out('❌ ADMIN_KEY ไม่ตรง — เช็คค่าใน Vercel แล้วลองใหม่<br><span style="color:var(--dim);font-size:10.5px">ถ้าเพิ่งตั้ง env ต้อง redeploy ก่อนค่าใหม่ถึงจะมีผล</span>', false);
      } else if(r.status === 405){
        out('❌ endpoint ตอบ method not allowed — เวอร์ชัน API ที่ deploy อาจยังเก่า', false);
      } else {
        out('❌ ' + ((body && body.error) || ('เซิร์ฟเวอร์ตอบ HTTP ' + r.status)) + '<br><span style="color:var(--dim);font-size:10.5px">ถ้าเป็น 500 มักเป็นฐานข้อมูลต่อไม่ติด — เช็ค env DATABASE_URL และ Neon ว่าตื่นอยู่</span>', false);
      }
    }catch(err){
      out('❌ ยิงไม่ถึงเซิร์ฟเวอร์: ' + (err.message || 'network'), false);
    }finally{
      btn.disabled = false; btn.textContent = 'รันอีกครั้ง';
    }
  };
  $('siClose').onclick = closeModal;
}

/* ══════ หน้าแกลเลอรี ══════ */
function showGallery(sort){
  let mode   = sort === 'top' ? 'top' : 'new';
  let cursor = null;
  let loading = false;
  let done   = false;

  openModal(`
    <h2>แกลเลอรีชุมชน</h2>
    <p class="sub">ผลงานที่คนอื่นแชร์ไว้ · แตะหัวใจให้กำลังใจได้</p>
    <div class="gal-tabs">
      <button data-s="new">ใหม่ล่าสุด</button>
      <button data-s="top">ยอดนิยม</button>
    </div>
    <div id="galGrid"></div>
    <p id="galStatus"></p>
    <button class="big-btn ghost" id="galMore" style="display:none">โหลดเพิ่ม</button>
    <button class="big-btn" id="galShare">แชร์ผลงานของฉัน</button>
    <button class="big-btn ghost" id="galClose">ปิด</button>
  `);

  const grid = $('galGrid');
  const stat = msg => { const e = $('galStatus'); if(e) e.textContent = msg; };

  $('galClose').onclick = closeModal;
  $('galShare').onclick = ()=>{ closeModal(); setTimeout(showShare, 30); };
  $('galMore').onclick  = ()=>load();
  document.querySelectorAll('.gal-tabs button').forEach(b => b.onclick = ()=>{
    if(mode === b.dataset.s) return;
    mode = b.dataset.s; cursor = null; done = false;
    grid.innerHTML = '';
    syncTabs();
    load();
  });

  function syncTabs(){
    document.querySelectorAll('.gal-tabs button').forEach(b => b.classList.toggle('on', b.dataset.s === mode));
  }
  syncTabs();

  async function load(){
    if(loading || done) return;
    loading = true;
    const more = $('galMore'); if(more) more.style.display = 'none';
    stat(grid.children.length ? 'กำลังโหลดเพิ่ม…' : 'กำลังโหลด…');
    try{
      const q = new URLSearchParams({sort: mode, limit: '24'});
      if(cursor) q.set('cursor', cursor);
      const data = await apiCall(API_GALLERY + '?' + q);

      data.items.forEach(p => grid.appendChild(card(p)));
      cursor = data.nextCursor;
      done   = !cursor;

      if(!grid.children.length) stat('ยังไม่มีใครแชร์ผลงาน — เป็นคนแรกเลยไหม');
      else stat('');
      if(more) more.style.display = done ? 'none' : 'block';
    }catch(e){
      stat(e.message || 'โหลดไม่สำเร็จ');
    }
    loading = false;
  }

  function card(p){
    const mine  = mineAll()[p.slug];
    const liked = likedAll().includes(p.slug);
    const el = document.createElement('div');
    el.className = 'gal-card';
    el.innerHTML = `
      ${p.kind === 'gif' ? '<span class="badge">GIF</span>' : ''}
      <div class="im"><img src="${esc(p.url)}" alt="${esc(p.title)}" loading="lazy"></div>
      <div class="meta">
        <b>${esc(p.title)}</b>
        <span>${esc(p.author)} · ${p.w}×${p.h} · ${p.frames} เฟรม</span>
        <div class="row">
          <button class="lk ${liked ? 'liked' : ''}">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.9Z"/></svg>
            <span class="n">${p.likes}</span>
          </button>
          ${p.kind === 'gif' ? '<button class="op">เปิด</button>' : '<button class="op rmx">รีมิกซ์</button>'}
          ${mine ? '<button class="del">ลบ</button>' : ''}
        </div>
      </div>`;

    el.querySelector('.lk').onclick = async ev => {
      const btn = ev.currentTarget;
      if(btn.classList.contains('liked')) return;
      btn.classList.add('liked');
      try{
        const r = await apiCall(API_LIKE, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({slug: p.slug})
        });
        btn.querySelector('.n').textContent = r.likes;
        likedAdd(p.slug);
      }catch(e){
        btn.classList.remove('liked');
        toast(e.message || 'กดไลก์ไม่สำเร็จ');
      }
    };

    // posts made by newer builds carry their project inside the PNG; older
    // ones (or a host that re-encodes uploads) don't, so say so plainly
    const op = el.querySelector('.op:not(.rmx)');
    if(op) op.onclick = ()=>window.open(p.url, '_blank', 'noopener,noreferrer');

    const rmx = el.querySelector('.rmx');
    if(rmx) rmx.onclick = async ()=>{
      const label = rmx.textContent;
      rmx.textContent = 'กำลังโหลด…';
      rmx.disabled = true;
      try{
        const obj = await loadPostProject(p);
        if(dirtySinceSave && !confirm('งานที่ทำอยู่ยังไม่ได้เซฟ จะเปิดผลงานนี้แทนไหม?')) throw new Error('');
        obj.name = (obj.name || p.title) + ' (รีมิกซ์)';
        obj.by = obj.by || p.author;
        openSharedProject(obj);
      }catch(err){
        rmx.textContent = label;
        rmx.disabled = false;
        if(err.message) showRemixReport(p, err.message);
      }
    };

    const del = el.querySelector('.del');
    if(del) del.onclick = async ()=>{
      if(!confirm('ลบ "' + p.title + '" ออกจากแกลเลอรี?')) return;
      try{
        await apiCall(API_SHARE + '?slug=' + encodeURIComponent(p.slug) +
                      '&token=' + encodeURIComponent(mine), {method:'DELETE'});
        mineDrop(p.slug);
        el.remove();
        toast('ลบแล้ว');
        if(!grid.children.length) stat('ยังไม่มีใครแชร์ผลงาน — เป็นคนแรกเลยไหม');
      }catch(e){ toast(e.message || 'ลบไม่สำเร็จ'); }
    };

    return el;
  }

  load();
}

$('btnLayers').onclick = ()=>{ $('drawer').classList.add('on'); $('scrim').classList.add('on'); renderLayers(); };

(function wireRefBar(){
  const cur = ()=> { const L = S.layers[S.curLayer]; return (L && L.ref && L.src) ? L : null; };
  $('rfScale').oninput = e => { const L = cur(); if(L) setRefScale(L, (+e.target.value)/100); };
  $('rfMinus').onclick = ()=> { const L = cur(); if(L) setRefScale(L, L.xf.s/1.15); };
  $('rfPlus').onclick  = ()=> { const L = cur(); if(L) setRefScale(L, L.xf.s*1.15); };
  $('rfFit').onclick   = ()=> {
    const L = cur(); if(!L) return;
    refFit(L); renderRefLayer(L);
    bufDirty = true; renderView(); updateRefBar(); refreshThumbs(); markProjectDirty();
  };
  const flipRef = kind => {
    const L = cur(); if(!L) return;
    flipRefLayer(L, kind);
    bufDirty = true; renderView(); refreshThumbs(); markProjectDirty();
  };
  $('rfFlipH').onclick = ()=> flipRef('flipH');
  $('rfFlipV').onclick = ()=> flipRef('flipV');
  $('rfDone').onclick  = ()=> {
    // hop back to the nearest layer that can actually be drawn on
    for(let i = S.layers.length-1; i >= 0; i--){
      if(!S.layers[i].ref){ S.curLayer = i; renderLayers(); renderView(); return; }
    }
    toast('ยังไม่มีเลเยอร์วาดปกติ — กด + เพิ่ม');
  };
  $('rfHide').onclick  = ()=> {
    const L = cur(); if(!L) return;
    L.visible = !L.visible;
    bufDirty = true; renderAll();
  };
})();

function updateSelBar(){
  const bar = $('selBar');
  const on = (S.tool === 'select');
  bar.classList.toggle('on', on);
  syncBarStack();
  if(!on) return;
  const has = !!(S.sel || S.float);
  bar.querySelectorAll('button').forEach(b=>{
    const a = b.dataset.a;
    if(a === 'paste') b.disabled = !S.clip;
    else if(a === 'done') b.disabled = false;
    else b.disabled = !has;
  });
}
$('selBar').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  const a = b.dataset.a;
  if(a === 'cut') cutSelection();
  else if(a === 'copy') copySelection();
  else if(a === 'paste') pasteClip();
  else if(a === 'flipH') transformSelection('flipH');
  else if(a === 'flipV') transformSelection('flipV');
  else if(a === 'del') deleteSelection();
  else if(a === 'done'){ commitFloat(); S.sel = null; markDirty(); }
  updateSelBar();
});

const TOOL_KEYS = {b:'pencil', e:'eraser', g:'fill', i:'picker', l:'line', r:'rect', m:'select', v:'select'};
document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const mod = e.ctrlKey || e.metaKey;
  // e.key arrives uppercase while Shift is held, which broke Ctrl+Shift+Z
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if(mod){
    if(k==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if(k==='y'){ e.preventDefault(); redo(); return; }
    if(k==='s'){ e.preventDefault(); showSaveLoad(); return; }
    if(k==='a'){ e.preventDefault(); selectAll(); updateSelBar(); return; }
    if(k==='c'){ e.preventDefault(); copySelection(); updateSelBar(); return; }
    if(k==='x'){ e.preventDefault(); cutSelection(); updateSelBar(); return; }
    if(k==='v'){ e.preventDefault(); pasteClip(); updateSelBar(); return; }
    return;   // every other modifier combo belongs to the browser
  }

  if(k==='Escape'){ commitFloat(); S.sel=null; markDirty(); updateSelBar(); return; }
  if((k==='Delete'||k==='Backspace') && (S.sel||S.float)){ e.preventDefault(); deleteSelection(); updateSelBar(); return; }
  if(S.sel || S.float){
    const arrows = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
    if(arrows[k]){ e.preventDefault(); nudgeFloat(...arrows[k]); return; }
  }
  if(k==='[' || k===']'){ e.preventDefault(); stepBrush(k===']' ? 1 : -1); return; }
  if(k==='k'){ e.preventDefault(); $('btnLock').click(); return; }
  if(k===','){ e.preventDefault(); stepShade(-1); return; }
  if(k==='.'){ e.preventDefault(); stepShade(1); return; }
  if(TOOL_KEYS[k]){ selectTool(TOOL_KEYS[k]); return; }
  if(k===' '){ e.preventDefault(); togglePlay(); }
});

/* drag & drop an image or project file straight onto the canvas */
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  document.body.style.outline = '2px dashed var(--accent)';
  document.body.style.outlineOffset = '-6px';
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  if(ev === 'dragleave' && e.relatedTarget) return;
  document.body.style.outline = '';
}));
document.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  if(/\.json$/i.test(f.name)){ importProjectFile(f); return; }
  offerEmbedded(f).then(handled => {
    if(handled) return;
    toast('กำลังอ่านภาพ…');
    return loadImageFile(f)
      .then(img => showImportImage(img))
      .catch(err => toast(err.message, 3200));
  });
});

let lastAnts = 0;
(function antsLoop(now){
  requestAnimationFrame(antsLoop);
  if(!selNeedsAnim || !(S.sel || S.float)) return;
  if(now - lastAnts < 66) return;   // ~15fps — plenty for marching ants, 4x less redraw
  lastAnts = now;
  renderView();
})(0);
