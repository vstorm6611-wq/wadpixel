<style>
:root{
  --ink:#0d0e14;
  --panel:#171923;
  --panel-2:#1f2230;
  --line:#2c3040;
  --text:#e6e8f0;
  --dim:#858ba3;
  --accent:#7c5cff;
  --accent-2:#00d9a3;
  --danger:#ff5d73;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--text);
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  user-select:none;-webkit-user-select:none;
  font-size:14px;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}

/* ---------- TOP BAR ---------- */
#topbar{
  height:52px;flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:0 7px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30;
  overflow:hidden;
}
.tb-btn{
  flex:0 0 auto;min-width:40px;height:38px;padding:0 9px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--panel-2);color:var(--text);font-size:12px;font-weight:500;
  transition:background .12s,transform .08s;
}
.tb-btn:active{transform:scale(.94);background:var(--line)}
.tb-btn[disabled]{opacity:.32;pointer-events:none}
.tb-btn.on{background:var(--accent);color:#fff}
#logoWrap{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;padding-left:2px;margin-right:2px}
.logo-mark{background:var(--logo) center/contain no-repeat;image-rendering:pixelated;flex:0 0 auto}
#logoIc{width:24px;height:24px}
#logo{font-weight:700;font-size:15px;letter-spacing:-.3px;
  background:linear-gradient(92deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;flex:0 1 auto;overflow:hidden}
.spacer{flex:1;min-width:0}
@media (max-width:430px){
  #logo{display:none}
  #topbar{gap:4px;padding:0 6px}
  .tb-btn{min-width:38px;padding:0 7px}
}
@media (max-width:389px){
  #topbar{gap:2px;padding:0 4px}
  .tb-btn{min-width:34px;padding:0 4px}
  #btnExport{font-size:11px;padding:0 7px}
}
@media (max-width:339px){
  /* last resort: let the bar scroll rather than clip the Export button */
  #topbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #topbar::-webkit-scrollbar{display:none}
}

/* ---------- STAGE ---------- */
#stage{flex:1;position:relative;overflow:hidden;background:
  linear-gradient(45deg,#101119 25%,transparent 25%,transparent 75%,#101119 75%),
  linear-gradient(45deg,#101119 25%,#0a0b10 25%,#0a0b10 75%,#101119 75%);
  background-size:28px 28px;background-position:0 0,14px 14px;}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;}
#minimap{
  position:absolute;top:10px;right:10px;width:82px;height:82px;
  transition:transform .26s cubic-bezier(.3,.8,.4,1);
  background:rgba(13,14,20,.86);border:1px solid var(--line);border-radius:8px;
  padding:4px;z-index:12;touch-action:none;backdrop-filter:blur(8px);
}
#mmCanvas{width:100%;height:100%;image-rendering:pixelated;display:block;border-radius:4px}
#zoomTag{
  position:absolute;top:10px;left:10px;z-index:12;
  transition:transform .26s cubic-bezier(.3,.8,.4,1);
  background:rgba(13,14,20,.86);border:1px solid var(--line);
  padding:5px 9px;border-radius:7px;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--dim);backdrop-filter:blur(8px);cursor:pointer;
}
#zoomTag:active{border-color:var(--accent)}
#zoomTag b{color:var(--text);font-weight:600}

/* ---------- REFERENCE BAR ---------- */
#refBar{
  position:absolute;left:8px;right:8px;bottom:8px;z-index:18;
  transform:translateY(150%);transition:transform .22s cubic-bezier(.3,.8,.4,1);
  background:rgba(23,25,35,.94);border:1px solid var(--line);border-radius:12px;
  padding:7px 9px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.45);
  display:flex;flex-direction:column;gap:6px;
}
#refBar.on{transform:translateY(0)}
#refBar .rf-top{display:flex;align-items:center;gap:8px;min-width:0}
#refBar .rf-nm{
  flex:1;min-width:0;font-size:11px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#refBar .rf-nm b{color:var(--text);font-weight:600}
#refBar .rf-row{display:flex;align-items:center;gap:7px}
#refBar .rf-step{
  flex:0 0 auto;width:34px;height:32px;border-radius:8px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);
}
#refBar .rf-step:active{background:var(--line);transform:scale(.92)}
#refBar .rf-txt{
  flex:0 0 auto;height:32px;padding:0 10px;border-radius:8px;background:var(--panel-2);
  display:flex;align-items:center;font-size:11px;color:var(--text);white-space:nowrap;
}
#refBar .rf-txt:active{background:var(--line)}
#refBar input[type=range]{
  flex:1;min-width:0;-webkit-appearance:none;height:3px;border-radius:2px;
  background:var(--line);outline:none;
}
#refBar input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);
}
#refBar input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--accent)}
#refBar .rf-val{
  flex:0 0 auto;font-size:11px;color:var(--dim);min-width:44px;text-align:right;
  font-variant-numeric:tabular-nums;
}

/* ---------- TIMELINE ---------- */
#timeline{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:7px 8px 6px;z-index:20;
}

/* Grabber — the bottom chrome costs ~260px of a ~700px phone screen, which is
   most of the drawing surface. One tap parks all of it. */
#chromeGrab{
  flex:0 0 auto;height:18px;background:var(--panel);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;z-index:21;
}
#chromeGrab i{width:34px;height:4px;border-radius:2px;background:var(--line);transition:background .12s,width .12s}
#chromeGrab:active i{background:var(--accent)}
body.chrome-hidden #timeline,
body.chrome-hidden #tools,
body.chrome-hidden #recentBar,
body.chrome-hidden #palette{display:none}
body.chrome-hidden #chromeGrab{height:calc(24px + env(safe-area-inset-bottom));align-items:flex-start;padding-top:10px}
body.chrome-hidden #chromeGrab i{background:var(--accent);width:46px}

/* A single-frame project doesn't need a filmstrip of one thumbnail */
#btnAddFrameHead{display:none}
body.solo-frame #frames{display:none}
body.solo-frame #tlHead{margin-bottom:0}
body.solo-frame #fpsWrap{display:none}
body.solo-frame #btnAddFrameHead{display:flex}

/* Landscape and small phones: give the canvas back what the chrome is
   hoarding, rather than letting the stage collapse to a strip */
@media (max-height:560px){
  #topbar{height:46px}
  #tools{padding:5px 8px}
  .tool{width:38px;height:38px}
  .frame,#addFrame{width:40px;height:40px}
  #palette{padding:5px 8px calc(6px + env(safe-area-inset-bottom))}
  .sw{width:30px;height:30px}
  #curColor{width:34px;height:34px}
  #timeline{padding:5px 8px 4px}
}
#tlHead{
  display:flex;align-items:center;gap:7px;margin-bottom:6px;height:26px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#tlHead::-webkit-scrollbar{display:none}
#tlHead .tb-btn{flex:0 0 auto}
#tlHead .lbl{flex:0 0 auto}
#tlHead .lbl{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);font-weight:600}
#fpsWrap{display:flex;align-items:center;gap:7px;flex:1 1 90px;min-width:90px;max-width:180px}
#fps{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:var(--line);outline:none}
#fps::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent-2);cursor:pointer}
#fps::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--accent-2)}
#fpsVal{font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
#frames{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px;scrollbar-width:none}
#frames::-webkit-scrollbar{display:none}
.frame{
  flex:0 0 auto;width:52px;height:52px;border-radius:8px;border:2px solid var(--line);
  background:#fff;position:relative;overflow:hidden;transition:border-color .12s,transform .08s;
  touch-action:none;-webkit-touch-callout:none;
}
.frame:active{transform:scale(.93)}
.frame.sel{border-color:var(--accent-2);box-shadow:0 0 0 2px rgba(0,217,163,.22)}
.frame canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.frame .n{
  position:absolute;bottom:0;left:0;right:0;font-size:9px;text-align:center;
  background:rgba(13,14,20,.78);color:#fff;font-weight:600;padding:1px 0;line-height:1.3
}
/* while a frame is held, the strip must stop scrolling or the drag just pans */
#frames.reordering{overflow-x:hidden;touch-action:none}
.frame.dragging{
  border-color:var(--accent-2);box-shadow:0 6px 18px rgba(13,14,20,.32);
  opacity:.94;z-index:3;transition:none
}
.frame.dragging,.frame.dragging:active{transform:scale(1.1)}
#addFrame{
  flex:0 0 auto;width:52px;height:52px;border-radius:8px;border:2px dashed var(--line);
  color:var(--dim);font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:300;
}
#addFrame:active{border-color:var(--accent-2);color:var(--accent-2)}

/* ---------- TOOLBAR ---------- */
#tools{
  flex:0 0 auto;display:flex;gap:5px;padding:7px 8px;background:var(--panel);
  border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:20;
}
#tools::-webkit-scrollbar{display:none}
.tool{
  flex:0 0 auto;width:var(--tap);height:var(--tap);border-radius:11px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;transition:background .12s,transform .08s;
}
.tool:active{transform:scale(.9)}
.tool.on{background:var(--accent)}
.tool svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.on svg{stroke:#fff}
.tool.fill svg{fill:var(--text);stroke:none}
.tool.on.fill svg{fill:#fff}
.tool{position:relative}
.sym-tag{
  position:absolute;right:2px;bottom:1px;font-size:8px;line-height:1;color:var(--accent-2);
  font-weight:700;pointer-events:none;
}
.tool.on .sym-tag{color:#fff}

/* ---------- PALETTE ---------- */
#palette{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:7px 8px calc(9px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:20;
}
#palette::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:2px solid transparent;transition:transform .08s}
.sw:active{transform:scale(.88)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--accent-2)}
#curColor{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);
  position:relative;overflow:hidden;transition:transform .08s;
}
#curColor:active{transform:scale(.9)}
.divider{flex:0 0 auto;width:1px;height:26px;background:var(--line);margin:0 2px}

/* ---------- LAYER DRAWER ---------- */
#scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:268px;max-width:82vw;background:var(--panel);
  border-right:1px solid var(--line);z-index:41;transform:translateX(-100%);
  transition:transform .22s cubic-bezier(.3,.8,.4,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
#drawer.on{transform:translateX(0)}
#drawerHead{
  height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;border-bottom:1px solid var(--line);
}
#drawerHead h2{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:600}
#layerList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.layer{
  background:var(--panel-2);border:1px solid transparent;border-radius:10px;padding:8px;
  display:flex;flex-direction:column;gap:6px;transition:border-color .12s;
}
.layer.sel{border-color:var(--accent-2)}
.layer .row1{display:flex;align-items:center;gap:8px}
.layer .thumb{width:34px;height:34px;border-radius:6px;background:#fff;overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
.layer .thumb canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.layer .nm{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:none;color:var(--text);min-width:0;padding:2px 0}
.layer .eye{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.layer .eye svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.8}
.layer.hidden .eye svg{stroke:var(--dim);opacity:.45}
.layer.hidden .thumb{opacity:.3}
.layer .row2{display:flex;align-items:center;gap:6px}
.layer .op{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:var(--line);outline:none}
.layer .op::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
.layer .op::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent)}
.layer .opv{font-size:10px;color:var(--dim);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.layer .mv{width:26px;height:26px;border-radius:6px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.layer .mv:active{background:var(--line)}
.layer.isref{border-style:dashed;border-color:var(--dim)}
.layer .reftag{flex:0 0 auto;font-size:9px;letter-spacing:.3px;padding:3px 6px;border-radius:5px;
  background:var(--panel);color:var(--dim);border:1px solid var(--line)}
.layer .reftag.on{background:var(--accent-2);color:#fff;border-color:transparent}
.layer.isref .nm{color:var(--dim);font-style:italic}
#drawerFoot{flex:0 0 auto;padding:8px;border-top:1px solid var(--line);display:flex;gap:6px}
#drawerFoot .tb-btn{flex:1;min-width:0;font-size:11.5px;padding:0 6px;white-space:nowrap}
#drawerFoot .tb-btn{flex:1;height:38px}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,6,10,.78);backdrop-filter:blur(6px)}
#modal.on{display:flex}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;
  width:100%;max-width:330px;max-height:86vh;overflow-y:auto;
}
.card h2{font-size:17px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.card p.sub{font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.5}
.fieldrow{display:flex;gap:10px;margin-bottom:12px}
.field{flex:1}
.field label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:600}
.field input{
  width:100%;height:42px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:0 11px;font-size:15px;font-family:inherit;font-variant-numeric:tabular-nums;
}
.field input:focus{outline:none;border-color:var(--accent)}
.presets{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.preset{
  flex:1;min-width:62px;height:36px;border-radius:9px;background:var(--panel-2);
  font-size:12px;font-weight:500;color:var(--dim);transition:background .12s;
}
.preset:active{background:var(--accent);color:#fff}
.big-btn{
  width:100%;height:46px;border-radius:11px;background:var(--accent);color:#fff;
  font-weight:600;font-size:14px;transition:transform .08s;margin-top:4px;
}
.big-btn:active{transform:scale(.97)}
.big-btn.ghost{background:var(--panel-2);color:var(--text);margin-top:8px}
.warn{font-size:11px;color:var(--danger);margin-top:8px;line-height:1.45;display:none}
.warn.on{display:block}
.exp-opt{
  width:100%;padding:13px;border-radius:11px;background:var(--panel-2);margin-bottom:8px;
  display:flex;align-items:center;gap:11px;text-align:left;transition:background .12s;
}
.exp-opt:active{background:var(--line)}
.exp-opt .ic{width:36px;height:36px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;letter-spacing:-.3px}
.exp-opt .tx b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.exp-opt .tx span{font-size:11px;color:var(--dim);line-height:1.4}
#expStatus{font-size:12px;color:var(--accent-2);text-align:center;margin-top:10px;min-height:16px}

/* ---------- SAVE / LOAD ---------- */
.proj{
  width:100%;padding:10px;border-radius:11px;background:var(--panel-2);margin-bottom:7px;
  display:flex;align-items:center;gap:10px;text-align:left;transition:background .12s;
}
.proj:active{background:var(--line)}
.proj .pth{width:42px;height:42px;border-radius:8px;background:#fff;overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
.proj .pth canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.proj .pi{flex:1;min-width:0}
.proj .pi b{display:block;font-size:13px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .pi span{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.proj .pdel{width:32px;height:32px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.proj .pdel:active{background:var(--danger);color:#fff}
.proj .pdel svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.empty-note{text-align:center;color:var(--dim);font-size:12px;padding:22px 10px;line-height:1.6}
#saveDot{
  position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--accent-2);opacity:0;transition:opacity .25s;pointer-events:none;
}
#saveDot.on{opacity:1}
#btnSave{position:relative}
.quota{font-size:10.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5}
.quota b{color:var(--text);font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0 12px}
.sec-lbl{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:8px}

/* ---------- IMAGE → PIXEL ---------- */
.px-stage{
  display:flex;align-items:center;justify-content:center;min-height:110px;
  padding:10px;margin-bottom:12px;border-radius:10px;
  background:
    linear-gradient(45deg,#252836 25%,transparent 25%,transparent 75%,#252836 75%) 0 0/14px 14px,
    linear-gradient(45deg,#252836 25%,transparent 25%,transparent 75%,#252836 75%) 7px 7px/14px 14px,
    var(--panel-2);
}
#pxCv{width:100%;max-height:240px;object-fit:contain;image-rendering:pixelated}
#brPrev{width:120px;image-rendering:pixelated}
#flKind button{font-size:11.5px;padding:0 2px}
#flScope button:disabled{opacity:.35}
#pxSize button,#pxSize2 button,#pxCol button{font-size:11.5px;padding:0 2px;white-space:nowrap}
.px-sizes{margin-bottom:5px}
.px-fit{
  width:100%;height:34px;margin-bottom:14px;border-radius:10px;background:var(--panel-2);
  color:var(--dim);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.px-fit.on{background:var(--accent);color:#fff}
.px-fit b{font-variant-numeric:tabular-nums}
.lock-row.off{opacity:.4}
.lock-row input:disabled{cursor:not-allowed}

/* ---------- RESIZE ---------- */
.seg{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:11px;margin-bottom:14px}
.seg button{
  flex:1;height:36px;border-radius:8px;font-size:12px;font-weight:600;color:var(--dim);
  transition:background .12s,color .12s;
}
.seg button.on{background:var(--accent);color:#fff}
#anchorGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:112px;margin:0 auto 6px;
}
#anchorGrid button{
  aspect-ratio:1;border-radius:7px;background:var(--panel-2);position:relative;
  transition:background .12s;
}
#anchorGrid button::after{
  content:'';position:absolute;inset:32%;border-radius:2px;background:var(--dim);opacity:.5;
}
#anchorGrid button.on{background:var(--accent)}
#anchorGrid button.on::after{background:#fff;opacity:1}
.anchor-lbl{text-align:center;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:8px}
.rz-preview{
  background:var(--panel-2);border-radius:10px;padding:11px;margin-bottom:12px;
  font-size:11.5px;color:var(--dim);line-height:1.65;
}
.rz-preview b{color:var(--text);font-variant-numeric:tabular-nums}
.rz-preview .warn-inline{color:var(--danger)}
.lock-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--dim)}
.lock-row input{width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto}
.mult{display:flex;gap:5px;margin-bottom:12px}
.mult button{
  flex:1;height:32px;border-radius:8px;background:var(--panel-2);font-size:11.5px;
  font-weight:600;color:var(--dim);transition:background .12s;
}
.mult button:active{background:var(--accent);color:#fff}

/* ---------- TAGS ---------- */
.tag-row{
  display:flex;gap:6px;align-items:center;background:var(--panel-2);
  border-radius:10px;padding:8px;margin-bottom:7px;
}
.tag-row input.tn{
  flex:1;min-width:0;height:34px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;color:var(--text);padding:0 9px;font-size:13px;font-family:inherit;
}
.tag-row input.tr{
  width:48px;height:34px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;color:var(--text);padding:0 6px;font-size:13px;text-align:center;
  font-variant-numeric:tabular-nums;font-family:inherit;
}
.tag-row input:focus{outline:none;border-color:var(--accent)}
.tag-row .dash{color:var(--dim);font-size:12px;flex:0 0 auto}
.tag-row .trm{
  width:32px;height:32px;border-radius:8px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;color:var(--dim);
}
.tag-row .trm:active{background:var(--danger);color:#fff}
.tag-row .trm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tag-err{font-size:11px;color:var(--danger);margin:-3px 0 8px;padding-left:4px;display:none}
.tag-err.on{display:block}

/* ---------- COLOUR PICKER ---------- */
.cp-wrap{margin-bottom:12px}
.cp-sv{
  width:100%;height:180px;display:block;border-radius:10px;
  border:1px solid var(--line);touch-action:none;cursor:crosshair;
}
.cp-hue{
  width:100%;height:26px;display:block;margin-top:8px;border-radius:7px;
  border:1px solid var(--line);touch-action:none;cursor:pointer;
}
.cp-foot{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.cp-prev{
  width:52px;height:42px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;
}
.cp-foot input{text-transform:uppercase;font-variant-numeric:tabular-nums}

/* ---------- RECENT COLOURS ---------- */
#recentBar{
  flex:0 0 auto;display:none;align-items:center;gap:5px;
  padding:6px 8px 0;background:var(--panel);
  overflow-x:auto;scrollbar-width:none;z-index:20;
}
#recentBar::-webkit-scrollbar{display:none}
#recentBar.on{display:flex}
#recentBar .rc-lbl{
  flex:0 0 auto;font-size:9px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--dim);font-weight:600;padding-right:2px;
}
#recentBar .rc{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:2px solid transparent;
  transition:transform .08s;
}
#recentBar .rc:active{transform:scale(.86)}
#recentBar .rc.on{border-color:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--accent-2)}

/* ---------- SHADE STEPPER ---------- */
.sw-shade{
  flex:0 0 auto;width:30px;height:34px;border-radius:9px;background:var(--panel-2);
  color:var(--text);font-size:18px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .08s;
}
.sw-shade:active{transform:scale(.88);background:var(--accent);color:#fff}
.shade-val{
  flex:0 0 auto;font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:52px;text-align:center;letter-spacing:-.2px;
}

/* ---------- PALETTE EXTRAS ---------- */
.sw-add{
  flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--panel-2);
  color:var(--dim);font-size:19px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background .12s,transform .08s;
}
.sw-add:active{transform:scale(.88);background:var(--accent);color:#fff}
.sw-add.mgr{font-size:0}
.sw-add.mgr svg{stroke:var(--dim)}
.sw-add.mgr:active svg{stroke:#fff}

.pal-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;
  margin-bottom:14px;
}
.pal-grid .pc{
  aspect-ratio:1;border-radius:8px;border:2px solid transparent;position:relative;
  transition:transform .08s;
}
.pal-grid .pc:active{transform:scale(.9)}
.pal-grid .pc.on{border-color:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent-2)}
.pal-grid .pc .x{
  position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:12px;line-height:18px;text-align:center;
  font-weight:600;
}
.preset-row{
  width:100%;padding:10px 12px;border-radius:10px;background:var(--panel-2);
  margin-bottom:7px;text-align:left;transition:background .12s;
}
.preset-row:active{background:var(--line)}
.preset-row b{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.preset-row .strip{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden}
.preset-row .strip i{flex:1;display:block}
.preset-row .pr-hint{display:block;font-size:9.5px;color:var(--dim);margin-top:5px}

/* ---------- SUPPORT ---------- */
.sup-btn{
  width:100%;height:44px;border-radius:11px;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel-2);color:var(--dim);font-size:12.5px;font-weight:500;
  transition:background .12s,color .12s,transform .08s;
}
.sup-btn:active{transform:scale(.97);background:var(--line)}
.sup-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sup-opt{
  width:100%;padding:13px;border-radius:11px;background:var(--panel-2);margin-bottom:8px;
  display:flex;align-items:center;gap:11px;text-align:left;transition:background .12s;
}
.sup-opt:active{background:var(--line)}
.sup-opt .ic{
  width:38px;height:38px;border-radius:9px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.sup-opt .tx b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.sup-opt .tx span{font-size:11px;color:var(--dim);line-height:1.4}
#qrBox{
  background:#fff;border-radius:12px;padding:12px;margin:4px 0 10px;
  display:none;
}
#qrBox.on{display:block}
#qrBox img{width:100%;display:block;image-rendering:auto}
#qrBox .cap{
  text-align:center;font-size:11px;color:#4a4f63;margin-top:8px;line-height:1.5;
}

/* ---------- SELECTION BAR ---------- */
#selBar{
  position:absolute;left:50%;transform:translateX(-50%) translateY(-80px);
  top:10px;z-index:16;display:flex;align-items:center;gap:2px;
  background:rgba(23,25,35,.94);border:1px solid var(--line);border-radius:12px;
  padding:5px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.45);
  transition:transform .22s cubic-bezier(.3,.8,.4,1);max-width:calc(100vw - 20px);
  overflow-x:auto;scrollbar-width:none;
}
#selBar::-webkit-scrollbar{display:none}
#selBar.on{transform:translateX(-50%) translateY(0)}
#selBar.pushed{transform:translateX(-50%) translateY(56px)}
#selBar button{
  flex:0 0 auto;min-width:46px;height:44px;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:background .12s,transform .08s;padding:0 4px;
}
#selBar button:active{transform:scale(.9);background:var(--line)}
#selBar button svg{width:17px;height:17px;stroke:var(--text);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#selBar button span{font-size:8.5px;color:var(--dim);letter-spacing:.2px;white-space:nowrap}
#selBar button[data-a="del"] svg{stroke:var(--danger)}
#selBar button[data-a="done"] svg{stroke:var(--accent-2)}
#selBar button[disabled]{opacity:.3;pointer-events:none}
#selBar .sb-div{flex:0 0 auto;width:1px;height:24px;background:var(--line);margin:0 3px}

/* ---------- RESTORE BAR ---------- */
#restoreBar{
  position:absolute;left:8px;right:8px;top:6px;
  transform:translateY(-130%);
  background:var(--panel-2);border:1px solid var(--accent);border-radius:12px;
  padding:8px 8px 8px 12px;z-index:22;display:flex;align-items:center;gap:9px;
  box-shadow:0 8px 26px rgba(0,0,0,.55);transition:transform .26s cubic-bezier(.3,.8,.4,1);
}
#restoreBar.on{transform:translateY(0)}
#restoreBar .rtx{font-size:12px;line-height:1.3;flex:1;min-width:0}
#restoreBar .rtx b{
  display:block;font-weight:600;font-size:12.5px;margin-bottom:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#restoreBar .rtx span{color:var(--dim);font-size:10.5px}
#restoreBar button{
  flex:0 0 auto;height:34px;padding:0 13px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:12.5px;font-weight:600;transition:transform .08s;
}
#restoreBar button:active{transform:scale(.94)}
#restoreBar .rx{background:transparent;color:var(--dim);padding:0 6px;font-size:19px;font-weight:400;min-width:32px}

/* ---------- GALLERY / SHARE ---------- */
.gal-tabs{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:11px;margin-bottom:12px}
.gal-tabs button{flex:1;height:34px;border-radius:8px;font-size:12px;font-weight:600;color:var(--dim);transition:background .12s,color .12s}
.gal-tabs button.on{background:var(--accent);color:#fff}
#galGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal-card{background:var(--panel-2);border-radius:11px;overflow:hidden;position:relative}
.gal-card .im{
  width:100%;aspect-ratio:1;background:
    linear-gradient(45deg,#23252f 25%,transparent 25%,transparent 75%,#23252f 75%),
    linear-gradient(45deg,#23252f 25%,#1a1c25 25%,#1a1c25 75%,#23252f 75%);
  background-size:14px 14px;background-position:0 0,7px 7px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.gal-card .im img{max-width:100%;max-height:100%;image-rendering:pixelated;display:block}
.gal-card .meta{padding:7px 8px 8px}
.gal-card .meta b{display:block;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-card .meta span{display:block;font-size:10px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-card .row{display:flex;gap:4px;margin-top:7px}
.gal-card .row button{
  flex:1;height:28px;border-radius:7px;background:var(--panel);font-size:10.5px;font-weight:600;
  color:var(--dim);display:flex;align-items:center;justify-content:center;gap:4px;transition:background .12s
}
.gal-card .row button:active{background:var(--line)}
.gal-card .row button.liked{color:var(--danger)}
.gal-card .row button.del:active{background:var(--danger);color:#fff}
.gal-card .row button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gal-card .row button.liked svg{fill:currentColor;stroke:none}
.gal-card .badge{
  position:absolute;top:5px;left:5px;background:rgba(13,14,20,.82);color:var(--accent-2);
  font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:2px 5px;border-radius:5px;backdrop-filter:blur(4px)
}
#galStatus{font-size:12px;color:var(--dim);text-align:center;margin-top:12px;min-height:16px;line-height:1.5}
.field input.txt{font-variant-numeric:normal}
.sh-pick{display:flex;gap:6px;margin-bottom:14px}
.sh-pick button{
  flex:1;padding:10px 6px;border-radius:10px;background:var(--panel-2);text-align:center;
  font-size:12px;font-weight:600;color:var(--dim);line-height:1.5;transition:background .12s,color .12s
}
.sh-pick button.on{background:var(--accent);color:#fff}
.sh-pick button small{display:block;font-size:9.5px;font-weight:500;opacity:.75;margin-top:1px}
#shPreview{
  background:var(--panel-2);border-radius:11px;padding:10px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;min-height:96px;max-height:150px;overflow:hidden
}
#shPreview img{max-width:100%;max-height:130px;image-rendering:pixelated;display:block}
#shStatus{font-size:12px;color:var(--accent-2);text-align:center;margin-top:10px;min-height:16px;line-height:1.5}
#shStatus.err{color:var(--danger)}
